const D    = s => new Date(s + 'T00:00:00Z');
const iso  = dt => dt.toISOString().slice(0, 10);

const tr   = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };

const haftaSonu = s => [0, 6].includes(D(s).getUTCDay());

/* Deterministik rastgele — demo her açılışta aynı veriyi üretsin */
function rng(seed) {
  return function () {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function tcUret(r) {           // 11 haneli sahte numara (gerçek doğrulama algoritmasına uymaz)
  let s = String(tamsayi(r, 1, 9));
  for (let i = 0; i < 10; i++) s += String(tamsayi(r, 0, 9));
  return s;
}
const sicilUret = r => String(tamsayi(r, 10000, 99999));
const telUret   = r => '5' + tamsayi(r, 30, 55) + ' ' + tamsayi(r, 100, 999) + ' ' + tamsayi(r, 1000, 9999);

function odalariUret(r) {
  const odalar = [], yataklar = [];
  let yid = 1;
  for (const t of TESISLER) {
    const tipler = [
      ...Array(t.tek).fill('TEK'),
      ...Array(t.cift).fill('CIFT'),
      ...Array(t.uclu).fill('UCLU'),
    ];
    for (let i = tipler.length - 1; i > 0; i--) {          // katlara karışık dağıt
      const j = Math.floor(r() * (i + 1));
      [tipler[i], tipler[j]] = [tipler[j], tipler[i]];
    }
    // katlara dengeli dağıt: her kat için oda no = kat*10 + sıra
    const odaSayisi = tipler.length;
    const katBasi = Math.ceil(odaSayisi / t.kats);
    // tek kişilik odaların bir kısmı protokol odası olsun
    let protokolKalan = 3;
    tipler.forEach((tip, i) => {
      const kat = Math.floor(i / katBasi) + 1;
      const sira = (i % katBasi) + 1;
      const oda_no = kat * 10 + sira;
      const protokol = tip === 'TEK' && protokolKalan-- > 0;
      const yatakSayisi = tip === 'TEK' ? 1 : tip === 'CIFT' ? 2 : 3;
      const taban = tip === 'TEK' ? 900 : tip === 'CIFT' ? 750 : 600;
      const yatak_fiyati = Math.round(taban * t.carpan / 50) * 50;
      odalar.push({ id: t.kod + '-' + oda_no, tesis: t.kod, oda_no, kat, tip, yatakSayisi, protokol, yatak_fiyati });
      for (let y = 1; y <= yatakSayisi; y++) {
        yataklar.push({
          id: t.kod + '-' + oda_no + '-' + y,
          odaId: t.kod + '-' + oda_no,
          tesis: t.kod, oda_no, yatak_no: y, tip, protokol, kat, yatak_fiyati,
        });
      }
      yid++;
    });
  }
  return { odalar, yataklar };
}

/* ── Doluluk indeksi ────────────────────────────────────────────────────────
   dolu[yatakId|tarih]     -> o gece yatağı işgal eden kayıt
   temizlik[yatakId|tarih] -> çıkış sonrası temizlik bloğu (TEMIZLIK_GUN)     */
function dolulukKur(rezler) {
  const dolu = new Map(), temizlik = new Map();
  for (const rz of rezler) {
    if (rz.statu === 'IPTAL') continue;
    for (const g of rz.misafirler) {
      if (!g.yatakId) continue;
      for (const t of aralik(rz.gelis_tarihi, rz.cikis_tarihi)) dolu.set(g.yatakId + '|' + t, { rez: rz, misafir: g });
      for (let k = 0; k < TEMIZLIK_GUN; k++) temizlik.set(g.yatakId + '|' + ekle(rz.cikis_tarihi, k), { rez: rz });
    }
  }
  return { dolu, temizlik };
}

/* Yatak, [gelis, cikis) gecelerinde tamamen boş mu? (temizlik bloğu dahil) */
function yatakMusait(yatakId, gelis, cikis, dolu, temizlik, golge) {
  for (const t of aralik(gelis, cikis)) {
    const k = yatakId + '|' + t;
    if (dolu.has(k) || temizlik.has(k)) return false;
    if (golge && golge.has(k)) return false;
  }
  return true;
}

/* Odada o tarih aralığında konaklayan diğer misafirlerin cinsiyetleri */
function odaCinsiyetleri(odaId, gelis, cikis, yataklar, dolu, golge) {
  const set = new Set();
  for (const y of yataklar) {
    if (y.odaId !== odaId) continue;
    for (const t of aralik(gelis, cikis)) {
      const d = dolu.get(y.id + '|' + t);
      if (d && d.misafir && d.misafir.cinsiyet) set.add(d.misafir.cinsiyet);
      const g = golge && golge.get(y.id + '|' + t);
      if (g && g.cinsiyet) set.add(g.cinsiyet);
    }
  }
  return set;
}

/* ── Rezervasyon üretimi ───────────────────────────────────────────────── */
function rezervasyonlariUret(r, yataklar, odalar, bugun) {
  const bas = ekle(bugun, -90), son = ekle(bugun, 90);
  const rezler = [];
  const dolu = new Map(), temizlik = new Map();
  const kural = VARSAYILAN_PESINAT_KURALI();
  let sayac = 1;

  const agirlikli = (tablo) => {                 // [[deger, agirlik], ...]
    const top = tablo.reduce((a, x) => a + x[1], 0);
    let p = r() * top;
    for (const [d, w] of tablo) { p -= w; if (p <= 0) return d; }
    return tablo[tablo.length - 1][0];
  };

  const yatakUygula = (rz) => {                  // üretilen kaydı doluluk indeksine işle
    for (const g of rz.misafirler) {
      if (!g.yatakId) continue;
      for (const t of aralik(rz.gelis_tarihi, rz.cikis_tarihi)) dolu.set(g.yatakId + '|' + t, { rez: rz, misafir: g });
      for (let k = 0; k < TEMIZLIK_GUN; k++) temizlik.set(g.yatakId + '|' + ekle(rz.cikis_tarihi, k), { rez: rz });
    }
  };

  for (let gun = bas; gun < son; gun = ekle(gun, 1)) {
    for (const t of TESISLER) {
      const tesisYatak = yataklar.filter(y => y.tesis === t.kod);
      const taban = tesisYatak.length / 9.2;                      // kapasiteye orantılı talep
      const mevsim = haftaSonu(gun) ? 0.6 : 1.15;
      const adet = Math.max(0, Math.round(taban * mevsim * (0.7 + r() * 0.8)));

      for (let i = 0; i < adet; i++) {
        const kisi_sayisi = agirlikli([[1, 55], [2, 25], [3, 12], [4, 8]]);
        const gun_sayisi  = agirlikli([[1, 10], [2, 17], [3, 19], [4, 16], [5, 14], [6, 10], [7, 8], [10, 4], [14, 2]]);
        const gelis_tarihi = gun;
        const cikis_tarihi = ekle(gun, gun_sayisi);
        const rezerv_tarihi = ekle(gun, -tamsayi(r, 1, 25));
        const kurum_sahis = r() < 0.70 ? 'KURUM' : 'SAHIS';
        const protokol = r() < 0.05;
        const aile = kisi_sayisi > 1 && r() < 0.45;
        const gelis_nedeni = kurum_sahis === 'KURUM' ? sec(r, GELIS_NEDENI) : sec(r, ['Misafir', 'İzin']);

        // Misafirler
        const grupCinsiyet = r() < 0.72 ? 'E' : 'K';
        const soyad = sec(r, SOYAD);
        const misafirler = [];
        for (let m = 0; m < kisi_sayisi; m++) {
          const cinsiyet = aile ? (m === 0 ? grupCinsiyet : (r() < 0.5 ? 'E' : 'K')) : grupCinsiyet;
          const ad = cinsiyet === 'E' ? sec(r, ERKEK_AD) : sec(r, KADIN_AD);
          misafirler.push({
            tc_kimlik_no: tcUret(r),
            adi_soyadi: (ad + ' ' + (aile ? soyad : sec(r, SOYAD))).toLocaleUpperCase('tr-TR'),
            cinsiyet,
            sicil_no: kurum_sahis === 'KURUM' ? sicilUret(r) : '',
            gorev_sevk_no: kurum_sahis === 'KURUM' && ['Görevli','Denetim','Toplantı'].includes(gelis_nedeni)
                            ? String(tamsayi(r, 100000, 999999)) : '',
            harcirah_miktari: kurum_sahis === 'KURUM' ? tamsayi(r, 8, 24) * 50 : 0,
            birim: kurum_sahis === 'KURUM' ? sec(r, BIRIMLER) : '',
            yatakId: null, oda_no: null, yatak_no: null,
          });
        }

        const rz = {
          id: 'R' + String(sayac).padStart(5, '0'),
          rez_no: 'MSF-' + gun.slice(0, 4) + '-' + String(sayac).padStart(5, '0'),
          tesis: t.kod,
          ad_soyad: misafirler[0].adi_soyadi + (kisi_sayisi > 1 ? (aile ? ' ve Ailesi' : ' ve Ark.') : ''),
          rezerv_tarihi, aciklama: sec(r, ACIKLAMALAR), tel_no: telUret(r),
          kisi_sayisi, gun_sayisi, gelis_tarihi, cikis_tarihi,
          kurum_sahis,
          odeyecek: kurum_sahis === 'KURUM' ? sec(r, KURUMLAR) : misafirler[0].adi_soyadi,
          odeme_turu: protokol ? 'BOS' : (kurum_sahis === 'KURUM' ? sec(r, ['MSD','KRT','NKT']) : sec(r, ['KRT','NKT'])),
          gelis_nedeni, protokol, aile,
          plaka_no: r() < 0.3 ? (tamsayi(r, 1, 81) + ' ' + sec(r, ['AB','KC','ZG','TK','MR']) + ' ' + tamsayi(r, 100, 999)) : '',
          kayit_yapan: 'TTK7719',
          misafirler,
          statu: 'TALEP',
          uzatma: false, onceki_cikis_tarihi: null,
          pesinat_tutari: 0, pesinat_son_odeme_tarihi: null, tahsil_edilen: 0,
          makbuz_no: null, hareketler: [], dekont: null, kapora_muafiyeti: null,
        };
        sayac++;

        // ── Statü ve yerleşim kararı
        const gelecek = fark(bugun, gelis_tarihi) > 0;
        const iptalMi = r() < 0.07;
        let yerlesecek = true;

        if (iptalMi) { rz.statu = 'IPTAL'; yerlesecek = false; }
        else if (!gelecek && fark(cikis_tarihi, bugun) >= 0) rz.statu = 'CIKIS';
        else if (!gelecek) rz.statu = 'KONAKLIYOR';
        else {
          const uzaklik = fark(bugun, gelis_tarihi);
          let onayOrani = uzaklik <= 10 ? 0.88 : uzaklik <= 25 ? 0.78 : uzaklik <= 50 ? 0.62 : 0.45;
          if (kurum_sahis === 'SAHIS') onayOrani *= 0.6;   // şahsi misafirde peşinat beklemesi olağan
          const p = r();
          if (p < onayOrani)      { rz.statu = 'ONAYLI'; }
          else if (kurum_sahis === 'SAHIS' && p < onayOrani + 0.20) { rz.statu = 'PESINAT_BEKLENIYOR'; }
          else                    { rz.statu = 'TALEP'; }
          if (rz.statu !== 'ONAYLI') yerlesecek = false;   // yerleştirme işi Ekran 2'ye kalsın
        }

        // ── Yerleştirme (üretim aşaması, motorun kendisiyle)
        if (yerlesecek) {
          const sonuc = yerlestirmeMotoru([rz], yataklar, odalar, dolu, temizlik, { });
          if (sonuc.oneriler.length) {
            const o = sonuc.oneriler[0];
            o.atamalar.forEach(a => {
              const g = rz.misafirler[a.misafirIndex];
              g.yatakId = a.yatakId; g.oda_no = a.oda_no; g.yatak_no = a.yatak_no;
            });
            yatakUygula(rz);
          } else {
            // kapasite dolu — talep olarak beklemede kalsın
            rz.statu = gelecek ? 'TALEP' : 'IPTAL';
          }
        }

        // ── Uzatma senaryosu
        if (rz.statu === 'KONAKLIYOR' && r() < 0.15) {
          rz.uzatma = true;
          rz.onceki_cikis_tarihi = rz.cikis_tarihi;
          const ekGun = tamsayi(r, 1, 3);
          const yeniCikis = ekle(rz.cikis_tarihi, ekGun);
          const hepsiMusait = rz.misafirler.every(g =>
            !g.yatakId || yatakMusait(g.yatakId, rz.cikis_tarihi, yeniCikis, dolu, temizlik));
          if (hepsiMusait) {
            // önceki temizlik bloğunu kaldır, süreyi uzat
            for (const g of rz.misafirler) {
              if (!g.yatakId) continue;
              for (let k = 0; k < TEMIZLIK_GUN; k++) temizlik.delete(g.yatakId + '|' + ekle(rz.cikis_tarihi, k));
            }
            rz.cikis_tarihi = yeniCikis;
            rz.gun_sayisi += ekGun;
            yatakUygula(rz);
          } else { rz.uzatma = false; rz.onceki_cikis_tarihi = null; }
        }

        // ── Peşinat alanları
        pesinatHesapla(rz, odalar, kural);
        /* Kapora aranmayan kayıt (kurum misafiri, protokol, bedelsiz) «Kapora Bekleniyor»
           statüsünde kalamaz — ekranda «Kapora: aranmıyor · statü: Kapora Bekleniyor»
           gibi çelişkili satır oluşurdu. */
        if (rz.statu === 'PESINAT_BEKLENIYOR' && !rz.pesinat_tutari) rz.statu = 'TALEP';
        if (['ONAYLI','KONAKLIYOR','CIKIS'].includes(rz.statu)) {
          rz.tahsil_edilen = rz.pesinat_tutari;
          if (rz.pesinat_tutari > 0) rz.makbuz_no = String(tamsayi(r, 1000, 9999));
        } else if (rz.statu === 'PESINAT_BEKLENIYOR') {
          rz.tahsil_edilen = r() < 0.2 ? Math.round(rz.pesinat_tutari * 0.5 / 50) * 50 : 0;
        }
        /* Kapora dekontu: onaylı kayıtlarda onaylanmış, bekleyenlerin bir kısmında müdür onayında */
        if (rz.pesinat_tutari > 0 && rz.statu !== 'IPTAL') {
          const tesisAd = t.ad;
          if (['ONAYLI', 'KONAKLIYOR', 'CIKIS'].includes(rz.statu)) {
            rz.dekont = { ...ornekDekont(rz, tesisAd, 'MSF2001', ekle(rz.rezerv_tarihi, 1), r),
                          durum: 'ONAYLANDI', onaylayan: 'MSF1001', onay_tarihi: ekle(rz.rezerv_tarihi, 2) };
          } else if (rz.statu === 'PESINAT_BEKLENIYOR' && r() < 0.45) {
            rz.dekont = ornekDekont(rz, tesisAd, 'MSF2001', ekle(rz.rezerv_tarihi, 1), r);
            rz.statu = 'ONAY_BEKLIYOR';
            rz.hareketler.push({ tarih: rz.dekont.yuklenme_tarihi, kullanici: 'MSF2001',
              metin: `Kapora dekontu yüklendi — ${rz.dekont.banka} · ${para(rz.dekont.tutar)} · müdür onayına gönderildi` });
          }
        }
        rz.hareketler.push({ tarih: rz.rezerv_tarihi, metin: 'Rezervasyon talebi alındı', kullanici: 'TTK7719' });
        if (rz.statu === 'IPTAL') rz.hareketler.push({ tarih: ekle(rz.rezerv_tarihi, 2), metin: 'Talep iptal edildi', kullanici: 'TTK7719' });

        rezler.push(rz);
      }
    }
  }
  return rezler;
}

/* Yatak bedeli ve peşinat tutarını (kurala göre) hesapla */
function yatakBedeli(rz, odalar) {
  let toplam = 0;
  for (const g of rz.misafirler) {
    if (g.oda_no != null) {
      const oda = odalar.find(o => o.tesis === rz.tesis && o.oda_no === g.oda_no);
      toplam += (oda ? oda.yatak_fiyati : 750) * rz.gun_sayisi;
    } else {
      const ort = odalar.filter(o => o.tesis === rz.tesis).reduce((a, o) => a + o.yatak_fiyati, 0) /
                  Math.max(1, odalar.filter(o => o.tesis === rz.tesis).length);
      toplam += Math.round(ort / 50) * 50 * rz.gun_sayisi;
    }
  }
  return toplam;
}

function pesinatHesapla(rz, odalar, kural) {
  const bedel = yatakBedeli(rz, odalar);
  rz.yatak_bedeli = bedel;
  if (rz.odeme_turu === 'BOS' || (rz.kurum_sahis === 'KURUM' && kural.kurumMisafirindePesinatAranmasin)) {
    rz.pesinat_tutari = 0;
    rz.pesinat_son_odeme_tarihi = null;
  } else {
    if (kural.kaporaTuru === 'GECE') {
      const gece = Math.max(1, rz.gun_sayisi || 1);
      const gecelik = bedel / gece;                       // bir gecenin toplam yatak bedeli
      const alinan = Math.min(gece, Math.max(1, kural.kaporaGece));
      rz.pesinat_tutari = Math.max(kural.sahisAsgariTutar, Math.round(gecelik * alinan / 50) * 50);
      rz.kapora_gece = alinan;
    } else {
      rz.pesinat_tutari = Math.max(kural.sahisAsgariTutar, Math.round(bedel * kural.sahisOran / 100 / 50) * 50);
      rz.kapora_gece = null;
    }
    const a = ekle(rz.rezerv_tarihi, kural.odemeSuresiGun);
    const b = ekle(rz.gelis_tarihi, -kural.gelistenOnceEnGecGun);
    rz.pesinat_son_odeme_tarihi = a < b ? a : b;
    if (rz.pesinat_son_odeme_tarihi < rz.rezerv_tarihi) rz.pesinat_son_odeme_tarihi = rz.rezerv_tarihi;
  }
  rz.pesinattan_kalan = Math.max(0, rz.pesinat_tutari - (rz.tahsil_edilen || 0));
  return rz;
}


/* ══════════════════════════════════════════════════════════════════════════
   KAPORA DEKONTU
   Misafir, konaklama bedelinin bir bölümünü (varsayılan: ilk gecenin bedeli)
   kapora olarak yatırır; banka dekontu sisteme yüklenir ve misafirhane müdürü
   dekontu inceleyip rezervasyonu onaylar. Onaylanmadan yatak tahsis edilemez.
   ══════════════════════════════════════════════════════════════════════════ */

const BANKALAR = ['Ziraat Bankası', 'Halk Bankası', 'Vakıfbank', 'İş Bankası', 'Garanti BBVA'];

/* PDF/Type1 yazı tipleri Türkçe karakter taşımadığından dekont metni sadeleştirilir */
const ascii = (m) => String(m)
  .replace(/ı/g, 'i').replace(/İ/g, 'I').replace(/ş/g, 's').replace(/Ş/g, 'S')
  .replace(/ğ/g, 'g').replace(/Ğ/g, 'G').replace(/ü/g, 'u').replace(/Ü/g, 'U')
  .replace(/ö/g, 'o').replace(/Ö/g, 'O').replace(/ç/g, 'c').replace(/Ç/g, 'C')
  .replace(/[\\()]/g, ' ').replace(/[^\x20-\x7E]/g, '');

/* Demo için gerçek, açılabilir bir PDF üretir (tek sayfa, Helvetica) */
function dekontPdfUret(d) {
  const satirlar = [
    ['B', 16, 'TURKIYE TASKOMURU KURUMU'],
    ['N', 11, 'Misafirhane Bilgi Sistemi'],
    ['B', 13, 'KAPORA ODEME DEKONTU'],
    ['-', 0, ''],
    ['N', 11, 'Rezervasyon No : ' + ascii(d.rezNo)],
    ['N', 11, 'Misafirhane    : ' + ascii(d.tesis)],
    ['N', 11, 'Ad Soyad       : ' + ascii(d.ad)],
    ['N', 11, 'Konaklama      : ' + ascii(d.konaklama)],
    ['-', 0, ''],
    ['N', 11, 'Banka          : ' + ascii(d.banka)],
    ['N', 11, 'Dekont No      : ' + ascii(d.dekontNo)],
    ['N', 11, 'Odeme Tarihi   : ' + ascii(d.odemeTarihi)],
    ['B', 13, 'Tutar          : ' + ascii(d.tutar)],
    ['-', 0, ''],
    ['N', 10, ascii(d.aciklama || '')],
    ['N', 9,  'Bu belge prototip gosterimi icin uretilmis ORNEK dekonttur.'],
  ];
  let y = 372, akis = '0.1 0.18 0.34 RG 1.2 w 18 18 384 384 re S\n';
  for (const [tur, boy, metin] of satirlar) {
    if (tur === '-') { akis += `0.75 0.78 0.83 RG 0.7 w 34 ${y + 6} m 386 ${y + 6} l S\n`; y -= 10; continue; }
    akis += `BT /${tur === 'B' ? 'F2' : 'F1'} ${boy} Tf 34 ${y} Td (${metin}) Tj ET\n`;
    y -= boy + 7;
  }
  const nesneler = [
    '<</Type/Catalog/Pages 2 0 R>>',
    '<</Type/Pages/Kids[3 0 R]/Count 1>>',
    '<</Type/Page/Parent 2 0 R/MediaBox[0 0 420 420]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 4 0 R>>',
    `<</Length ${akis.length}>>\nstream\n${akis}endstream`,
    '<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>',
    '<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>',
  ];
  let pdf = '%PDF-1.4\n';
  const konumlar = [];
  nesneler.forEach((n, i) => { konumlar.push(pdf.length); pdf += `${i + 1} 0 obj\n${n}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${nesneler.length + 1}\n0000000000 65535 f \n`;
  konumlar.forEach(k => { pdf += String(k).padStart(10, '0') + ' 00000 n \n'; });
  pdf += `trailer\n<</Size ${nesneler.length + 1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return 'data:application/pdf;base64,' + btoa(pdf);
}

/* Genel amaçlı A4 PDF üreteci — ay sonu belgesi gibi çok satırlı raporlar için.
   satirlar: ['B'|'N'|'-', punto, metin] üçlüleri. Sayfa dolunca yenisi açılır. */
function raporPdfUret(baslik, satirlar) {
  const G = 595, Y = 842, KENAR = 42;          // A4 dikey, punto
  const sayfalar = [];
  let akis = '', y = Y - 60;
  const yeniSayfa = () => { if (akis) sayfalar.push(akis); akis = `0.1 0.18 0.34 RG 1 w ${KENAR - 10} 30 ${G - 2 * (KENAR - 10)} ${Y - 60} re S\n`; y = Y - 62; };
  yeniSayfa();
  for (const [tur, boy, metin] of satirlar) {
    if (y < 56) yeniSayfa();
    if (tur === '-') { akis += `0.75 0.78 0.83 RG 0.6 w ${KENAR} ${y + 6} m ${G - KENAR} ${y + 6} l S\n`; y -= 10; continue; }
    akis += `BT /${tur === 'B' ? 'F2' : 'F1'} ${boy} Tf ${KENAR} ${y} Td (${ascii(metin)}) Tj ET\n`;
    y -= boy + 6;
  }
  sayfalar.push(akis);

  const nesneler = ['<</Type/Catalog/Pages 2 0 R>>', ''];   // 2. nesne aşağıda doldurulur
  const sayfaIdleri = [], icerikIdleri = [];
  let sonraki = 3;
  sayfalar.forEach(() => { sayfaIdleri.push(sonraki++); icerikIdleri.push(sonraki++); });
  const yaziF1 = sonraki++, yaziF2 = sonraki++;
  nesneler[1] = `<</Type/Pages/Kids[${sayfaIdleri.map(i => i + ' 0 R').join(' ')}]/Count ${sayfalar.length}>>`;
  sayfalar.forEach((icerik, i) => {
    nesneler.push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${G} ${Y}]/Resources<</Font<</F1 ${yaziF1} 0 R/F2 ${yaziF2} 0 R>>>>/Contents ${icerikIdleri[i]} 0 R>>`);
    nesneler.push(`<</Length ${icerik.length}>>\nstream\n${icerik}endstream`);
  });
  nesneler.push('<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
  nesneler.push('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');

  let pdf = '%PDF-1.4\n';
  const konumlar = [];
  nesneler.forEach((n, i) => { konumlar.push(pdf.length); pdf += `${i + 1} 0 obj\n${n}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${nesneler.length + 1}\n0000000000 65535 f \n`;
  konumlar.forEach(k => { pdf += String(k).padStart(10, '0') + ' 00000 n \n'; });
  pdf += `trailer\n<</Size ${nesneler.length + 1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return 'data:application/pdf;base64,' + btoa(pdf);
}

/* Bir rezervasyon için örnek dekont nesnesi üretir */
function ornekDekont(rz, tesisAd, kullanici, tarih, rastgele) {
  const r = rastgele || Math.random;
  const banka = BANKALAR[Math.floor(r() * BANKALAR.length)];
  const dekontNo = String(Math.floor(r() * 9e8) + 1e8);
  const odemeTarihi = ekle(tarih, -Math.floor(r() * 3));
  const veri = {
    banka, dekont_no: dekontNo, odeme_tarihi: odemeTarihi,
    tutar: rz.pesinat_tutari,
    dosya_adi: `kapora-dekont-${rz.rez_no}.pdf`,
    tur: 'application/pdf',
    yukleyen: kullanici, yuklenme_tarihi: tarih,
    durum: 'YUKLENDI', red_gerekcesi: '', onaylayan: null, onay_tarihi: null,
  };
  veri.icerik = null;          // demo dekontun PDF'i görüntüleme anında üretilir
  veri.uretilmis = true;       // gerçek yüklenen dosyalarda bu alan false olur
  veri.boyut = 2400 + Math.floor(r() * 900);
  return veri;
}

/* Dekontun görüntülenecek PDF adresi: yüklenen dosya varsa o, yoksa demo PDF üretilir */
function dekontKaynagi(rz, tesisAd) {
  const d = rz.dekont;
  if (!d) return null;
  if (d.icerik) return d.icerik;
  return dekontPdfUret({
    rezNo: rz.rez_no, tesis: tesisAd, ad: rz.ad_soyad,
    konaklama: `${tr(rz.gelis_tarihi)} - ${tr(rz.cikis_tarihi)} (${rz.gun_sayisi} gece)`,
    banka: d.banka, dekontNo: d.dekont_no, odemeTarihi: tr(d.odeme_tarihi),
    tutar: para(d.tutar),
    aciklama: rz.kapora_gece ? `${rz.kapora_gece} gecelik kapora bedeli` : 'Kapora bedeli',
  });
}

/* ── Misafir bilgilendirme SMS'leri ────────────────────────────────────────
   Prototipte gerçek bir SMS servisine bağlanılmaz; gönderim kayıt altına alınır
   ve «SMS Günlüğü»nden görülür. Kurulumda buraya kurumun SMS sağlayıcısının
   HTTP arayüzü bağlanır (bkz. docs/api-sozlesmesi.md § Bildirim).            */
const SMS_GONDEREN = 'TTK MSFH';

function smsMetni(tur, rz, tesisAd, ek) {
  const ad = rz.misafirler[0] ? rz.misafirler[0].adi_soyadi : rz.ad_soyad;
  const tarihler = `${tr(rz.gelis_tarihi)}-${tr(rz.cikis_tarihi)}`;
  switch (tur) {
    case 'KAYIT':
      return `Sayin ${ad}, ${tesisAd} rezervasyon talebiniz alindi. Rez. No ${rz.rez_no}, ${tarihler} (${rz.gun_sayisi} gece).` +
             (rz.pesinat_tutari
               /* ₺ işareti GSM-7 alfabesinde yok; kullanılırsa mesaj 70 haneye düşer. */
               ? ` Kapora ${rz.pesinat_tutari.toLocaleString('tr-TR')} TL${rz.pesinat_son_odeme_tarihi ? `, son odeme ${tr(rz.pesinat_son_odeme_tarihi)}` : ''}.` +
                 ' Dekontu misafirhaneye iletiniz.'
               : ' Kapora aranmamaktadir.') + ' TTK';
    case 'ONAY':
      return `Sayin ${ad}, ${rz.rez_no} numarali rezervasyonunuz onaylandi. ${tesisAd}, ${tarihler}.` +
             (ek && ek.oda ? ` Oda ${ek.oda}.` : '') + ' Iyi konaklamalar dileriz. TTK';
    case 'IPTAL':
      return `Sayin ${ad}, ${rz.rez_no} numarali rezervasyonunuz iptal edilmistir${ek && ek.gerekce ? ` (${ek.gerekce})` : ''}. Bilginize. TTK`;
    case 'HATIRLATMA':
      return `Sayin ${ad}, ${rz.rez_no} numarali rezervasyonunuzun kaporasi (${rz.pesinat_tutari.toLocaleString('tr-TR')} TL) icin son odeme tarihi ` +
             `${tr(rz.pesinat_son_odeme_tarihi)}. Odeme yapilmazsa kayit iptal olur. TTK`;
    default: return '';
  }
}

/* Gönderim kaydını üretir; telefon yoksa «gönderilemedi» olarak işaretlenir. */
function smsUret(tur, rz, tesisAd, tarih, ek) {
  const telefon = (rz.tel_no || '').trim();
  return {
    id: 'SMS' + Math.random().toString(36).slice(2, 9),
    tarih, tur, rezId: rz.id, rez_no: rz.rez_no, alici: rz.ad_soyad,
    telefon: telefon || null,
    durum: telefon ? 'GONDERILDI' : 'GONDERILEMEDI',
    metin: smsMetni(tur, rz, tesisAd, ek),
    not: telefon ? '' : 'Kayıtta telefon numarası yok.',
  };
}

/* Kapora/onay kuralına göre bu kayda yatak tahsis edilebilir mi? */
function yerlesmeyeUygun(rz, kural) {
  if (['IPTAL', 'CIKIS'].includes(rz.statu)) return { ok: false, neden: 'Kayıt kapalı (iptal/çıkış).' };
  if (rz.kapora_muafiyeti) return { ok: true };                      // müdür kararıyla kaporadan muaf
  if (!rz.pesinat_tutari) return { ok: true };                       // kurum misafiri / protokol: kapora aranmıyor
  if (!kural || !kural.mudurOnayiZorunlu) return { ok: true };
  if (['ONAYLI', 'KONAKLIYOR'].includes(rz.statu)) return { ok: true };
  if (rz.statu === 'ONAY_BEKLIYOR')
    return { ok: false, neden: `Kapora dekontu müdür onayında (${para(rz.pesinat_tutari)}); onaylanmadan yatak tahsis edilemez.` };
  return { ok: false, neden: `Kapora (${para(rz.pesinat_tutari)}) yatırılıp dekontu onaylanmadan yatak tahsis edilemez.` };
}

/* ══════════════════════════════════════════════════════════════════════════
   3) OTOMATİK YERLEŞTİRME MOTORU
   Kısıt denetimi + ağırlıklı skorlama + tek seviyeli geri alma.
   Çıktı öneridir; gerçek doluluk ancak kullanıcı onayı ile değişir.
   ══════════════════════════════════════════════════════════════════════════ */

const SKOR = {
  TEK_ODA:            100,  // grubun tamamı tek odada
  KAPASITE_TAM:        40,  // oda kapasitesi grup büyüklüğüne birebir uyuyor
  BOS_YATAK_CEZASI:   -18,  // odada atıl kalan her yatak
  ODA_DOLDURMA:        25,  // oda zaten aynı cinsiyetle kısmen dolu (parçalanma azalır)
  PROTOKOL_UYUM:       35,  // protokol misafiri protokol odasında
  PROTOKOL_ISRAF:     -25,  // protokol odası normal misafire veriliyor
  SIKI_PAKET:          12,  // seçilen yatak, aralığın hemen öncesi/sonrasında da kullanılıyor
  KISA_BOSLUK_CEZASI: -14,  // aralığın kenarında 1 gecelik kullanılamaz boşluk kalıyor
  ALT_KAT:              4,  // kat başına (düşük kat tercih)
  BOLUNME_CEZASI:     -60,  // grup birden fazla odaya bölündü
  FARKLI_KAT_CEZASI:  -30,  // bölünen grup farklı katlara dağıldı
};

/* Talep öncelik sırası: protokol > kurum > peşinatı alınmış > yakın geliş > büyük grup */
function oncelikSirala(talepler) {
  return [...talepler].sort((a, b) => {
    if (a.protokol !== b.protokol) return a.protokol ? -1 : 1;
    const ak = a.kurum_sahis === 'KURUM', bk = b.kurum_sahis === 'KURUM';
    if (ak !== bk) return ak ? -1 : 1;
    const ao = a.statu === 'ONAYLI' || (a.tahsil_edilen > 0), bo = b.statu === 'ONAYLI' || (b.tahsil_edilen > 0);
    if (ao !== bo) return ao ? -1 : 1;
    if (a.gelis_tarihi !== b.gelis_tarihi) return a.gelis_tarihi < b.gelis_tarihi ? -1 : 1;
    if (a.kisi_sayisi !== b.kisi_sayisi) return b.kisi_sayisi - a.kisi_sayisi;
    return a.rezerv_tarihi < b.rezerv_tarihi ? -1 : 1;
  });
}

/* Talebi konaklama gruplarına ayır: aile → tek grup, değilse cinsiyete göre */
function taleptenGruplar(rz) {
  const idx = rz.misafirler.map((g, i) => i);
  if (rz.aile) return [{ karma: true, indexler: idx, cinsiyet: null }];
  const E = idx.filter(i => rz.misafirler[i].cinsiyet === 'E');
  const K = idx.filter(i => rz.misafirler[i].cinsiyet === 'K');
  const out = [];
  if (E.length) out.push({ karma: false, indexler: E, cinsiyet: 'E' });
  if (K.length) out.push({ karma: false, indexler: K, cinsiyet: 'K' });
  return out;
}

function hucreDurumu(yatakId, t, dolu, temizlik, golge) {
  const k = yatakId + '|' + t;
  if (dolu.has(k)) return 'DOLU';
  if (temizlik.has(k)) return 'TEMIZLIK';
  if (golge && golge.has(k)) return 'ONERI';
  return null;
}

/* Bir grubun tek odaya yerleşme adaylarını üret ve skorla */
function odaAdaylari(rz, grup, ctx) {
  const { yataklar, odalar, dolu, temizlik, golge } = ctx;
  const n = grup.indexler.length;
  const gelis = rz.gelis_tarihi, cikis = rz.cikis_tarihi;
  const adaylar = [];
  const elendi = { kapasite: 0, cinsiyet: 0, protokol: 0, temizlik: 0, karma: 0 };

  for (const oda of odalar) {
    if (oda.tesis !== rz.tesis) continue;
    if (oda.protokol && !rz.protokol) { elendi.protokol++; continue; }

    const odaYataklari = yataklar.filter(y => y.odaId === oda.id);
    const bos = [], engelTemizlik = [];
    for (const y of odaYataklari) {
      let uygun = true, temizlikEngeli = false;
      for (const t of aralik(gelis, cikis)) {
        const d = hucreDurumu(y.id, t, dolu, temizlik, golge);
        if (d) { uygun = false; if (d === 'TEMIZLIK') temizlikEngeli = true; break; }
      }
      if (uygun) bos.push(y); else if (temizlikEngeli) engelTemizlik.push(y);
    }
    if (bos.length < n) {
      if (engelTemizlik.length && bos.length + engelTemizlik.length >= n) elendi.temizlik++;
      else elendi.kapasite++;
      continue;
    }

    // Cinsiyet kısıtı
    const mevcut = odaCinsiyetleri(oda.id, gelis, cikis, yataklar, dolu, golge);
    const odaTamamenBos = bos.length === odaYataklari.length && mevcut.size === 0;
    if (grup.karma) {
      if (!odaTamamenBos) { elendi.karma++; continue; }        // aile/karma grup yalnız boş odaya
    } else if (mevcut.size > 0 && !(mevcut.size === 1 && mevcut.has(grup.cinsiyet))) {
      elendi.cinsiyet++; continue;
    }

    // ── Skorlama
    let skor = SKOR.TEK_ODA;
    const notlar = [];
    if (oda.yatakSayisi === n) { skor += SKOR.KAPASITE_TAM; notlar.push('Oda kapasitesi talebe birebir uyuyor'); }
    const atil = oda.yatakSayisi - n - (odaYataklari.length - bos.length);
    if (atil > 0) skor += SKOR.BOS_YATAK_CEZASI * atil;
    if (!odaTamamenBos && !grup.karma && mevcut.has(grup.cinsiyet)) {
      skor += SKOR.ODA_DOLDURMA; notlar.push('Oda aynı cinsiyetle kısmen dolu, parçalanma artmıyor');
    }
    if (rz.protokol) { skor += oda.protokol ? SKOR.PROTOKOL_UYUM : 0; if (oda.protokol) notlar.push('Protokol odası'); }
    else if (oda.protokol) skor += SKOR.PROTOKOL_ISRAF;

    // Komşu gecelerde sıkı paketleme / kısa boşluk cezası
    const secilen = bos.slice(0, n);
    for (const y of secilen) {
      const onceki = hucreDurumu(y.id, ekle(gelis, -1), dolu, temizlik, golge);
      const sonraki = hucreDurumu(y.id, cikis, dolu, temizlik, golge);
      if (onceki) skor += SKOR.SIKI_PAKET;
      if (sonraki) skor += SKOR.SIKI_PAKET;
      const ikiOnce = hucreDurumu(y.id, ekle(gelis, -2), dolu, temizlik, golge);
      if (!onceki && ikiOnce) skor += SKOR.KISA_BOSLUK_CEZASI;   // arada 1 gecelik satılamaz boşluk
    }
    skor += SKOR.ALT_KAT * (6 - oda.kat);
    if (rz.gun_sayisi >= 5 && oda.kat <= 2) { skor += 6; notlar.push('Uzun konaklama için alt kat'); }

    adaylar.push({ oda, yataklar: secilen, skor: Math.round(skor), notlar });
  }
  adaylar.sort((a, b) => b.skor - a.skor);
  return { adaylar, elendi };
}

/* Tesiste belirli gecelerde toplam boş yatak — gerekçe metni için */
function geceBazliBosluk(rz, ctx) {
  const { yataklar, dolu, temizlik, golge } = ctx;
  const tesisYatak = yataklar.filter(y => y.tesis === rz.tesis);
  const satir = [];
  for (const t of aralik(rz.gelis_tarihi, rz.cikis_tarihi)) {
    let bos = 0;
    for (const y of tesisYatak) if (!hucreDurumu(y.id, t, dolu, temizlik, golge)) bos++;
    satir.push({ tarih: t, bos });
  }
  return satir;
}

/* Yerleştirilemeyen talep için insan okunur gerekçe */
function gerekceUret(rz, grup, elendi, ctx, enIyiOdaKapasitesi, bolmeDenendi) {
  const geceler = geceBazliBosluk(rz, ctx);
  const sifir = geceler.filter(g => g.bos === 0);
  const araligiYaz = `${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)}`;
  const n = grup.indexler.length;

  if (sifir.length) {
    return `${araligiYaz} arası uygun yatak yok — ${sifir.map(g => tr(g.tarih)).slice(0, 3).join(', ')} ` +
           `gece${sifir.length > 1 ? 'lerinde' : 'sinde'} tesiste hiç boş yatak bulunmuyor.`;
  }
  if (elendi.cinsiyet > 0 && elendi.kapasite === 0) {
    return `${araligiYaz} arası boş yatak var ancak ${elendi.cinsiyet} oda karma konaklama kısıtı nedeniyle ` +
           `kullanılamıyor (odalarda farklı cinsiyette misafir konaklıyor).`;
  }
  if (grup.karma && elendi.karma > 0) {
    return `${araligiYaz} arası aile/birlikte kalma talebi için tamamen boş ${n} yataklı oda bulunamadı ` +
           `(${elendi.karma} oda kısmen dolu olduğu için karma konaklamaya kapalı).`;
  }
  if (elendi.temizlik > 0 && elendi.kapasite === 0) {
    return `${araligiYaz} arası yataklar çıkış-giriş temizlik boşluğu (${TEMIZLIK_GUN} gün) nedeniyle ` +
           `aynı gün tahsis edilemiyor.`;
  }
  if (n > 1) {
    const enAz = geceler.reduce((a, g) => Math.min(a, g.bos), 99);
    return `${n} kişilik grup için ${araligiYaz} arası ardışık gecelerde aynı odada ${n} boş yatak bulunamadı ` +
           `(aynı odada en fazla ${enIyiOdaKapasitesi} yatak müsait; tesis genelinde en dar gecede ${enAz} boş yatak var)` +
           (bolmeDenendi ? '; grup ayrı odalara bölünerek de tamamlanamadı.' : '.');
  }
  const enAz = geceler.reduce((a, g) => Math.min(a, g.bos), 99);
  return `${araligiYaz} arası uygun tek kişilik yatak yok (en dar gecede ${enAz} boş yatak, hiçbiri kısıtlara uymuyor).`;
}

/* Tek bir talebi yerleştirmeyi dene */
function talebiDene(rz, ctx) {
  const gruplar = taleptenGruplar(rz);
  const atamalar = [];
  const notlar = [];
  let toplamSkor = 0;
  const gecici = [];   // bu talep için gölgeye yazılan hücreler

  const golgeYaz = (yatakId, cinsiyet) => {
    for (const t of aralik(rz.gelis_tarihi, rz.cikis_tarihi)) {
      const k = yatakId + '|' + t;
      ctx.golge.set(k, { rezId: rz.id, cinsiyet }); gecici.push(k);
    }
    for (let i = 0; i < TEMIZLIK_GUN; i++) {
      const k = yatakId + '|' + ekle(rz.cikis_tarihi, i);
      if (!ctx.golge.has(k)) { ctx.golge.set(k, { rezId: rz.id, cinsiyet: null, temizlik: true }); gecici.push(k); }
    }
  };
  const geriAl = () => { gecici.forEach(k => ctx.golge.delete(k)); gecici.length = 0; };

  for (const grup of gruplar) {
    const { adaylar, elendi } = odaAdaylari(rz, grup, ctx);
    if (adaylar.length) {
      const en = adaylar[0];
      toplamSkor += en.skor;
      notlar.push(...en.notlar);
      grup.indexler.forEach((mi, k) => {
        const y = en.yataklar[k];
        atamalar.push({ misafirIndex: mi, yatakId: y.id, oda_no: y.oda_no, yatak_no: y.yatak_no, tesis: y.tesis });
        golgeYaz(y.id, rz.misafirler[mi].cinsiyet);
      });
      continue;
    }
    // Tek odaya sığmadı → grubu bölmeyi dene (aile/birlikte kalma talebinde bölme yok)
    if (grup.karma || grup.indexler.length === 1) {
      const enIyi = enBosOdaKapasitesi(rz, ctx);
      geriAl();
      return { ok: false, gerekce: gerekceUret(rz, grup, elendi, ctx, enIyi) };
    }
    const bolme = grubuBol(rz, grup, ctx, golgeYaz);
    if (!bolme.ok) {
      const enIyi = enBosOdaKapasitesi(rz, ctx);
      geriAl();
      return { ok: false, gerekce: gerekceUret(rz, grup, elendi, ctx, enIyi, true) };
    }
    atamalar.push(...bolme.atamalar);
    toplamSkor += bolme.skor;
    notlar.push(bolme.not);
  }
  return { ok: true, atamalar, skor: Math.round(toplamSkor), notlar: [...new Set(notlar)], temizle: geriAl };
}

/* Bir odada aynı aralıkta müsait en yüksek yatak sayısı (gerekçe metni için) */
function enBosOdaKapasitesi(rz, ctx) {
  const { yataklar, odalar, dolu, temizlik, golge } = ctx;
  let en = 0;
  for (const oda of odalar) {
    if (oda.tesis !== rz.tesis) continue;
    let bos = 0;
    for (const y of yataklar.filter(y => y.odaId === oda.id)) {
      if (yatakMusait(y.id, rz.gelis_tarihi, rz.cikis_tarihi, dolu, temizlik, golge)) bos++;
    }
    if (bos > en) en = bos;
  }
  return en;
}

/* Grup tek odaya sığmıyorsa: aynı katta, mümkün olan en az sayıda odaya böl */
function grubuBol(rz, grup, ctx, golgeYaz) {
  const { yataklar, odalar, dolu, temizlik, golge } = ctx;
  const kalan = [...grup.indexler];
  const atamalar = [];
  let skor = SKOR.BOLUNME_CEZASI;
  const kullanilanKatlar = new Set();

  while (kalan.length) {
    const alt = { karma: false, cinsiyet: grup.cinsiyet, indexler: kalan.slice(0, 1) };
    // mümkün olan en büyük parçayı yerleştir
    let yerlesti = false;
    for (let boy = Math.min(kalan.length, 3); boy >= 1; boy--) {
      alt.indexler = kalan.slice(0, boy);
      const { adaylar } = odaAdaylari(rz, alt, ctx);
      if (!adaylar.length) continue;
      // aynı kata toplanmayı tercih et
      adaylar.sort((a, b) => {
        const ak = kullanilanKatlar.size && !kullanilanKatlar.has(a.oda.kat) ? SKOR.FARKLI_KAT_CEZASI : 0;
        const bk = kullanilanKatlar.size && !kullanilanKatlar.has(b.oda.kat) ? SKOR.FARKLI_KAT_CEZASI : 0;
        return (b.skor + bk) - (a.skor + ak);
      });
      const en = adaylar[0];
      alt.indexler.forEach((mi, k) => {
        const y = en.yataklar[k];
        atamalar.push({ misafirIndex: mi, yatakId: y.id, oda_no: y.oda_no, yatak_no: y.yatak_no, tesis: y.tesis });
        golgeYaz(y.id, rz.misafirler[mi].cinsiyet);
      });
      kullanilanKatlar.add(en.oda.kat);
      skor += en.skor / 2;
      kalan.splice(0, boy);
      yerlesti = true;
      break;
    }
    if (!yerlesti) return { ok: false };
  }
  const katMetni = kullanilanKatlar.size > 1 ? ` (${kullanilanKatlar.size} farklı kat)` : ' (aynı kat)';
  return { ok: true, atamalar, skor, not: `Grup ${new Set(atamalar.map(a => a.oda_no)).size} odaya bölündü${katMetni}` };
}

/* ── Motorun giriş noktası ──────────────────────────────────────────────── */
function yerlestirmeMotoru(talepler, yataklar, odalar, dolu, temizlik, secenekler = {}) {
  const ctx = { yataklar, odalar, dolu, temizlik, golge: new Map() };
  const oneriler = [], basarisiz = [];
  const sirali = oncelikSirala(talepler);
  const golgeIz = new Map();   // rezId -> yazılan hücre anahtarları

  const izle = (rezId, fn) => {
    const once = new Set(ctx.golge.keys());
    const sonuc = fn();
    const yeni = [...ctx.golge.keys()].filter(k => !once.has(k));
    if (sonuc.ok) golgeIz.set(rezId, yeni);
    return sonuc;
  };

  for (const rz of sirali) {
    let sonuc = izle(rz.id, () => talebiDene(rz, ctx));

    // ── Tek seviyeli geri alma: yüksek öncelikli talep yerleşemediyse,
    //    bu turda yerleşmiş daha düşük öncelikli ve tarihi çakışan bir öneriyi
    //    geri al, tekrar dene; geri alınanı sonra yeniden yerleştirmeye çalış.
    if (!sonuc.ok && secenekler.geriAlma !== false) {
      const cakisanlar = oneriler.filter(o =>
        o.rez.tesis === rz.tesis &&
        o.rez.gelis_tarihi < rz.cikis_tarihi && rz.gelis_tarihi < o.rez.cikis_tarihi &&
        oncelikSirala([rz, o.rez])[0].id === rz.id);
      for (const kurban of cakisanlar.slice(-2)) {
        (golgeIz.get(kurban.rez.id) || []).forEach(k => ctx.golge.delete(k));
        const tekrar = izle(rz.id, () => talebiDene(rz, ctx));
        if (tekrar.ok) {
          sonuc = tekrar;
          const yeniden = izle(kurban.rez.id, () => talebiDene(kurban.rez, ctx));
          if (yeniden.ok) {
            kurban.atamalar = yeniden.atamalar; kurban.skor = yeniden.skor;
            kurban.notlar = [...yeniden.notlar, 'Öncelikli talep nedeniyle oda değişti'];
          } else {
            oneriler.splice(oneriler.indexOf(kurban), 1);
            basarisiz.push({ rez: kurban.rez, gerekce: `Daha yüksek öncelikli ${rz.rez_no} talebi nedeniyle yeri ` +
              `değiştirildi ve alternatif bulunamadı: ${yeniden.gerekce}` });
          }
          break;
        } else {
          // geri almayı iptal et: kurbanı yerine koy
          izle(kurban.rez.id, () => talebiDene(kurban.rez, ctx));
        }
      }
    }

    if (sonuc.ok) oneriler.push({ rez: rz, atamalar: sonuc.atamalar, skor: sonuc.skor, notlar: sonuc.notlar });
    else basarisiz.push({ rez: rz, gerekce: sonuc.gerekce });
  }
  return { oneriler, basarisiz };
}

       sıfırlanmaz (kullanıcı «az önce açtığım kaydı bulamıyorum» demesin). */

    smsler: [],
    kahvalti: {},     /* 'TESIS|YYYY-AA-GG' → { 'rezId|misafirIndex': true }  (kahvaltıya inmeyenler) */
    raporlar: [],     /* ay sonu belge talepleri */
    seciliRezId: null,

  };

function guncelle(liste, id, fn) { return liste.map(x => x.id === id ? fn({ ...x }) : x); }

function indirgeyici(s, a) {
  const ku = s.kullanici ? s.kullanici.kod : 'TTK7719';    // işlem günlüğüne yazılacak kullanıcı
  switch (a.tip) {

    /* ── Oturum ───────────────────────────────────────────────────────── */
    case 'GIRIS': {
      const k = a.kullanici;
      const tesisler = yetkiliTesisler(k);
      const ilkEkran = 'ANA_MENU';
      return { ...s, kullanici: k, ekran: ilkEkran,
        tesis: tesisler.includes(s.tesis) ? s.tesis : tesisler[0],
        kullanicilar: s.kullanicilar.map(x => x.kod === k.kod ? { ...x, sonGiris: s.bugun } : x),
        gunluk: [{ tarih: s.bugun, tip: 'bilgi',
          metin: `Oturum açıldı: ${k.kod}` }, ...s.gunluk] };
    }

    case 'CIKIS': return { ...s, kullanici: null, odakRezId: null };

    case 'KULLANICI_GUNCELLE': {
      const kullanicilar = s.kullanicilar.map(k => k.kod === a.kod ? { ...k, ...a.degisiklik } : k);
      const guncel = kullanicilar.find(k => k.kod === a.kod);
      const kendisi = s.kullanici && s.kullanici.kod === a.kod;
      return { ...s, kullanicilar,
        kullanici: kendisi ? { ...s.kullanici, ...a.degisiklik } : s.kullanici,
        gunluk: [{ tarih: s.bugun, tip: 'bilgi',
          metin: `Kullanıcı güncellendi: ${guncel.kod} — ${guncel.ad} · rol ${rolAd(guncel.rol)} · ` +
                 `${guncel.tesisler === '*' ? 'tüm misafirhaneler' : guncel.tesisler.length + ' misafirhane'} · ` +
                 `${guncel.aktif ? 'aktif' : 'pasif'} (işlem: ${ku})` }, ...s.gunluk] };
    }

    case 'KULLANICI_EKLE':
      return { ...s, kullanicilar: [...s.kullanicilar, { ...a.kullanici, sonGiris: null }],
        gunluk: [{ tarih: s.bugun, tip: 'basari',
          metin: `Yeni kullanıcı tanımlandı: ${a.kullanici.kod} — ${a.kullanici.ad} (${rolAd(a.kullanici.rol)}) · işlem: ${ku}` }, ...s.gunluk] };

    case 'TESIS': return { ...s, tesis: a.tesis };
    case 'EKRAN': return { ...s, ekran: a.ekran };
    case 'SECILI_REZ': return { ...s, seciliRezId: a.rezId };
    case 'OLCEK': {
      const o = Math.min(1.35, Math.max(0.85, Number(a.olcek.toFixed(2))));
      try { localStorage.setItem('msfh_olcek', String(o)); } catch (_) {}
      return { ...s, olcek: o };
    }

    /* Motor önerisini gerçek yerleşime çevir */
    case 'ONERI_UYGULA': {
      let rezler = s.rezervasyonlar;
      const kayit = [];
      for (const o of a.oneriler) {
        rezler = guncelle(rezler, o.rez.id, rz => {
          rz.misafirler = rz.misafirler.map((g, i) => {
            const at = o.atamalar.find(x => x.misafirIndex === i);
            return at ? { ...g, yatakId: at.yatakId, oda_no: at.oda_no, yatak_no: at.yatak_no } : { ...g };
          });
          if (rz.statu === 'TALEP') {
            const kural = s.kurallar[rz.tesis];
            rz.statu = (rz.pesinat_tutari > 0 && rz.tahsil_edilen < rz.pesinat_tutari) ? 'PESINAT_BEKLENIYOR' : 'ONAYLI';
          }
          rz.hareketler = [...rz.hareketler, {
            tarih: s.bugun, kullanici: ku,
            metin: `Otomatik yerleştirme onaylandı → ${[...new Set(o.atamalar.map(x => 'Oda ' + x.oda_no + '/' + x.yatak_no))].join(', ')}`
          }];
          return rz;
        });
        kayit.push(`${o.rez.rez_no} — ${o.rez.ad_soyad}: ${[...new Set(o.atamalar.map(x => x.oda_no))].map(o2 => 'Oda ' + o2).join(', ')}`);
      }
      return { ...s, rezervasyonlar: rezler,
        gunluk: [{ tarih: s.bugun, tip: 'basari', metin: `${a.oneriler.length} talep yerleştirildi: ${kayit.slice(0, 3).join(' · ')}${kayit.length > 3 ? ' …' : ''}` }, ...s.gunluk] };
    }

    /* Sürükle-bırak / manuel atama */
    case 'MANUEL_ATA': {
      const { rezId, misafirIndex, yatak } = a;
      const rezler = guncelle(s.rezervasyonlar, rezId, rz => {
        rz.misafirler = rz.misafirler.map((g, i) => i === misafirIndex
          ? { ...g, yatakId: yatak.id, oda_no: yatak.oda_no, yatak_no: yatak.yatak_no } : { ...g });
        if (rz.statu === 'TALEP' && rz.misafirler.every(g => g.yatakId)) {
          rz.statu = (rz.pesinat_tutari > 0 && rz.tahsil_edilen < rz.pesinat_tutari) ? 'PESINAT_BEKLENIYOR' : 'ONAYLI';
        }
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Manuel yerleştirme: ${rz.misafirler[misafirIndex].adi_soyadi} → Oda ${yatak.oda_no} / Yatak ${yatak.yatak_no}` }];
        return rz;
      });
      const kyt = rezler.find(x => x.id === rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: 'basari',
        metin: `${kyt.rez_no} — ${kyt.misafirler[misafirIndex].adi_soyadi} manuel olarak Oda ${yatak.oda_no} / Yatak ${yatak.yatak_no} yatağına yerleştirildi` }, ...s.gunluk] };
    }

    /* Manuel yerleştirme penceresinden gelen toplu atama */
    case 'MANUEL_ATA_TOPLU': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.misafirler = rz.misafirler.map((g, i) => {
          const at = a.atamalar.find(x => x.misafirIndex === i);
          if (!at) return { ...g };
          if (!at.yatakId) return { ...g, yatakId: null, oda_no: null, yatak_no: null };
          return { ...g, yatakId: at.yatakId, oda_no: at.oda_no, yatak_no: at.yatak_no };
        });
        if (rz.statu === 'TALEP' && rz.misafirler.every(g => g.yatakId)) {
          rz.statu = (rz.pesinat_tutari > rz.tahsil_edilen) ? 'PESINAT_BEKLENIYOR' : 'ONAYLI';
        }
        const yerlesim = rz.misafirler.filter(g => g.oda_no).map(g => `${g.adi_soyadi} → Oda ${g.oda_no}/${g.yatak_no}`);
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Manuel yerleştirme: ${yerlesim.join(' · ') || 'tahsis kaldırıldı'}` }];
        return rz;
      });
      const kyt4 = rezler.find(x => x.id === a.rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: 'basari',
        metin: `${kyt4.rez_no} — ${kyt4.ad_soyad}: manuel yerleştirme kaydedildi ` +
               `(${kyt4.misafirler.filter(g => g.oda_no).map(g => 'Oda ' + g.oda_no + '/' + g.yatak_no).join(', ') || 'tahsis yok'})` }, ...s.gunluk] };
    }

    /* Kapora dekontu yüklendi → müdür onayına düşer */
    case 'DEKONT_YUKLE': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.dekont = { ...a.dekont, durum: 'YUKLENDI', yukleyen: ku, yuklenme_tarihi: s.bugun,
                      red_gerekcesi: '', onaylayan: null, onay_tarihi: null };
        if (['TALEP', 'PESINAT_BEKLENIYOR'].includes(rz.statu)) rz.statu = 'ONAY_BEKLIYOR';
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Kapora dekontu yüklendi — ${a.dekont.banka} · Dekont No ${a.dekont.dekont_no} · ${para(a.dekont.tutar)} ` +
                 `(${a.dekont.dosya_adi}) · müdür onayına gönderildi` }];
        return rz;
      });
      const kd = rezler.find(x => x.id === a.rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: 'bilgi',
        metin: `${kd.rez_no} — ${kd.ad_soyad}: kapora dekontu yüklendi (${para(a.dekont.tutar)}), müdür onayı bekleniyor` }, ...s.gunluk] };
    }

    /* Müdür dekontu onayladı → rezervasyon listeye girer, yerleştirmeye açılır */
    case 'DEKONT_ONAY': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.dekont = { ...rz.dekont, durum: 'ONAYLANDI', onaylayan: ku, onay_tarihi: s.bugun, red_gerekcesi: '' };
        rz.tahsil_edilen = Math.max(rz.tahsil_edilen || 0, rz.dekont.tutar || rz.pesinat_tutari);
        rz.pesinattan_kalan = Math.max(0, rz.pesinat_tutari - rz.tahsil_edilen);
        rz.makbuz_no = rz.makbuz_no || rz.dekont.dekont_no;
        rz.statu = (rz.gelis_tarihi <= s.bugun && rz.cikis_tarihi > s.bugun) ? 'KONAKLIYOR' : 'ONAYLI';
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Kapora dekontu onaylandı${a.aciklama ? ' — ' + a.aciklama : ''}; rezervasyon listeye alındı (${statuAd(rz.statu)})` }];
        return rz;
      });
      const kd = rezler.find(x => x.id === a.rezId);
      const odaNo = [...new Set(kd.misafirler.filter(g => g.oda_no).map(g => g.oda_no))].join(', ');
      const smsO = smsUret('ONAY', kd, (TESISLER.find(t => t.kod === kd.tesis) || {}).ad || '', s.bugun, { oda: odaNo });
      return { ...s, rezervasyonlar: rezler, smsler: [smsO, ...s.smsler], gunluk: [{ tarih: s.bugun, tip: 'basari',
        metin: `${kd.rez_no} — ${kd.ad_soyad}: kapora dekontu onaylandı (${para(kd.tahsil_edilen)}), rezervasyon ${statuAd(kd.statu)}` }, ...s.gunluk] };
    }

    /* Müdür dekontu reddetti → kapora beklemeye geri döner */
    case 'DEKONT_RED': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.dekont = { ...rz.dekont, durum: 'REDDEDILDI', red_gerekcesi: a.gerekce,
                      onaylayan: ku, onay_tarihi: s.bugun };
        rz.statu = 'PESINAT_BEKLENIYOR';
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Kapora dekontu reddedildi — ${a.gerekce}` }];
        return rz;
      });
      const kd = rezler.find(x => x.id === a.rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: 'uyari',
        metin: `${kd.rez_no} — ${kd.ad_soyad}: dekont reddedildi (${a.gerekce}); kayıt kapora beklemeye döndü` }, ...s.gunluk] };
    }

    case 'ATAMA_KALDIR': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.misafirler = rz.misafirler.map((g, i) =>
          (a.misafirIndex == null || i === a.misafirIndex) ? { ...g, yatakId: null, oda_no: null, yatak_no: null } : { ...g });
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku, metin: 'Yatak tahsisi kaldırıldı' }];
        return rz;
      });
      const kyt2 = rezler.find(x => x.id === a.rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: 'bilgi',
        metin: `${kyt2.rez_no} — yatak tahsisi kaldırıldı, yatak serbest bırakıldı` }, ...s.gunluk] };
    }

    /* Peşinat tahsilatı (yalnız statü/kayıt seviyesinde — muhasebe entegrasyonu yok) */
    case 'TAHSILAT': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.tahsil_edilen = Math.min(rz.pesinat_tutari, (rz.tahsil_edilen || 0) + a.tutar);
        rz.pesinattan_kalan = Math.max(0, rz.pesinat_tutari - rz.tahsil_edilen);
        rz.makbuz_no = (a.makbuzNo && a.makbuzNo.trim()) || rz.makbuz_no || String(1000 + Math.floor(Math.random() * 9000));
        if (rz.pesinattan_kalan === 0 && ['TALEP','PESINAT_BEKLENIYOR'].includes(rz.statu)) rz.statu = 'ONAYLI';
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Peşinat tahsilatı ${para(a.tutar)} (Makbuz No ${rz.makbuz_no})` }];
        return rz;
      });
      const kayit = rezler.find(x => x.id === a.rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: 'basari',
        metin: `${kayit.rez_no} — ${kayit.ad_soyad}: ${para(a.tutar)} peşinat tahsil edildi, statü ${statuAd(kayit.statu)}` }, ...s.gunluk] };
    }

    case 'STATU': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        const eski = rz.statu;
        rz.statu = a.statu;
        if (a.statu === 'IPTAL') rz.misafirler = rz.misafirler.map(g => ({ ...g, yatakId: null, oda_no: null, yatak_no: null }));
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: `Statü değişikliği: ${statuAd(eski)} → ${statuAd(a.statu)}${a.statu === 'IPTAL' ? ' (yatak tahsisi serbest bırakıldı)' : ''}` }];
        return rz;
      });
      const kyt3 = rezler.find(x => x.id === a.rezId);
      const smsIptal = a.statu === 'IPTAL'
        ? [smsUret('IPTAL', kyt3, (TESISLER.find(t => t.kod === kyt3.tesis) || {}).ad || '', s.bugun, { gerekce: a.gerekce })]
        : [];
      return { ...s, rezervasyonlar: rezler, smsler: [...smsIptal, ...s.smsler],
        gunluk: [{ tarih: s.bugun, tip: a.statu === 'IPTAL' ? 'uyari' : 'bilgi',
        metin: `${kyt3.rez_no} — ${kyt3.ad_soyad}: statü ${statuAd(a.statu)} olarak güncellendi` }, ...s.gunluk] };
    }

    case 'KURAL': {
      const kurallar = { ...s.kurallar, [a.tesis]: { ...s.kurallar[a.tesis], [a.alan]: a.deger } };
      // kural değişince ilgili tesisin peşinat tutarları yeniden hesaplanır
      const rezler = s.rezervasyonlar.map(rz => {
        if (rz.tesis !== a.tesis || ['CIKIS','IPTAL'].includes(rz.statu)) return rz;
        const k = { ...rz };
        pesinatHesapla(k, s.odalar, kurallar[a.tesis]);
        if (k.pesinat_tutari === 0 && k.statu === 'PESINAT_BEKLENIYOR') k.statu = 'ONAYLI';
        if (k.pesinat_tutari > k.tahsil_edilen && k.statu === 'ONAYLI' && fark(s.bugun, k.gelis_tarihi) > 0) k.statu = 'PESINAT_BEKLENIYOR';
        return k;
      });
      return { ...s, kurallar, rezervasyonlar: rezler,
        gunluk: [{ tarih: s.bugun, tip: 'bilgi', metin: `${TESISLER.find(t => t.kod === a.tesis).ad} peşinat kuralı güncellendi — etkilenen kayıtlar yeniden hesaplandı` }, ...s.gunluk] };
    }

    /* Süresi dolan talepleri iptale düşür, yatakları serbest bırak */
    case 'SURE_KONTROL': {
      const hedefGun = a.gun || s.bugun;
      const dusen = [];
      const rezler = s.rezervasyonlar.map(rz => {
        if (rz.statu !== 'PESINAT_BEKLENIYOR') return rz;
        if (!rz.pesinat_son_odeme_tarihi || rz.pesinat_son_odeme_tarihi >= hedefGun) return rz;
        if (rz.tahsil_edilen >= rz.pesinat_tutari) return rz;
        dusen.push(rz.rez_no + ' — ' + rz.ad_soyad);
        return { ...rz, statu: 'IPTAL',
          misafirler: rz.misafirler.map(g => ({ ...g, yatakId: null, oda_no: null, yatak_no: null })),
          hareketler: [...rz.hareketler, { tarih: hedefGun, kullanici: 'SİSTEM',
            metin: `Peşinat son ödeme tarihi (${tr(rz.pesinat_son_odeme_tarihi)}) geçtiği için otomatik iptal edildi; yatak tahsisi serbest bırakıldı` }] };
      });
      return { ...s, rezervasyonlar: rezler, gunluk: dusen.length
        ? [{ tarih: hedefGun, tip: 'uyari', metin: `Süre aşımı: ${dusen.length} talep otomatik iptal edildi (${dusen.slice(0, 2).join(' · ')}${dusen.length > 2 ? ' …' : ''})` }, ...s.gunluk]
        : [{ tarih: hedefGun, tip: 'bilgi', metin: 'Süre kontrolü çalıştı — iptale düşen talep yok' }, ...s.gunluk] };
    }

    /* Demo için sistem tarihini ilerlet ve statü kurallarını uygula */
    case 'GUN_ILERLET': {
      const yeni = ekle(s.bugun, a.adet || 1);
      const olaylar = [];
      let rezler = s.rezervasyonlar.map(rz => {
        let k = rz;
        if (['PESINAT_BEKLENIYOR', 'TALEP'].includes(k.statu) && k.pesinat_tutari > 0 && k.pesinat_son_odeme_tarihi &&
            k.pesinat_son_odeme_tarihi < yeni && k.tahsil_edilen < k.pesinat_tutari) {
          olaylar.push(`${k.rez_no} süre aşımından iptal`);
          k = { ...k, statu: 'IPTAL', misafirler: k.misafirler.map(g => ({ ...g, yatakId: null, oda_no: null, yatak_no: null })),
                hareketler: [...k.hareketler, { tarih: yeni, kullanici: 'SİSTEM', metin: 'Kapora son ödeme tarihi geçti — otomatik iptal, yatak serbest' }] };
        }
        if (k.statu === 'ONAYLI' && k.gelis_tarihi <= yeni && k.cikis_tarihi > yeni) {
          olaylar.push(`${k.rez_no} girişi yapıldı`);
          k = { ...k, statu: 'KONAKLIYOR', hareketler: [...k.hareketler, { tarih: yeni, kullanici: 'SİSTEM', metin: 'Giriş kaydı açıldı' }] };
        }
        if (k.statu === 'KONAKLIYOR' && k.cikis_tarihi <= yeni) {
          olaylar.push(`${k.rez_no} çıkışı yapıldı`);
          k = { ...k, statu: 'CIKIS', hareketler: [...k.hareketler, { tarih: yeni, kullanici: 'SİSTEM', metin: 'Çıkış kaydı kapatıldı' }] };
        }
        return k;
      });
      return { ...s, bugun: yeni, rezervasyonlar: rezler,
        gunluk: [{ tarih: yeni, tip: olaylar.length ? 'basari' : 'bilgi',
          metin: `Sistem tarihi ${tr(yeni)} oldu — ${olaylar.length} otomatik statü değişikliği${olaylar.length ? ': ' + olaylar.slice(0, 3).join(', ') + (olaylar.length > 3 ? ' …' : '') : ''}` }, ...s.gunluk] };
    }

    /* Yeni rezervasyon / kayıt girişi (MSFH0100 karşılığı) */
    case 'REZ_EKLE': {
      const rz = a.rez;
      const yerlesik = rz.misafirler.filter(g => g.yatakId).length;
      const sms = smsUret('KAYIT', rz, (TESISLER.find(t => t.kod === rz.tesis) || {}).ad || '', s.bugun);
      rz.hareketler = [...(rz.hareketler || []), { tarih: s.bugun, kullanici: ku,
        metin: sms.durum === 'GONDERILDI' ? `Bilgilendirme SMS'i gönderildi (${sms.telefon})`
                                          : 'Bilgilendirme SMS\'i gönderilemedi — telefon numarası yok' }];
      return { ...s, rezervasyonlar: [...s.rezervasyonlar, rz], smsler: [sms, ...s.smsler],
        ekran: 'TALEPLER', odakRezId: rz.id, seciliRezId: rz.id, tesis: rz.tesis, odakTip: 'YENI',
        gunluk: [{ tarih: s.bugun, tip: 'basari',
          metin: `Yeni kayıt açıldı: ${rz.rez_no} — ${rz.ad_soyad} · ${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)} · ` +
                 `${rz.kisi_sayisi} kişi · ${yerlesik ? [...new Set(rz.misafirler.filter(g => g.oda_no).map(g => 'Oda ' + g.oda_no + '/' + g.yatak_no))].join(', ') : 'yatak tahsisi yapılmadı'} · statü ${statuAd(rz.statu)}` },
          ...s.gunluk] };
    }

    case 'ODAK_TEMIZLE': return { ...s, odakRezId: null, odakTip: null };

    case 'TALEP_SUZGEC': return { ...s, talepSuzgec: { ...s.talepSuzgec, ...a.degisiklik } };

    /* Kahvaltı yoklaması — resepsiyon günbegün işler */
    case 'KAHVALTI': {
      const anahtar = a.tesis + '|' + a.tarih;
      const gun = { ...(s.kahvalti[anahtar] || {}) };
      if (a.deger) gun[a.anahtar] = true; else delete gun[a.anahtar];
      return { ...s, kahvalti: { ...s.kahvalti, [anahtar]: gun } };
    }

    /* Ay sonu belgesi: muhasebe ister → resepsiyon hazırlar */
    case 'RAPOR_TALEP': {
      const kayit = { id: 'RPR' + Math.random().toString(36).slice(2, 8), tesis: a.tesis, ay: a.ay,
        not: a.not || '', isteyen: ku, talep_tarihi: s.bugun, durum: 'TALEP',
        hazirlayan: null, hazirlanma_tarihi: null, belge: null };
      return { ...s, raporlar: [kayit, ...s.raporlar],
        gunluk: [{ tarih: s.bugun, tip: 'bilgi',
          metin: `Ay sonu belgesi istendi: ${ayEtiketi(a.ay)} · ${TESISLER.find(t => t.kod === a.tesis).ad} — isteyen ${ku}` }, ...s.gunluk] };
    }
    case 'RAPOR_HAZIRLA': {
      const o = a.ozet;
      const belge = raporPdfUret('AY SONU BELGESI', [
        ['B', 15, 'TURKIYE TASKOMURU KURUMU'],
        ['N', 10, 'Misafirhane Bilgi Sistemi'],
        ['B', 13, 'AY SONU KONAKLAMA VE KAHVALTI BELGESI'],
        ['-', 0, ''],
        ['N', 11, 'Misafirhane   : ' + a.tesisAd],
        ['N', 11, 'Donem         : ' + o.bas + ' / ' + o.son],
        ['N', 11, 'Hazirlayan    : ' + ku + '  ·  Tarih: ' + s.bugun],
        ['-', 0, ''],
        ['B', 12, 'KONAKLAMA'],
        ['N', 11, 'Konaklama kaydi           : ' + o.kayit],
        ['N', 11, 'Toplam konaklama gecesi   : ' + o.gece + ' kisi-gece'],
        ['N', 11, 'Iptal edilen kayit        : ' + o.iptal],
        ['-', 0, ''],
        ['B', 12, 'KAHVALTI'],
        ['N', 11, 'Verilen kahvalti          : ' + o.kahvalti + ' adet'],
        ['N', 11, 'Kahvalti yapmayan misafir : ' + o.kahvaltisiz + ' adet'],
        ['-', 0, ''],
        ['B', 12, 'MALI OZET'],
        ['N', 11, 'Tahakkuk eden yatak bedeli: ' + o.bedel.toLocaleString('tr-TR') + ' TL'],
        ['N', 11, 'Tahsil edilen             : ' + o.tahsilat.toLocaleString('tr-TR') + ' TL'],
        ['-', 0, ''],
        ['N', 9,  'Bu belge prototip gosterimi icin uretilmistir; resmi evrak yerine gecmez.'],
      ]);
      const raporlar = s.raporlar.map(r => r.id === a.id
        ? { ...r, durum: 'HAZIR', hazirlayan: ku, hazirlanma_tarihi: s.bugun, belge } : r);
      const rp = raporlar.find(r => r.id === a.id);
      return { ...s, raporlar, gunluk: [{ tarih: s.bugun, tip: 'basari',
        metin: `Ay sonu belgesi hazırlandı: ${ayEtiketi(rp.ay)} · ${a.tesisAd} — hazırlayan ${ku}` }, ...s.gunluk] };
    }

    /* Öncelikli misafir: müdür kararıyla kapora beklenmeden yerleştirme açılır */
    case 'KAPORA_MUAF': {
      const rezler = guncelle(s.rezervasyonlar, a.rezId, rz => {
        rz.kapora_muafiyeti = a.kaldir ? null
          : { gerekce: a.gerekce, kullanici: ku, tarih: s.bugun };
        rz.hareketler = [...rz.hareketler, { tarih: s.bugun, kullanici: ku,
          metin: a.kaldir ? 'Kapora muafiyeti kaldırıldı; yerleştirme yeniden dekont onayına bağlandı'
                          : `Kapora muafiyeti verildi (öncelikli misafir) — ${a.gerekce}. Kapora tahsilatı düşmez, takip listesinde kalır.` }];
        return rz;
      });
      const k2 = rezler.find(x => x.id === a.rezId);
      return { ...s, rezervasyonlar: rezler, gunluk: [{ tarih: s.bugun, tip: a.kaldir ? 'uyari' : 'basari',
        metin: a.kaldir ? `${k2.rez_no} — ${k2.ad_soyad}: kapora muafiyeti kaldırıldı`
                        : `${k2.rez_no} — ${k2.ad_soyad}: kapora beklenmeden yerleştirmeye açıldı (${a.gerekce})` }, ...s.gunluk] };
    }

    /* Komut aramasından ya da yardımcı bottan bir kaydı açma */
    case 'REZ_ODAKLA': {
      const rz = s.rezervasyonlar.find(r => r.id === a.rezId);
      if (!rz) return s;
      return { ...s, ekran: 'TALEPLER', tesis: rz.tesis, odakRezId: rz.id, seciliRezId: rz.id, odakTip: 'ARAMA' };
    }

    case 'GUNLUK': return { ...s, gunluk: [{ tarih: s.bugun, tip: a.gunlukTip || 'bilgi', metin: a.metin }, ...s.gunluk] };

    default: return s;
  }
}

/* ── Uzunluğu belli alanlar için doğrulamalı girdi ─────────────────────────
   Tc kimlik no, telefon ve IBAN gibi alanlarda hane sayısı bellidir. Bu girdi
   harf/işaret girişini engeller, hane sayısını aşan rakamı kabul etmez ve
   «fazla rakam girdiniz» uyarısını anında gösterir. Sayaç (8/11) hep görünür. */
const rakamlar = (x) => (x || '').replace(/\D/g, '');

const ALAN_KURALI = {
  TC:   { hane: 11, ad: 'Tc kimlik no', yerTutucu: '11 hane',
          bicimle: (r) => r,
          gecerli: (r) => /^[1-9][0-9]{10}$/.test(r),
          hata: (r) => r.startsWith('0') ? 'Tc kimlik no 0 ile başlayamaz.' : 'Tc kimlik no 11 hane olmalıdır.' },
  TEL:  { hane: 10, ad: 'Telefon no', yerTutucu: '5xx xxx xx xx',
          bicimle: (r) => [r.slice(0, 3), r.slice(3, 6), r.slice(6, 8), r.slice(8, 10)].filter(Boolean).join(' '),
          gecerli: (r) => /^[1-9][0-9]{9}$/.test(r),
          hata: () => 'Telefon no başında 0 olmadan 10 hane olmalıdır (örn. 532 123 45 67).' },
  IBAN: { hane: 24, onEk: 'TR', ad: 'IBAN', yerTutucu: 'TR__ ____ ____ ____ ____ ____ __',
          bicimle: (r) => ('TR' + r).replace(/(.{4})/g, '$1 ').trim(),
          gecerli: (r) => r.length === 24 && ibanGecerli('TR' + r),
          hata: (r) => r.length < 24 ? 'IBAN, TR ile birlikte 26 karakterdir (TR + 24 rakam).'
                                     : 'IBAN kontrol hanesi tutmuyor — numarayı yeniden okuyunuz.' },
  SICIL:{ hane: 6, ad: 'Sicil no', yerTutucu: '6 hane', bicimle: (r) => r,
          gecerli: (r) => r.length === 6, hata: () => 'Sicil no 6 hane olmalıdır.' },
};

/* IBAN mod-97 denetimi (ISO 13616) */
function ibanGecerli(iban) {
  const t = (iban || '').toUpperCase().replace(/\s/g, '');
  if (!/^TR\d{24}$/.test(t)) return false;
  const dizi = (t.slice(4) + t.slice(0, 4)).replace(/[A-Z]/g, c => String(c.charCodeAt(0) - 55));
  let kalan = 0;
  for (const rakam of dizi) kalan = (kalan * 10 + Number(rakam)) % 97;
  return kalan === 1;
}

function SayiliGirdi({ tur, deger, onChange, className = '', sinif = '', zorunlu, ipucu, onBos = true }) {
  const kural = ALAN_KURALI[tur];
  const [tasma, setTasma] = useState(false);
  const zaman = useRef(null);
  useEffect(() => () => clearTimeout(zaman.current), []);

  const ham = rakamlar(deger).slice(0, kural.hane);
  const eksik = ham.length > 0 && ham.length < kural.hane;
  const hataliDolu = ham.length === kural.hane && !kural.gecerli(ham);
  const bos = ham.length === 0;

  const yaz = (metin) => {
    const yeni = rakamlar(metin);
    clearTimeout(zaman.current);
    if (yeni.length > kural.hane) {
      setTasma(true);
      zaman.current = setTimeout(() => setTasma(false), 3000);
    } else {
      setTasma(false);   /* kullanıcı düzeltmeye başladıysa uyarı beklemesin */
    }
    onChange(yeni.slice(0, kural.hane));
  };

  const cerceve = tasma || hataliDolu ? 'border-rose-400 bg-rose-50'
                : eksik ? 'border-amber-400 bg-amber-50'
                : ham.length === kural.hane ? 'border-emerald-400' : 'border-slate-300';

  return (
    <span className={`inline-block ${className}`}>
      <span className="relative block">
        <input value={kural.bicimle(ham)} onChange={e => yaz(e.target.value)}
          onPaste={e => { e.preventDefault(); yaz((e.clipboardData.getData('text') || '')); }}
          inputMode="numeric" autoComplete="off" placeholder={kural.yerTutucu}
          aria-label={kural.ad} aria-invalid={hataliDolu || eksik ? 'true' : 'false'}
          className={`num w-full border rounded px-2 py-1 pr-11 text-xs bg-white focus:outline-none
                      focus:ring-1 focus:ring-ttk-400 ${cerceve} ${sinif}`} />
        <span className={`num absolute right-1.5 top-1/2 -translate-y-1/2 text-[0.6rem] pointer-events-none
          ${ham.length === kural.hane ? 'text-emerald-600' : eksik ? 'text-amber-700' : 'text-slate-400'}`}>
          {ham.length}/{kural.hane}
        </span>
      </span>
      {tasma && (
        <span className="block text-[0.62rem] leading-tight text-rose-700 font-semibold mt-0.5 bel">
          ⛔ Fazla rakam — {kural.ad} {kural.hane} hanedir, sonrası alınmadı.
        </span>
      )}
      {!tasma && (eksik || hataliDolu) && (
        <span className="block text-[0.62rem] leading-tight text-rose-700 mt-0.5">
          {eksik ? `${kural.hane - ham.length} hane eksik — ${kural.ad} ${kural.hane} hane olmalıdır.` : kural.hata(ham)}
        </span>
      )}
      {!tasma && bos && zorunlu && !onBos && (
        <span className="block text-[0.62rem] leading-tight text-amber-700 mt-0.5">{kural.ad} zorunludur.</span>
      )}
      {ipucu && !tasma && !eksik && !hataliDolu && (
        <span className="block text-[0.6rem] leading-tight text-slate-400 mt-0.5">{ipucu}</span>
      )}
    </span>
  );
}

/* ── Açılır takvim ─────────────────────────────────────────────────────────
   Tarih kutusunun yanındaki küçük takvim simgesine tıklanınca açılır. Kutuya
   elle GG.AA.YYYY yazmak da çalışmayı sürdürür; takvim yalnız kısa yoldur.
   Panel fixed konumlanır (tablo/pencere taşmalarından etkilenmesin diye) ve
   yeri ölçülerek verilir; ekran kenarından taşmaz.                          */
const HAFTA_BASLIK = ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pz'];

/* Ayın ilk gününün pazartesi=0 olacak biçimde kaçıncı sütunda başladığı */
function ayIzgarasi(yil, ay) {
  const ilk = new Date(Date.UTC(yil, ay, 1));
  const kaydir = (ilk.getUTCDay() + 6) % 7;            // Pazar=0 → Pazartesi=0
  const gunSayisi = new Date(Date.UTC(yil, ay + 1, 0)).getUTCDate();
  const hucreler = [];
  for (let i = 0; i < kaydir; i++) hucreler.push(null);
  for (let g = 1; g <= gunSayisi; g++) hucreler.push(iso(new Date(Date.UTC(yil, ay, g))));
  while (hucreler.length % 7) hucreler.push(null);
  return hucreler;
}

function TakvimPaneli({ deger, bugun, enAz, enCok, sec, kapat, capa }) {
  const temel = deger || bugun || iso(new Date());
  const [yil, setYil] = useState(Number(temel.slice(0, 4)));
  const [ay, setAy] = useState(Number(temel.slice(5, 7)) - 1);
  const kutuRef = useRef(null);

  /* Konumu ölç ve yerleştir — açılırken kaymasın, kenardan taşmasın */
  useLayoutEffect(() => {
    const el = kutuRef.current;
    if (!el || !capa) return;
    const g = el.getBoundingClientRect(), bosluk = 6;
    const altta = capa.bottom + g.height + bosluk <= window.innerHeight;
    el.style.left = Math.round(Math.min(Math.max(capa.left, bosluk), window.innerWidth - g.width - bosluk)) + 'px';
    el.style.top = Math.round(altta ? capa.bottom + bosluk : Math.max(bosluk, capa.top - g.height - bosluk)) + 'px';
    el.style.visibility = 'visible';
  }, [capa]);

  useEffect(() => {
    const disari = (e) => { if (kutuRef.current && !kutuRef.current.contains(e.target)) kapat(); };
    const tus = (e) => { if (e.key === 'Escape') kapat(); };
    document.addEventListener('mousedown', disari);
    document.addEventListener('keydown', tus);
    return () => { document.removeEventListener('mousedown', disari); document.removeEventListener('keydown', tus); };
  }, [kapat]);

  const hucreler = useMemo(() => ayIzgarasi(yil, ay), [yil, ay]);
  const ayDegistir = (yon) => {
    const y = new Date(Date.UTC(yil, ay + yon, 1));
    setYil(y.getUTCFullYear()); setAy(y.getUTCMonth());
  };
  const kapali = (t) => (enAz && t < enAz) || (enCok && t > enCok);

  const kisaYol = (ad, tarih, ipucu) => (
    <button key={ad} onClick={() => { if (!kapali(tarih)) sec(tarih); }} disabled={kapali(tarih)}
      data-ipucu={ipucu} className="px-2 py-1 rounded border border-slate-300 text-2xs font-semibold
        text-ttk-700 hover:bg-ttk-50 hover:border-ttk-400 disabled:opacity-40 disabled:cursor-not-allowed">
      {ad}
    </button>
  );

  return (
    <div ref={kutuRef} style={{ left: 0, top: 0, visibility: 'hidden' }} role="dialog" aria-label="Takvim"
      className="fixed z-[70] w-[16.5rem] bg-white rounded-lg shadow-2xl border border-slate-300 p-2 ipucu-bel">
      <div className="flex items-center gap-1 mb-1.5">
        <button onClick={() => ayDegistir(-12)} data-ipucu="Önceki yıl"
          className="px-1.5 py-1 rounded hover:bg-slate-100 text-slate-500 text-2xs num">«</button>
        <button onClick={() => ayDegistir(-1)} data-ipucu="Önceki ay"
          className="px-1.5 py-1 rounded hover:bg-slate-100 text-slate-600">◀</button>
        <div className="flex-1 text-center text-xs font-bold text-ttk-900">{AY[ay]} {yil}</div>
        <button onClick={() => ayDegistir(1)} data-ipucu="Sonraki ay"
          className="px-1.5 py-1 rounded hover:bg-slate-100 text-slate-600">▶</button>
        <button onClick={() => ayDegistir(12)} data-ipucu="Sonraki yıl"
          className="px-1.5 py-1 rounded hover:bg-slate-100 text-slate-500 text-2xs num">»</button>
      </div>

      <div className="grid grid-cols-7 gap-px mb-0.5">
        {HAFTA_BASLIK.map((g, i) => (
          <div key={g} className={`text-center text-[0.6rem] font-bold py-0.5
            ${i >= 5 ? 'text-rose-400' : 'text-slate-400'}`}>{g}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-px">
        {hucreler.map((t, i) => {
          if (!t) return <div key={'b' + i} />;
          const secili = t === deger, buGun = t === bugun, hs = haftaSonu(t), yasak = kapali(t);
          return (
            <button key={t} onClick={() => sec(t)} disabled={yasak}
              aria-current={secili ? 'date' : undefined}
              className={`num h-7 rounded text-xs transition-colors
                ${secili ? 'bg-ttk-600 text-white font-bold'
                  : yasak ? 'text-slate-300 cursor-not-allowed'
                  : buGun ? 'bg-amber-100 text-amber-900 font-bold ring-1 ring-amber-300 hover:bg-amber-200'
                  : hs ? 'text-rose-500 hover:bg-slate-100' : 'text-slate-700 hover:bg-slate-100'}`}>
              {Number(t.slice(8, 10))}
            </button>
          );
        })}
      </div>

      <div className="flex items-center gap-1 flex-wrap mt-2 pt-2 border-t border-slate-200">
        {kisaYol('Bugün', bugun, 'Bugünün tarihini seç')}
        {kisaYol('Yarın', ekle(bugun, 1), 'Yarını seç')}
        {kisaYol('+1 hafta', ekle(bugun, 7), 'Bir hafta sonrası')}
        <button onClick={kapat} className="ml-auto px-2 py-1 rounded text-2xs text-slate-500 hover:bg-slate-100">Kapat</button>
      </div>
    </div>
  );
}

/* Tarih kutusu: elle yazma + takvim simgesi. enAz/enCok ile sınır verilebilir. */
function TarihGirdi({ deger, onChange, className = '', enAz, enCok, bugun }) {
  const [metin, setMetin] = useState(tr(deger));
  const [takvim, setTakvim] = useState(null);
  const sarmalRef = useRef(null);
  useEffect(() => setMetin(tr(deger)), [deger]);

  const uygula = () => {
    const p = metin.trim().replace(/[\/\-\s]/g, '.').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (!p) { setMetin(tr(deger)); return; }
    const s = `${p[3]}-${p[2].padStart(2, '0')}-${p[1].padStart(2, '0')}`;
    const d = new Date(s + 'T00:00:00Z');
    if (isNaN(d.getTime()) || iso(d) !== s) { setMetin(tr(deger)); return; }
    onChange(s);
  };
  const ac = () => {
    const r = sarmalRef.current.getBoundingClientRect();
    setTakvim({ left: r.left, top: r.top, bottom: r.bottom });
  };

  return (
    <span ref={sarmalRef} className={`inline-flex items-stretch ${className.includes('w-full') || className.includes('!w-full') ? 'w-full' : ''}`}>
      <input value={metin} placeholder="GG.AA.YYYY"
        data-ipucu="GG.AA.YYYY yazabilir, ↑ ↓ tuşlarıyla gün değiştirebilir ya da takvimden seçebilirsiniz"
        onChange={e => setMetin(e.target.value)} onBlur={uygula}
        onKeyDown={e => {
          if (e.key === 'Enter') uygula();
          if (e.key === 'ArrowUp')   { e.preventDefault(); onChange(ekle(deger, 1)); }
          if (e.key === 'ArrowDown') { e.preventDefault(); onChange(ekle(deger, -1)); }
        }}
        className={`num w-[86px] flex-1 min-w-0 text-center border border-slate-300 rounded-l px-1.5 py-0.5 text-xs
                    bg-white focus:outline-none focus:ring-1 focus:ring-ttk-400 ${className}`} />
      <button type="button" onClick={ac} aria-label="Takvimden seç" aria-haspopup="dialog"
        data-ipucu="Takvimden seç"
        className={`shrink-0 px-1.5 border border-l-0 border-slate-300 rounded-r bg-slate-50 hover:bg-ttk-50
                    text-slate-500 hover:text-ttk-700 transition-colors ${takvim ? 'bg-ttk-100 text-ttk-800' : ''}`}>
        <Ikon ad="takvim" sinif="w-3.5 h-3.5" />
      </button>
      {takvim && (
        <TakvimPaneli deger={deger} bugun={bugun || SISTEM_TARIHI_BASLANGIC} enAz={enAz} enCok={enCok} capa={takvim}
          sec={(t) => { onChange(t); setTakvim(null); }} kapat={() => setTakvim(null)} />
      )}
    </span>
  );
}

const Modal = ({ baslik, genislik = 'max-w-5xl', kapat, children, altlik }) => (
  <div className="fixed inset-0 z-50 bg-ttk-900/40 flex items-start justify-center p-2 sm:p-6 overflow-auto" onMouseDown={e => { if (e.target === e.currentTarget) kapat(); }}>

      {altlik && <footer className="px-4 py-2.5 border-t border-slate-200 bg-slate-50 flex items-center justify-end gap-2 rounded-b">{altlik}</footer>}

);

const Cubuk = ({ oran, renk = 'bg-ttk-500' }) => (
  <div className="h-1.5 w-full bg-slate-200 rounded overflow-hidden">
    <div className={`h-full ${renk}`} style={{ width: Math.min(100, Math.max(0, oran)) + '%' }} />
  </div>
);


/* Ortak oda/yatak haritası. Hücrenin nasıl görüneceğini çağıran ekran belirler:
   hucre(yatak) -> { sinif, ad, baslik, ek?, props? }
   isimli=true iken her yatak satırında yatak no + misafir adı yazılır. */
function YatakHaritasi({ katlar, yataklar, hucre, isimli = true, yukseklik = 'max-h-[460px]' }) {
  return (
    <div className={`space-y-3 ${yukseklik} overflow-auto kaydir pr-1`}>
      {katlar.map(([kat, odaListesi]) => (
        <div key={kat}>
          <div className="text-2xs font-bold text-slate-500 uppercase tracking-wide mb-1">
            {kat}. Kat · {odaListesi.length} oda
          </div>
          <div className="grid gap-1.5"
            style={{ gridTemplateColumns: `repeat(auto-fill, minmax(${isimli ? 172 : 104}px, 1fr))` }}>
            {odaListesi.map(o => {
              const ys = yataklar.filter(y => y.odaId === o.id);
              return (
                <div key={o.id} className="border border-slate-200 rounded bg-slate-50/60 px-1.5 py-1">
                  <div className="flex items-center justify-between gap-1 mb-1">
                    <span className="num text-xs font-bold text-ttk-800">Oda {o.oda_no}</span>
                    <span className="flex items-center gap-1">
                      {o.protokol && <Rozet sinif="bg-violet-100 text-violet-700 border-violet-300" baslik="Protokol odası">P</Rozet>}
                      <span className="num text-[9px] text-slate-400">{para(o.yatak_fiyati)}</span>
                    </span>
                  </div>
                  <div className={isimli ? 'space-y-[3px]' : 'flex gap-1'}>
                    {ys.map(y => {
                      const h = hucre(y);
                      return isimli ? (
                        <div key={y.id} title={h.baslik} {...(h.props || {})}
                          className={`yatak-hucre flex items-center gap-1 px-1 py-[3px] rounded border text-2xs leading-4 ${h.sinif} ${h.ek || ''}`}>
                          <span className="num font-bold w-3.5 text-center shrink-0">{y.yatak_no}</span>
                          <span className="flex-1 truncate">{h.ad}</span>
                        </div>
                      ) : (
                        <div key={y.id} title={h.baslik} {...(h.props || {})}
                          className={`yatak-hucre flex-1 h-9 rounded border text-2xs font-bold flex items-center justify-center ${h.sinif} ${h.ek || ''}`}>
                          {y.yatak_no}
                        </div>
                      );
                    })}
                  </div>
                  {!isimli && <div className="num text-[9px] text-slate-400 mt-0.5">{para(o.yatak_fiyati)}/gece</div>}
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

const GorunumSecici = ({ deger, ayarla, secenekler }) => (
  <div className="flex items-center gap-0.5 bg-slate-100 rounded p-0.5">

        {ad}
      </button>
    ))}
  </div>
);

function gunIstatistikleri(tesisKod, gunler, yataklar, rezler, dolu, temizlik) {
  const tesisYatak = yataklar.filter(y => y.tesis === tesisKod);
  const giris = {}, cikis = {};
  for (const rz of rezler) {
    if (rz.tesis !== tesisKod || rz.statu === 'IPTAL') continue;
    const yerlesik = rz.misafirler.filter(g => g.yatakId).length;
    if (!yerlesik) continue;
    giris[rz.gelis_tarihi] = (giris[rz.gelis_tarihi] || 0) + yerlesik;
    cikis[rz.cikis_tarihi] = (cikis[rz.cikis_tarihi] || 0) + yerlesik;
  }
  return gunler.map(t => {
    let d = 0, tz = 0;
    for (const y of tesisYatak) {
      if (dolu.has(y.id + '|' + t)) d++;
      else if (temizlik.has(y.id + '|' + t)) tz++;
    }
    const kapasite = tesisYatak.length;
    return { tarih: t, kapasite, dolu: d, temizlik: tz, bos: kapasite - d - tz,
             giris: giris[t] || 0, cikis: cikis[t] || 0, oran: kapasite ? Math.round(d / kapasite * 100) : 0 };
  });
}

function yatakDurumu(y, t, dolu, temizlik) {
  const d = dolu.get(y.id + '|' + t);
  if (d) {
    if (d.rez.statu === 'ONAYLI') return { durum: 'REZERVE', kayit: d };
    if (d.rez.cikis_tarihi === ekle(t, 1)) return { durum: 'CIKIS_BEKLIYOR', kayit: d };
    return { durum: 'DOLU', kayit: d };
  }
  if (temizlik.has(y.id + '|' + t)) {
    const tz = temizlik.get(y.id + '|' + t);
    const cikan = tz.rez.misafirler.find(g => g.yatakId === y.id) || null;
    return { durum: 'TEMIZLIK', kayit: { ...tz, cikanMisafir: cikan } };
  }
  return { durum: 'BOS', kayit: null };
}
