function DolulukPanosu({ s, gonder, dolu, temizlik, acYeniKayit, izin, git, bolum }) {
  const tesisAd = (TESISLER.find(t => t.kod === s.tesis) || {}).ad || '';
  const [seritBas, setSeritBas] = useState(s.bugun);
  const [haritaTarihi, setHaritaTarihi] = useState(s.bugun);
  const [aralikBas, setAralikBas] = useState(s.bugun);
  const [aralikSon, setAralikSon] = useState(ekle(s.bugun, 3));
  const [detay, setDetay] = useState(null);
  const [listeFiltre, setListeFiltre] = useState('HEPSI');
  const [listeArama, setListeArama] = useState('');
  const [yazdirmaAcik, setYazdirmaAcik] = useState(false);

  useEffect(() => { setSeritBas(s.bugun); setHaritaTarihi(s.bugun); setAralikBas(s.bugun); setAralikSon(ekle(s.bugun, 3)); }, [s.bugun]);

  const gunler = useMemo(() => Array.from({ length: 30 }, (_, i) => ekle(seritBas, i)), [seritBas]);
  const ist = useMemo(() => gunIstatistikleri(s.tesis, gunler, s.yataklar, s.rezervasyonlar, dolu, temizlik),
    [s.tesis, gunler, s.yataklar, s.rezervasyonlar, dolu, temizlik]);
  const tesisYatak = useMemo(() => s.yataklar.filter(y => y.tesis === s.tesis), [s.yataklar, s.tesis]);
  const bugunIst = useMemo(() => gunIstatistikleri(s.tesis, [haritaTarihi], s.yataklar, s.rezervasyonlar, dolu, temizlik)[0],
    [s.tesis, haritaTarihi, s.yataklar, s.rezervasyonlar, dolu, temizlik]);

  const aralikAnaliz = useMemo(() => {
    if (!aralikBas || !aralikSon || aralikSon <= aralikBas) return null;
    const gs = aralik(aralikBas, aralikSon);
    const satir = gunIstatistikleri(s.tesis, gs, s.yataklar, s.rezervasyonlar, dolu, temizlik);
    const garanti = satir.reduce((a, x) => Math.min(a, x.bos), Infinity);
    const ort = Math.round(satir.reduce((a, x) => a + x.bos, 0) / satir.length);
    const enDar = satir.reduce((a, x) => (x.bos < a.bos ? x : a), satir[0]);
    const kesintisiz = tesisYatak.filter(y => yatakMusait(y.id, aralikBas, aralikSon, dolu, temizlik));
    return { gece: gs.length, garanti, ort, enDar, satir,
             kesintisiz: kesintisiz.length, tekKisilik: kesintisiz.filter(y => y.tip === 'TEK').length };
  }, [aralikBas, aralikSon, s.tesis, s.yataklar, s.rezervasyonlar, dolu, temizlik, tesisYatak]);

  const tesisOzet = useMemo(() => TESISLER.filter(t => tesisYetkisi(s.kullanici, t.kod)).map(t => {
    const x = gunIstatistikleri(t.kod, [s.bugun], s.yataklar, s.rezervasyonlar, dolu, temizlik)[0];
    return { ...t, ...x };
  }), [s.bugun, s.yataklar, s.rezervasyonlar, dolu, temizlik, s.kullanici]);

  const yatakListesi = useMemo(() => {
    const q = listeArama.trim().toLocaleLowerCase('tr-TR');
    return tesisYatak.map(y => {
      const { durum, kayit } = yatakDurumu(y, haritaTarihi, dolu, temizlik);
      return { y, durum, kayit, rez: kayit ? kayit.rez : null,
               misafir: kayit ? kayit.misafir : null, cikan: kayit ? kayit.cikanMisafir : null };
    }).filter(r => {
      if (listeFiltre === 'DOLU' && r.durum === 'BOS') return false;
      if (listeFiltre === 'BOS' && r.durum !== 'BOS') return false;
      if (q) {
        const havuz = [r.y.oda_no, r.y.yatak_no, r.misafir && r.misafir.adi_soyadi, r.misafir && r.misafir.tc_kimlik_no,
                       r.cikan && r.cikan.adi_soyadi, r.rez && r.rez.rez_no].filter(Boolean).join(' ').toLocaleLowerCase('tr-TR');
        if (!havuz.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => a.y.oda_no - b.y.oda_no || a.y.yatak_no - b.y.yatak_no);
  }, [tesisYatak, haritaTarihi, dolu, temizlik, listeFiltre, listeArama]);

  const sayfa = sayfaBul(bolum);
  const tarihGezgini = (
    <div className="flex items-center gap-1">
      <Buton tur="sessiz" onClick={() => setHaritaTarihi(ekle(haritaTarihi, -1))} aria-label="Önceki gün">◀</Buton>
      <TarihGirdi deger={haritaTarihi} onChange={setHaritaTarihi} bugun={s.bugun} />
      <Buton tur="sessiz" onClick={() => setHaritaTarihi(ekle(haritaTarihi, 1))} aria-label="Sonraki gün">▶</Buton>
      {haritaTarihi !== s.bugun && <Buton tur="sessiz" onClick={() => setHaritaTarihi(s.bugun)}>Bugün</Buton>}
    </div>
  );

  return (
    <div>
      <SayfaBasligi ikon={sayfa.ikon} baslik={sayfa.ad} aciklama={sayfa.aciklama} tesis={tesisAd}
        sag={bolum === 'YATAK_LISTESI' ? tarihGezgini : null} />

      {/* ── BUGÜNKÜ DURUM ─────────────────────────────────────────────── */}
      {bolum === 'OZET' && (
        <div className="space-y-3">
          {izin('sistem.tarih') && (
            <div className="flex items-center gap-2 flex-wrap bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-xs">
              <span className="px-1.5 py-0.5 rounded bg-amber-400 text-amber-950 font-bold text-2xs">DEMO ARACI</span>
              <span className="text-slate-600">Sistem tarihi</span>
              <span className="num font-bold text-ttk-800">{tr(s.bugun)}</span>
              <span className="text-slate-500">— ilerleterek peşinat süresi dolan taleplerin otomatik iptalini görebilirsiniz.</span>
              <span className="ml-auto flex items-center gap-1">
                <Buton tur="sessiz" onClick={() => gonder({ tip: 'GUN_ILERLET', adet: 1 })}>+1 gün</Buton>
                <Buton tur="sessiz" onClick={() => gonder({ tip: 'GUN_ILERLET', adet: 7 })}>+7 gün</Buton>
              </span>
            </div>
          )}
          <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(10rem, 100%), 1fr))' }}>
            <Kpi etiket="Dolu Yatak" deger={bugunIst.dolu} alt={`${bugunIst.kapasite} yatak kapasite`} />
            {/* Yüzde, kartın kendi sayısından hesaplanır: temizlikteki yatak «boş» sayılmaz
                (dolu + boş + temizlik = kapasite). */}
            <Kpi etiket="Boş Yatak" deger={bugunIst.bos} renk="text-emerald-700"
              alt={`kapasitenin %${bugunIst.kapasite ? Math.round(bugunIst.bos / bugunIst.kapasite * 100) : 0}'i`} />
            <Kpi etiket="Giriş Yapacak" deger={bugunIst.giris} alt={tr(s.bugun)} renk="text-sky-700" />
            <Kpi etiket="Çıkış Yapacak" deger={bugunIst.cikis} alt={tr(s.bugun)} renk="text-orange-600" />
            <Kpi etiket="Temizlikte" deger={bugunIst.temizlik} renk="text-violet-700"
              alt={`${TEMIZLIK_GUN} gün blok · dolu+boş+temizlik = ${bugunIst.kapasite}`} />
            <Kpi etiket="Doluluk" deger={'%' + bugunIst.oran} alt={ayAdi(s.bugun) + ' ' + s.bugun.slice(0, 4)} />
          </div>

          <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(22rem, 100%), 1fr))' }}>
            <Kart baslik="Misafirhane Karşılaştırması" sag={<span className="text-2xs text-slate-500">{tr(s.bugun)}</span>}>
              <table className="w-full text-xs num">
                <tbody>
                  {tesisOzet.map(t => (
                    <tr key={t.kod} className={t.kod === s.tesis ? 'font-bold text-ttk-800' : 'text-slate-600'}>
                      <td className="py-1.5 pr-2">
                        <button onClick={() => gonder({ tip: 'TESIS', tesis: t.kod })} className="hover:underline text-left">{t.ad}</button>
                      </td>
                      <td className="py-1.5 pr-2 text-right whitespace-nowrap">{t.dolu}/{t.kapasite}</td>
                      <td className="py-1.5 w-24"><Cubuk oran={t.oran} renk={t.oran > 90 ? 'bg-rose-500' : t.oran > 70 ? 'bg-amber-500' : 'bg-ttk-500'} /></td>
                      <td className="py-1.5 pl-2 text-right w-10">%{t.oran}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Kart>

            <Kart baslik="Bugünün İşleri">
              <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(9rem, 100%), 1fr))' }}>
                {[['ODALAR', 'oda', 'Oda Durumu', `${bugunIst.dolu} dolu yatak`],
                  ['YATAK_LISTESI', 'liste', 'Yatak Listesi', 'kim nerede kalıyor'],
                  ['TALEPLER', 'talep', 'Talepler', 'yerleştirme bekleyenler'],
                  ['TAHSILAT', 'para', 'Tahsilat', 'peşinat bekleyenler']].map(([kod, ikon, ad, alt]) => (
                  <button key={kod} onClick={() => git(kod)}
                    className="flex items-start gap-2 p-2.5 rounded border border-slate-200 hover:border-ttk-400 hover:bg-ttk-50 text-left transition-colors">
                    <span className="w-7 h-7 rounded bg-ttk-50 text-ttk-600 flex items-center justify-center shrink-0"><Ikon ad={ikon} /></span>
                    <span className="min-w-0">
                      <span className="block text-xs font-bold text-ttk-900">{ad}</span>
                      <span className="block text-2xs text-slate-500 truncate">{alt}</span>
                    </span>
                  </button>
                ))}
              </div>
            </Kart>
          </div>

          <Kart baslik="Son İşlemler" sag={<span className="text-2xs text-slate-500">en son 6 kayıt</span>}>
            <ul className="text-xs space-y-1">
              {s.gunluk.slice(0, 6).map((g, i) => (
                <li key={i} className={`flex gap-2 px-2 py-1.5 rounded border
                  ${g.tip === 'uyari' ? 'bg-amber-50 border-amber-200' : g.tip === 'basari' ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
                  <span className="num text-slate-500 w-20 shrink-0">{tr(g.tarih)}</span>
                  <span className="flex-1 truncate" title={g.metin}>{g.metin}</span>
                </li>
              ))}
            </ul>
          </Kart>
        </div>
      )}

      {/* ── DOLULUK TAKVİMİ ───────────────────────────────────────────── */}
      {bolum === 'TAKVIM' && (
        <div className="space-y-3">
          <Kart baslik="30 Günlük Doluluk"
            sag={<>
              <Buton tur="sessiz" onClick={() => setSeritBas(ekle(seritBas, -30))}>◀ Önceki 30 gün</Buton>
              <Buton tur="sessiz" onClick={() => setSeritBas(s.bugun)}>Bugün</Buton>
              <Buton tur="sessiz" onClick={() => setSeritBas(ekle(seritBas, 30))}>Sonraki 30 gün ▶</Buton>
            </>}
            govdeSinif="p-2">
            <div className="kaydir-x kaydir">
              <div className="flex gap-[2px]" style={{ minWidth: '60rem' }}>
                {ist.map(g => {
                  const secili = g.tarih >= aralikBas && g.tarih < aralikSon;
                  const bugunMu = g.tarih === s.bugun;
                  return (
                    <button key={g.tarih} onClick={() => { setAralikBas(g.tarih); setAralikSon(ekle(g.tarih, 1)); }}
                      title={`${tr(g.tarih)} — Dolu ${g.dolu}, Boş ${g.bos}, Giriş ${g.giris}, Çıkış ${g.cikis}`}
                      className={`flex-1 min-w-[2.4rem] rounded border px-1 pt-1 pb-1.5 text-center transition-colors
                        ${secili ? 'border-ttk-500 bg-ttk-50 ring-1 ring-ttk-300' : haftaSonu(g.tarih) ? 'border-slate-200 bg-slate-50' : 'border-slate-200 bg-white'}
                        hover:bg-ttk-50`}>
                      <div className={`text-2xs font-bold num ${bugunMu ? 'text-rose-600' : 'text-ttk-800'}`}>{g.tarih.slice(8)}.{g.tarih.slice(5, 7)}</div>
                      <div className="text-[0.62rem] text-slate-400 leading-3">{hg(g.tarih)}</div>
                      <div className="my-1 h-16 flex items-end justify-center bg-slate-100 rounded-sm overflow-hidden">
                        <div className={`w-full ${g.oran >= 95 ? 'bg-rose-500' : g.oran >= 80 ? 'bg-amber-500' : g.oran >= 50 ? 'bg-ttk-500' : 'bg-ttk-300'}`}
                             style={{ height: Math.max(3, g.oran) + '%' }} />
                      </div>
                      <div className="num text-2xs font-bold text-ttk-700 leading-4">{g.dolu}</div>
                      <div className="num text-[0.62rem] text-emerald-700 leading-3">{g.bos} boş</div>
                      <div className="num text-[0.62rem] leading-3">
                        <span className="text-sky-600">▲{g.giris}</span> <span className="text-orange-600">▼{g.cikis}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flex items-center gap-3 mt-2 px-1 text-2xs text-slate-500 flex-wrap">
              <span className="flex items-center gap-1"><i className="w-3 h-2 inline-block bg-ttk-500 rounded-sm" /> dolu yatak oranı</span>
              <span className="flex items-center gap-1"><i className="w-3 h-2 inline-block bg-amber-500 rounded-sm" /> %80+</span>
              <span className="flex items-center gap-1"><i className="w-3 h-2 inline-block bg-rose-500 rounded-sm" /> %95+</span>
              <span className="text-sky-600">▲ giriş</span><span className="text-orange-600">▼ çıkış</span>
              <span className="ml-auto">Bir güne tıklayınca aşağıdaki aralık o güne alınır.</span>
            </div>
          </Kart>

          <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(20rem, 100%), 1fr))' }}>
            <Kart baslik="Seçili Tarih Aralığı — Kalan Yatak">
              <div className="flex items-center gap-1.5 mb-3 flex-wrap">
                <TarihGirdi deger={aralikBas} onChange={setAralikBas} bugun={s.bugun} />
                <span className="text-slate-400 text-xs">→</span>
                <TarihGirdi deger={aralikSon} onChange={setAralikSon} bugun={s.bugun} enAz={ekle(aralikBas, 1)} />
              </div>
              {!aralikAnaliz ? <BosDurum metin="Geçerli bir tarih aralığı seçiniz" /> : (
                <div className="space-y-2">
                  <div className="bg-emerald-50 border border-emerald-200 rounded p-3">
                    <div className="text-2xs uppercase font-semibold text-emerald-800">Garanti Kalan Yatak</div>
                    <div className="num text-3xl font-bold text-emerald-700 leading-9">{aralikAnaliz.garanti}</div>
                    <div className="text-2xs text-emerald-900">
                      {aralikAnaliz.gece} gecenin tamamında en az bu kadar boş yatak var
                      <br />(en dar gece: {tr(aralikAnaliz.enDar.tarih)} — {aralikAnaliz.enDar.bos} boş)
                    </div>
                  </div>
                  <dl className="text-xs divide-y divide-slate-100">
                    {[['Kesintisiz aynı yatakta müsait', aralikAnaliz.kesintisiz + ' yatak'],
                      ['Bunlardan tek kişilik odada', aralikAnaliz.tekKisilik + ' yatak'],
                      ['Ortalama boş yatak / gece', aralikAnaliz.ort],
                      ['Gece sayısı', aralikAnaliz.gece]].map(([kk, v]) => (
                      <div key={kk} className="flex justify-between py-1.5"><dt className="text-slate-500">{kk}</dt><dd className="num font-semibold text-ttk-800">{v}</dd></div>
                    ))}
                  </dl>
                </div>
              )}
            </Kart>

            <Kart baslik="Gece Bazında Boş Yatak">
              {!aralikAnaliz ? <BosDurum metin="Tarih aralığı seçiniz" /> : (
                <div className="space-y-1 max-h-80 overflow-auto kaydir pr-1">
                  {aralikAnaliz.satir.map(g => (
                    <div key={g.tarih} className="flex items-center gap-2 text-xs num">
                      <span className="w-24 text-slate-500">{tr(g.tarih)} {hg(g.tarih)}</span>
                      <div className="flex-1"><Cubuk oran={g.kapasite ? g.bos / g.kapasite * 100 : 0} renk="bg-emerald-500" /></div>
                      <span className="w-8 text-right font-semibold text-emerald-700">{g.bos}</span>
                    </div>
                  ))}
                </div>
              )}
            </Kart>
          </div>
        </div>
      )}

      {/* ── YATAK LİSTESİ ─────────────────────────────────────────────── */}
      {yazdirmaAcik && (
        <YazdirmaPenceresi
          baslik="Yatak Listesi"
          altBaslik={`${tesisAd} · ${tr(haritaTarihi)} durumu` +
            (listeFiltre === 'DOLU' ? ' · yalnız dolu yataklar' : listeFiltre === 'BOS' ? ' · yalnız boş yataklar' : '') +
            (listeArama ? ` · arama: «${listeArama}»` : '')}
          sutunlar={['Oda', 'Yatak', 'Oda Tipi', 'Durum', 'Tc Kimlik No', 'Adı ve Soyadı', 'C.',
                     'Geliş / Çıkış', 'Gün', 'Kurum-Şahıs', 'Rez. No']}
          satirlar={yatakListesi.map(r => [
            r.y.oda_no, r.y.yatak_no,
            r.y.tip === 'TEK' ? 'Tek kişilik' : r.y.tip === 'CIFT' ? 'İki kişilik' : 'Üç kişilik',
            YATAK_DURUM[r.durum].ad,
            r.misafir ? r.misafir.tc_kimlik_no : r.cikan ? r.cikan.tc_kimlik_no : '—',
            r.misafir ? r.misafir.adi_soyadi : r.cikan ? 'çıkış: ' + r.cikan.adi_soyadi : '— boş —',
            r.misafir ? r.misafir.cinsiyet : r.cikan ? r.cikan.cinsiyet : '',
            r.rez ? `${tr(r.rez.gelis_tarihi)} – ${tr(r.rez.cikis_tarihi)}` : '',
            r.rez ? r.rez.gun_sayisi : '',
            r.rez ? (r.rez.kurum_sahis === 'KURUM' ? 'Kurum' : 'Şahıs') : '',
            r.rez ? r.rez.rez_no : '',
          ])}
          kapat={() => setYazdirmaAcik(false)} />
      )}

      {bolum === 'YATAK_LISTESI' && (
        <Kart govdeSinif="p-0"
          baslik={`${tr(haritaTarihi)} — ${yatakListesi.length} yatak`}
          sag={<>
            <select value={listeFiltre} onChange={e => setListeFiltre(e.target.value)}
              className="border border-slate-300 rounded px-2 py-1 text-xs bg-white">
              <option value="HEPSI">Tüm yataklar</option>
              <option value="DOLU">Yalnız dolu yataklar</option>
              <option value="BOS">Yalnız boş yataklar</option>
            </select>
            <input value={listeArama} onChange={e => setListeArama(e.target.value)}
              placeholder="Ad soyad / Tc kimlik / oda no…"
              className="border border-slate-300 rounded px-2 py-1 text-xs w-full sm:w-56 min-w-0" />
            <Buton onClick={() => setYazdirmaAcik(true)} disabled={!yatakListesi.length}
              data-ipucu="Listeyi A4 dikey ya da yatay olarak yazdırın (ekrandaki süzgeç geçerlidir)">
              🖨 Yazdır
            </Buton>
          </>}>
          <div className="kaydir-x kaydir max-h-[65vh] overflow-y-auto">
            <table className="veri w-full">
              <thead><tr>
                <th className="text-center">Oda</th><th className="text-center">Yatak</th><th>Oda Tipi</th><th>Durum</th>
                <th>Tc Kimlik No</th><th>Adı ve Soyadı</th><th className="text-center">C.</th>
                <th>Geliş / Çıkış</th><th className="text-center">Gün</th><th>Kurum-Şahıs</th>
                <th title="Ödeme Türü">Öd.</th><th className="text-right">Peşinattan Kalan</th><th>Rez. No</th>
              </tr></thead>
              <tbody>
                {yatakListesi.map(r => (
                  <tr key={r.y.id} className={`cursor-pointer ${r.durum === 'BOS' ? 'text-slate-400' : ''}`}
                    onClick={() => setDetay({ yatak: r.y, tarih: haritaTarihi, durum: r.durum, kayit: r.kayit })}>
                    <td className="num text-center font-bold text-ttk-900">{r.y.oda_no}</td>
                    <td className="num text-center font-bold">{r.y.yatak_no}</td>
                    <td className="text-slate-600">{r.y.tip === 'TEK' ? 'Tek kişilik' : r.y.tip === 'CIFT' ? 'İki kişilik' : 'Üç kişilik'}{r.y.protokol && ' · protokol'}</td>
                    <td><Rozet sinif={YATAK_DURUM[r.durum].kutu}>{YATAK_DURUM[r.durum].ad}</Rozet></td>
                    <td className="num">{r.misafir ? r.misafir.tc_kimlik_no : r.cikan ? r.cikan.tc_kimlik_no : '—'}</td>
                    <td className="font-semibold text-ttk-900">
                      {r.misafir ? r.misafir.adi_soyadi
                        : r.cikan ? <span className="font-normal text-violet-700">çıkış: {r.cikan.adi_soyadi}</span>
                        : <span className="text-slate-400 font-normal">— boş —</span>}
                    </td>
                    <td className="text-center">{r.misafir ? r.misafir.cinsiyet : r.cikan ? r.cikan.cinsiyet : ''}</td>
                    <td className="num">{r.rez ? `${tr(r.rez.gelis_tarihi)} – ${tr(r.rez.cikis_tarihi)}` : ''}</td>
                    <td className="num text-center">{r.rez ? r.rez.gun_sayisi : ''}</td>
                    <td>{r.rez ? (r.rez.kurum_sahis === 'KURUM' ? 'Kurum' : 'Şahıs') : ''}</td>
                    <td className="text-slate-600">{r.rez ? r.rez.odeme_turu : ''}</td>
                    <td className="num text-right">{r.rez && r.rez.pesinat_tutari ? para(Math.max(0, r.rez.pesinat_tutari - r.rez.tahsil_edilen)) : ''}</td>
                    <td className="num text-slate-500">{r.rez ? r.rez.rez_no.slice(4) : ''}</td>
                  </tr>
                ))}
                {!yatakListesi.length && <tr><td colSpan="13" className="text-center text-slate-400 py-6">Filtreye uyan yatak yok.</td></tr>}
              </tbody>
            </table>
          </div>
        </Kart>
      )}

      {detay && <YatakDetayModal detay={detay} kapat={() => setDetay(null)}
        acYeniKayit={acYeniKayit} izin={izin} tesis={s.tesis} />}
    </div>
  );
}

function RezervasyonOzet({ rz, misafir }) {
  const satir = (k, v) => <div className="flex justify-between gap-4 py-1 border-b border-slate-100"><span className="text-slate-500">{k}</span><span className="num font-semibold text-ttk-900 text-right">{v}</span></div>;
  return (
    <div className="text-xs grid grid-cols-2 gap-x-6">
      <div>
        {satir('Rez. No', rz.rez_no)}
        {satir('Rezerv Eden', rz.ad_soyad)}
        {satir('Tc Kimlik No', misafir ? misafir.tc_kimlik_no : rz.misafirler[0].tc_kimlik_no)}
        {satir('Adı Soyadı', misafir ? misafir.adi_soyadi : rz.misafirler[0].adi_soyadi)}
        {satir('Sicil No', (misafir || rz.misafirler[0]).sicil_no || '—')}
        {satir('Geliş Tarihi', tr(rz.gelis_tarihi))}
        {satir('Çıkış Tarihi', tr(rz.cikis_tarihi) + (rz.uzatma ? ` (uzatıldı, önceki ${tr(rz.onceki_cikis_tarihi)})` : ''))}
        {satir('Kaldığı Gün', rz.gun_sayisi)}
      </div>
      <div>
        {satir('Kurum-Şahıs', rz.kurum_sahis === 'KURUM' ? 'Kurum' : 'Şahıs')}
        {satir('Ödeyecek', rz.odeyecek)}
        {satir('Ödeme Türü', ODEME_TURU[rz.odeme_turu])}
        {satir('Geliş Nedeni', rz.gelis_nedeni)}
        {satir('Görev Sevk No', (misafir || rz.misafirler[0]).gorev_sevk_no || '—')}
        {satir('Harcırah Miktarı', (misafir || rz.misafirler[0]).harcirah_miktari ? para((misafir || rz.misafirler[0]).harcirah_miktari) : '—')}
        {satir('Peşinat / Kalan', rz.pesinat_tutari ? `${para(rz.tahsil_edilen)} / ${para(Math.max(0, rz.pesinat_tutari - rz.tahsil_edilen))}` : 'Peşinat aranmıyor')}
        {satir('Statü', statuAd(rz.statu))}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   7) EKRAN 2 — REZERVASYON VE OTOMATİK YERLEŞTİRME
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Dekont yükleme penceresi ─────────────────────────────────────────────── */
function DekontYukleme({ s, rz, gonder, kapat }) {
  const kural = s.kurallar[rz.tesis];
  const tesisAd = (TESISLER.find(t => t.kod === rz.tesis) || {}).ad || '';
  const [f, setF] = useState(() => ({
    banka: BANKALAR[0], dekont_no: '', odeme_tarihi: s.bugun, iban: '',
    tutar: rz.pesinat_tutari, dosya_adi: '', tur: '', icerik: null, boyut: 0, uretilmis: false,
  }));
  const [hata, setHata] = useState(null);
  const dosyaRef = useRef(null);

  const dosyaSec = (e) => {
    const dosya = e.target.files && e.target.files[0];
    if (!dosya) return;
    if (dosya.size > 5 * 1024 * 1024) { setHata('Dosya 5 MB üzerinde. Daha küçük bir tarama yükleyiniz.'); return; }
    const okur = new FileReader();
    okur.onload = () => setF(x => ({ ...x, dosya_adi: dosya.name, tur: dosya.type || 'application/pdf',
                                     icerik: okur.result, boyut: dosya.size, uretilmis: false }));
    okur.onerror = () => setHata('Dosya okunamadı.');
    okur.readAsDataURL(dosya);
    setHata(null);
  };

  const ornekUret = () => setF(x => ({
    ...x, dosya_adi: `kapora-dekont-${rz.rez_no}.pdf`, tur: 'application/pdf',
    icerik: null, uretilmis: true, boyut: 2600,
    dekont_no: x.dekont_no || String(Math.floor(Math.random() * 9e8) + 1e8),
  }));

  const eksik = Number(f.tutar) < rz.pesinat_tutari;
  const gecerli = f.dosya_adi && f.dekont_no.trim() && Number(f.tutar) > 0;

  const kaydet = () => {
    if (!gecerli) return;
    gonder({ tip: 'DEKONT_YUKLE', rezId: rz.id, dekont: {
      banka: f.banka, dekont_no: f.dekont_no.trim(), odeme_tarihi: f.odeme_tarihi,
      iban: f.iban ? 'TR' + f.iban : '',
      tutar: Number(f.tutar), dosya_adi: f.dosya_adi, tur: f.tur,
      icerik: f.icerik, uretilmis: f.uretilmis, boyut: f.boyut,
    } });
    kapat();
  };

  return (
    <Modal baslik={`Kapora Dekontu Yükle — ${rz.rez_no} · ${rz.ad_soyad}`} genislik="max-w-3xl" kapat={kapat}
      altlik={<>
        <span className="text-2xs text-slate-500 mr-auto">
          {gecerli ? 'Kaydedildiğinde kayıt müdür onayına düşer.' : 'Dosya ve dekont numarası zorunludur.'}
        </span>
        <Buton tur="sessiz" onClick={kapat}>Vazgeç</Buton>
        <Buton tur="basari" onClick={kaydet} disabled={!gecerli}>Dekontu Kaydet ve Onaya Gönder</Buton>
      </>}>
      <div className="space-y-3 text-xs">
        <div className="bg-ttk-50 border border-ttk-200 rounded p-2.5">
          <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(10rem, 100%), 1fr))' }}>
            {[['Konaklama', `${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)} · ${rz.gun_sayisi} gece`],
              ['Toplam Yatak Bedeli', para(rz.yatak_bedeli)],
              ['İstenen Kapora', para(rz.pesinat_tutari) + (rz.kapora_gece ? ` (${rz.kapora_gece} gecelik)` : '')],
              ['Son Ödeme Tarihi', rz.pesinat_son_odeme_tarihi ? tr(rz.pesinat_son_odeme_tarihi) : '—']].map(([k, v]) => (
              <div key={k}>
                <div className="text-2xs uppercase text-slate-500 font-semibold">{k}</div>
                <div className="num font-semibold text-ttk-900">{v}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(16rem, 100%), 1fr))' }}>
          <fieldset className="border border-slate-200 rounded p-2.5 space-y-2">
            <legend className="text-2xs font-bold text-ttk-800 uppercase px-1">Ödeme Bilgileri</legend>
            <Alan etiket="Banka" zorunlu>
              <select value={f.banka} onChange={e => setF({ ...f, banka: e.target.value })} className={GIRDI}>
                {BANKALAR.map(b => <option key={b}>{b}</option>)}
              </select>
            </Alan>
            <Alan etiket="Dekont / Referans No" zorunlu>
              <input value={f.dekont_no} onChange={e => setF({ ...f, dekont_no: e.target.value })} className={`${GIRDI} num`} />
            </Alan>
            <Alan etiket="Gönderen IBAN" ipucu="İsteğe bağlı — dekonttaki hesap numarası">
              <SayiliGirdi tur="IBAN" deger={f.iban} onChange={v => setF({ ...f, iban: v })} className="w-full" />
            </Alan>
            <div className="grid grid-cols-2 gap-2">
              <Alan etiket="Ödeme Tarihi" zorunlu>
                <TarihGirdi deger={f.odeme_tarihi} onChange={v => setF({ ...f, odeme_tarihi: v })} className="!w-full"
                  bugun={s.bugun} enCok={s.bugun} />
              </Alan>
              <Alan etiket="Yatırılan Tutar (₺)" zorunlu>
                <input type="number" value={f.tutar} onChange={e => setF({ ...f, tutar: e.target.value })}
                  className={`${GIRDI} num text-right ${eksik ? 'border-rose-400 bg-rose-50' : ''}`} />
              </Alan>
            </div>
            {eksik && <div className="px-2 py-1 rounded border bg-amber-50 border-amber-300 text-amber-900 text-2xs">
              ⚠ Yatırılan tutar istenen kaporanın altında ({para(rz.pesinat_tutari)}). Müdür yine de değerlendirebilir.
            </div>}
          </fieldset>

          <fieldset className="border border-slate-200 rounded p-2.5 space-y-2">
            <legend className="text-2xs font-bold text-ttk-800 uppercase px-1">Dekont Dosyası</legend>
            <input ref={dosyaRef} type="file" accept="application/pdf,image/png,image/jpeg" onChange={dosyaSec}
              className="block w-full text-xs file:mr-2 file:px-2.5 file:py-1.5 file:rounded file:border-0
                         file:bg-ttk-600 file:text-white file:font-semibold hover:file:bg-ttk-700" />
            <div className="text-2xs text-slate-500">PDF, PNG veya JPEG · en çok 5 MB</div>
            <div className="flex items-center gap-2">
              <span className="text-2xs text-slate-400">veya</span>
              <Buton tur="sessiz" onClick={ornekUret}>Örnek dekont üret (demo)</Buton>
            </div>
            {f.dosya_adi && (
              <div className="flex items-center gap-2 px-2 py-1.5 rounded border bg-emerald-50 border-emerald-300">
                <Ikon ad="talep" sinif="w-4 h-4 text-emerald-700" />
                <span className="flex-1 truncate font-semibold text-emerald-900">{f.dosya_adi}</span>
                <span className="num text-2xs text-emerald-800">{(f.boyut / 1024).toFixed(0)} KB</span>
              </div>
            )}
            {hata && <div className="px-2 py-1 rounded border bg-rose-50 border-rose-300 text-rose-800 text-2xs">⛔ {hata}</div>}
          </fieldset>
        </div>
        <div className="text-2xs text-slate-500">
          Dekont, misafirhane müdürünün «Dekont ve Onay» sayfasına düşer. Müdür onaylamadan
          kayda yatak tahsis edilemez ve misafir rezervasyon listesine alınmaz.
        </div>
      </div>
    </Modal>
  );
}

/* ── Dekont görüntüleyici ─────────────────────────────────────────────────── */
function DekontGoruntule({ rz, tesisAd, yukseklik = 'h-[28rem]' }) {
  const kaynak = useMemo(() => dekontKaynagi(rz, tesisAd), [rz.id, rz.dekont && rz.dekont.dekont_no]);
  const d = rz.dekont;
  if (!d) return <BosDurum metin="Bu kayda ait dekont yüklenmemiş." />;
  const resimMi = (d.tur || '').startsWith('image/');
  return (
    <div className="space-y-2">
      <div className="flex items-center gap-2 flex-wrap text-xs">
        <Ikon ad="talep" sinif="w-4 h-4 text-ttk-600" />
        <span className="font-semibold text-ttk-900 truncate">{d.dosya_adi}</span>
        <span className="num text-2xs text-slate-500">{(d.boyut / 1024).toFixed(0)} KB</span>
        {d.uretilmis && <Rozet sinif="bg-slate-100 text-slate-600 border-slate-300" baslik="Demo için üretilmiş örnek dekont">demo</Rozet>}
        <a href={kaynak} target="_blank" rel="noopener" className="ml-auto text-ttk-700 hover:underline font-semibold">
          Yeni sekmede aç ↗
        </a>
      </div>
      <div className={`border border-slate-300 rounded overflow-hidden bg-slate-100 ${yukseklik}`}>
        {resimMi
          ? <img src={kaynak} alt="Dekont" className="w-full h-full object-contain" />
          : <iframe src={kaynak} title="Kapora dekontu" className="w-full h-full" />}
      </div>
    </div>
  );
}

  const [tur, setTur] = useState('HEPSI');

    <Modal baslik="Misafir Bilgilendirme SMS'leri" genislik="max-w-3xl" kapat={kapat}
      altlik={<Buton tur="sessiz" onClick={kapat}>Kapat</Buton>}>
      <div className="space-y-2 text-xs">
        <div className="bg-amber-50 border border-amber-200 rounded p-2 text-2xs text-amber-900">
          Prototipte gerçek SMS gönderilmez; gönderim kaydı burada tutulur. Kurulumda kurumun
          SMS sağlayıcısı bağlanır — kayıt açıldığında, rezervasyon onaylandığında ve iptalde
          misafire otomatik mesaj gider.
        </div>
        <div className="flex items-center gap-2 flex-wrap">

            <Rozet sinif="bg-rose-100 text-rose-800 border-rose-300">
              {gonderilemeyen} bildirim gönderilemedi (telefon yok)
            </Rozet>
          )}
        </div>
        <div className="max-h-[52vh] overflow-auto kaydir space-y-1.5">
          {!liste.length && <BosDurum metin="Bu türde gönderim kaydı yok." />}
          {liste.map(x => (
            <div key={x.id} className={`border rounded px-2.5 py-2 ${x.durum === 'GONDERILDI' ? 'bg-white border-slate-200' : 'bg-rose-50 border-rose-200'}`}>
              <div className="flex items-center gap-2 flex-wrap text-2xs mb-1">
                <Rozet sinif={x.durum === 'GONDERILDI' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-rose-100 text-rose-800 border-rose-300'}>
                  {x.durum === 'GONDERILDI' ? '✓ gönderildi' : '⛔ gönderilemedi'}
                </Rozet>
                <b className="text-ttk-800">{SMS_TURU[x.tur] || x.tur}</b>
                <span className="num text-slate-500">{x.rez_no}</span>
                <span className="text-slate-600">{x.alici}</span>
                <span className="num ml-auto text-slate-500">{x.telefon ? '0' + x.telefon : x.not} · {tr(x.tarih)}</span>
              </div>
              <div className="num text-2xs bg-slate-50 border border-slate-200 rounded px-2 py-1.5 leading-relaxed">
                <span className="text-slate-400">{SMS_GONDEREN} →</span> {x.metin}
                <span className="block text-slate-400 mt-0.5">{x.metin.length} karakter · {Math.ceil(x.metin.length / 160)} SMS</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </Modal>
  );
}

];

          ★ Muafiyeti Ver
        </Buton>
      </>}>
      <div className="space-y-3 text-xs">
        <div className="bg-amber-50 border border-amber-200 rounded p-2.5 text-amber-900">
          <b>{para(rz.pesinat_tutari)}</b> kapora bekleniyor
          {rz.pesinat_son_odeme_tarihi && <> · son ödeme <b className="num">{tr(rz.pesinat_son_odeme_tarihi)}</b></>}.

          yerleştirme kilidi açılır.

        <Alan etiket="Muafiyet gerekçesi" zorunlu ipucu="Denetimde sorulacak olan budur; kısa ve açık yazın.">

            placeholder="Örn. Protokol misafiri — Genel Müdürlük makamı" autoFocus />
        </Alan>
        <div className="flex flex-wrap gap-1.5">
          {MUAFIYET_GEREKCELERI.map(x => (
