/* ══════════════════════════════════════════════════════════════════════════
   8) EKRAN 3 — PEŞİNAT VE REZERVASYON STATÜSÜ
   ══════════════════════════════════════════════════════════════════════════ */

function PesinatEkrani({ s, gonder, acYeniKayit, izin, bolum }) {
  const [filtreBas, setFiltreBas] = useState(ekle(s.bugun, -15));
  const [filtreSon, setFiltreSon] = useState(ekle(s.bugun, 45));
  const [liste, setListe] = useState('HEPSI');
  const [statuFiltre, setStatuFiltre] = useState('HEPSI');
  const [arama, setArama] = useState('');
  const [kuralAcik, setKuralAcik] = useState(false);
  const [tahsilat, setTahsilat] = useState(null);
  const [detay, setDetay] = useState(null);
  const kural = s.kurallar[s.tesis];

  useEffect(() => { setFiltreBas(ekle(s.bugun, -15)); setFiltreSon(ekle(s.bugun, 45)); }, [s.bugun]);

  const suresiDoldu = rz => rz.statu === 'PESINAT_BEKLENIYOR' && rz.pesinat_son_odeme_tarihi &&
    rz.pesinat_son_odeme_tarihi < s.bugun && rz.tahsil_edilen < rz.pesinat_tutari;
  const kalanTutar = rz => Math.max(0, (rz.pesinat_tutari || 0) - (rz.tahsil_edilen || 0));
  const acikMi = rz => ['TALEP', 'PESINAT_BEKLENIYOR', 'ONAYLI', 'KONAKLIYOR'].includes(rz.statu);

  /* Zaman filtresi: konaklama aralığı seçili dönemle kesişen kayıtlar */
  const kapsam = useMemo(() => s.rezervasyonlar.filter(rz =>
    rz.tesis === s.tesis && rz.gelis_tarihi <= filtreSon && rz.cikis_tarihi >= filtreBas),
    [s.rezervasyonlar, s.tesis, filtreBas, filtreSon]);

  const isListeleri = useMemo(() => ({
    TAHSILAT:     kapsam.filter(rz => acikMi(rz) && kalanTutar(rz) > 0),
    SURESI_DOLAN: kapsam.filter(suresiDoldu),
    BUGUN_GIRIS:  kapsam.filter(rz => rz.gelis_tarihi === s.bugun && ['ONAYLI', 'KONAKLIYOR'].includes(rz.statu)),
    BUGUN_CIKIS:  kapsam.filter(rz => rz.cikis_tarihi === s.bugun && ['KONAKLIYOR', 'CIKIS'].includes(rz.statu)),
  }), [kapsam, s.bugun]);

  const kayitlar = useMemo(() => {
    let liste0 = liste === 'HEPSI' ? kapsam : isListeleri[liste] || kapsam;
    return liste0.filter(rz => {
      if (statuFiltre !== 'HEPSI' && rz.statu !== statuFiltre) return false;
      if (arama) {
        const q = arama.toLocaleLowerCase('tr-TR');
        const havuz = (rz.ad_soyad + ' ' + rz.rez_no + ' ' + (rz.makbuz_no || '') + ' ' +
          rz.misafirler.map(g => g.adi_soyadi + ' ' + g.tc_kimlik_no).join(' ')).toLocaleLowerCase('tr-TR');
        if (!havuz.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => {
      if (acikMi(a) !== acikMi(b)) return acikMi(a) ? -1 : 1;
      const at = kalanTutar(a) > 0, bt = kalanTutar(b) > 0;
      if (liste === 'HEPSI' && at !== bt) return at ? -1 : 1;     // tahsilat bekleyen üstte
      if (acikMi(a)) return a.gelis_tarihi < b.gelis_tarihi ? -1 : 1;
      return a.gelis_tarihi > b.gelis_tarihi ? -1 : 1;
    });
  }, [kapsam, isListeleri, liste, statuFiltre, arama]);

  const sayim = useMemo(() => {
    const m = {}; STATULER.forEach(x => m[x.kod] = 0);
    kapsam.forEach(rz => m[rz.statu]++);
    return m;
  }, [kapsam]);

  const toplam = useMemo(() => kayitlar.reduce((a, rz) => ({
    bedel: a.bedel + (rz.yatak_bedeli || 0),
    pesinat: a.pesinat + (rz.pesinat_tutari || 0),
    tahsil: a.tahsil + (rz.tahsil_edilen || 0),
    kalan: a.kalan + kalanTutar(rz),
  }), { bedel: 0, pesinat: 0, tahsil: 0, kalan: 0 }), [kayitlar]);

  const bekleyenToplam = isListeleri.TAHSILAT.reduce((a, rz) => a + kalanTutar(rz), 0);
  const kuralGuncelle = (alan, deger) => gonder({ tip: 'KURAL', tesis: s.tesis, alan, deger });

  const HIZLI_ARALIK = [
    ['Bugün',            () => [s.bugun, s.bugun]],
    ['Bu hafta',         () => [s.bugun, ekle(s.bugun, 7)]],
    ['Bu ay',            () => [s.bugun.slice(0, 8) + '01', ekle(s.bugun.slice(0, 8) + '01', 31)]],
    ['Gelecek 30 gün',   () => [s.bugun, ekle(s.bugun, 30)]],
    ['Son 30 gün',       () => [ekle(s.bugun, -30), s.bugun]],
    ['Tüm dönem',        () => ['2000-01-01', '2099-12-31']],
  ];
  const aralikAktif = (fn) => { const [a, b] = fn(); return a === filtreBas && b === filtreSon; };

  const IS_LISTELERI = [
    { kod:'HEPSI',        ad:'Tüm kayıtlar',        sayi: kapsam.length,                  renk:'bg-white border-slate-300 text-slate-700' },
    { kod:'TAHSILAT',     ad:'Tahsilat bekleyen',   sayi: isListeleri.TAHSILAT.length,    renk:'bg-emerald-50 border-emerald-300 text-emerald-800' },
    { kod:'SURESI_DOLAN', ad:'Süresi dolan',        sayi: isListeleri.SURESI_DOLAN.length,renk:'bg-rose-50 border-rose-300 text-rose-800' },
    { kod:'BUGUN_GIRIS',  ad:'Bugün giriş',         sayi: isListeleri.BUGUN_GIRIS.length, renk:'bg-sky-50 border-sky-300 text-sky-800' },
    { kod:'BUGUN_CIKIS',  ad:'Bugün çıkış',         sayi: isListeleri.BUGUN_CIKIS.length, renk:'bg-orange-50 border-orange-300 text-orange-800' },
  ];

  const sayfa = sayfaBul(bolum);
  const tahsilatSayfasi = bolum === 'TAHSILAT';

  return (
    <div className="space-y-3">
      <SayfaBasligi ikon={sayfa.ikon} baslik={sayfa.ad} aciklama={sayfa.aciklama}
        sag={izin('rezervasyon.olustur') &&
          <Buton tur="basari" onClick={() => acYeniKayit({ tesis: s.tesis })}>
            <span className="flex items-center gap-1"><Ikon ad="yeni" sinif="w-3.5 h-3.5" /> Yeni Kayıt</span>
          </Buton>} />

      {/* ── Zaman filtresi ve iş listeleri */}
      <div className="bg-white border border-slate-200 rounded px-3 py-2.5 space-y-2">
        <div className="flex items-center gap-3 flex-wrap">
          <span className="text-2xs uppercase font-semibold text-slate-500">Dönem</span>
          <TarihGirdi deger={filtreBas} onChange={setFiltreBas} />
          <span className="text-slate-400 text-xs">–</span>
          <TarihGirdi deger={filtreSon} onChange={setFiltreSon} />
          <div className="flex items-center gap-1">
            {HIZLI_ARALIK.map(([ad, fn]) => (
              <button key={ad} onClick={() => { const [a, b] = fn(); setFiltreBas(a); setFiltreSon(b); }}
                className={`px-2 py-0.5 rounded border text-2xs font-semibold transition-colors
                  ${aralikAktif(fn) ? 'bg-ttk-600 text-white border-ttk-700' : 'bg-white text-ttk-700 border-slate-300 hover:bg-slate-50'}`}>
                {ad}
              </button>
            ))}
          </div>
          <span className="text-2xs text-slate-500">konaklaması bu dönemle kesişen kayıtlar</span>
          <div className="ml-auto flex items-center gap-2">
            <input value={arama} onChange={e => setArama(e.target.value)} placeholder="Ad soyad / Tc kimlik / Rez. no / Makbuz no…"
              className="border border-slate-300 rounded px-2 py-1 text-xs w-60" />
            <select value={statuFiltre} onChange={e => setStatuFiltre(e.target.value)} className="border border-slate-300 rounded px-1.5 py-1 text-xs bg-white">
              <option value="HEPSI">Tüm statüler</option>
              {STATULER.map(x => <option key={x.kod} value={x.kod}>{x.ad}</option>)}
            </select>
          </div>
        </div>
        {tahsilatSayfasi && <div className="flex items-center gap-2 flex-wrap">
          <span className="text-2xs uppercase font-semibold text-slate-500">İş listesi</span>
          {IS_LISTELERI.map(x => (
            <button key={x.kod} onClick={() => { setListe(x.kod); setStatuFiltre('HEPSI'); }}
              className={`px-2.5 py-1 rounded border text-xs font-semibold transition-all ${x.renk}
                ${liste === x.kod ? 'ring-2 ring-ttk-500 shadow-sm' : 'hover:brightness-95'}`}>
              {x.ad} <span className="num ml-1 font-bold">{x.sayi}</span>
            </button>
          ))}
          {liste === 'TAHSILAT' && bekleyenToplam > 0 &&
            <span className="text-xs text-emerald-800 num font-semibold">Toplam tahsil edilecek: {para(bekleyenToplam)}</span>}
          <button onClick={() => setKuralAcik(x => !x)}
            className="ml-auto px-2.5 py-1 rounded border border-slate-300 bg-white text-xs font-semibold text-ttk-700 hover:bg-slate-50">
            ⚙ Peşinat Kuralı {kuralAcik ? '▲' : '▼'}
          </button>
        </div>}
      </div>

      {/* ── Peşinat kuralı (katlanabilir) */}
      {kuralAcik && tahsilatSayfasi && (
        <Kart baslik={`Peşinat Kuralı — ${TESISLER.find(t => t.kod === s.tesis).ad}`} className="bel"
          sag={<span className="text-2xs text-slate-500">
            {izin('pesinat.kural') ? 'değişiklik bu tesisin açık kayıtlarında peşinatı yeniden hesaplar'
                                   : '🔒 salt okunur — kural değiştirme yetkiniz yok'}</span>}>
          <div className="grid grid-cols-5 gap-4 text-xs">
            <label className={`col-span-1 flex items-start gap-2 p-2 bg-emerald-50 border border-emerald-200 rounded
              ${izin('pesinat.kural') ? 'cursor-pointer' : 'opacity-60'}`}>
              <input type="checkbox" className="mt-0.5" checked={kural.kurumMisafirindePesinatAranmasin}
                disabled={!izin('pesinat.kural')} title={izin('pesinat.kural') ? '' : yetkiNotu(s.kullanici, 'pesinat.kural')}
                onChange={e => kuralGuncelle('kurumMisafirindePesinatAranmasin', e.target.checked)} />
              <span>
                <b>Kurum misafirinde peşinat aranmasın</b>
                <span className="block text-2xs text-slate-600">Kurum kayıtlarında peşinat 0 kabul edilir, talep doğrudan Onaylı olur.</span>
              </span>
            </label>
            {[['sahisOran', 'Şahsi misafir peşinat oranı (%)', 0, 100, 5],
              ['sahisAsgariTutar', 'Asgari peşinat tutarı (₺)', 0, 10000, 250],
              ['odemeSuresiGun', 'Ödeme süresi (talepten itibaren gün)', 1, 30, 1],
              ['gelistenOnceEnGecGun', 'Gelişten en geç kaç gün önce', 0, 15, 1]].map(([alan, etiket, min, max, adim]) => (
              <div key={alan}>
                <div className="flex justify-between mb-0.5">
                  <span className="text-slate-600">{etiket}</span>
                  <span className="num font-bold text-ttk-800">{kural[alan]}</span>
                </div>
                <input type="range" min={min} max={max} step={adim} value={kural[alan]} disabled={!izin('pesinat.kural')}
                  title={izin('pesinat.kural') ? '' : yetkiNotu(s.kullanici, 'pesinat.kural')}
                  onChange={e => kuralGuncelle(alan, Number(e.target.value))}
                  className={`w-full accent-ttk-600 ${izin('pesinat.kural') ? '' : 'opacity-50 cursor-not-allowed'}`} />
              </div>
            ))}
          </div>
          <div className="text-2xs text-slate-500 mt-2">
            Son ödeme tarihi = <b>min</b>(rezerv tarihi + {kural.odemeSuresiGun} gün, geliş tarihi − {kural.gelistenOnceEnGecGun} gün).
          </div>
        </Kart>
      )}

      {/* ── Statü akışı (seçili döneme göre) */}
      {!tahsilatSayfasi && <Kart baslik={`Rezervasyon Statü Akışı — ${tr(filtreBas)} / ${tr(filtreSon)}`} govdeSinif="p-3"
        sag={<span className="text-2xs text-slate-500">kutulara tıklayarak listeyi filtreleyin</span>}>
        <div className="grid gap-1.5" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(10rem, 1fr))' }}>
          {STATULER.map((x, i) => (
            <Fragment key={x.kod}>
              <button onClick={() => { setStatuFiltre(statuFiltre === x.kod ? 'HEPSI' : x.kod); setListe('HEPSI'); }}
                className={`flex-1 rounded border px-2 py-2 text-left transition-all ${x.renk}
                  ${statuFiltre === x.kod ? 'ring-2 ring-ttk-500 shadow' : 'opacity-90 hover:opacity-100'}`}>
                <div className="text-2xs font-bold uppercase tracking-wide">{x.ad}</div>
                <div className="num text-2xl font-bold leading-7">{sayim[x.kod]}</div>
                <div className="text-2xs opacity-80">
                  {x.kod === 'TALEP' && 'yer/peşinat kararı bekliyor'}
                  {x.kod === 'PESINAT_BEKLENIYOR' && 'son ödeme tarihi işliyor'}
                  {x.kod === 'ONAYLI' && 'yatak tahsisli, giriş bekliyor'}
                  {x.kod === 'KONAKLIYOR' && 'giriş yapıldı'}
                  {x.kod === 'CIKIS' && 'kayıt kapandı'}
                  {x.kod === 'IPTAL' && 'yatak serbest'}
                </div>
              </button>
              {i < STATULER.length - 1 && <div className="hidden xl:flex items-center text-slate-300 text-lg">›</div>}
            </Fragment>
          ))}
        </div>
      </Kart>}

      {/* ── Para özeti */}
      {tahsilatSayfasi && <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(13rem, 1fr))' }}>
        <Kpi etiket="Toplam Yatak Bedeli" deger={para(toplam.bedel)} alt={`${kayitlar.length} kayıt (listede)`} />
        <Kpi etiket="Peşinat Tutarı" deger={para(toplam.pesinat)} />
        <Kpi etiket="Tahsil Edilen" deger={para(toplam.tahsil)} renk="text-emerald-700" />
        <Kpi etiket="Peşinattan Kalan" deger={para(toplam.kalan)} renk="text-rose-700" />
        <div className="bg-emerald-50 border border-emerald-300 rounded px-3 py-2 flex items-center gap-3 min-w-0">
          <div>
            <div className="text-2xs uppercase tracking-wide font-semibold text-emerald-800">Tahsilat Bekleyen</div>
            <div className="num text-2xl font-bold leading-7 text-emerald-700">{isListeleri.TAHSILAT.length}</div>
            <div className="text-2xs text-emerald-900 num">{para(bekleyenToplam)} tahsil edilecek</div>
          </div>
          <Buton tur="basari" className="ml-auto" onClick={() => { setListe('TAHSILAT'); setStatuFiltre('HEPSI'); }}>
            Tahsilat Listesi
          </Buton>
        </div>
        <div className={`border rounded px-3 py-2 flex items-center gap-3 min-w-0
          ${isListeleri.SURESI_DOLAN.length ? 'bg-rose-50 border-rose-300' : 'bg-white border-slate-200'}`}>
          <div>
            <div className="text-2xs uppercase tracking-wide font-semibold text-slate-500">Süresi Dolan Talep</div>
            <div className={`num text-2xl font-bold leading-7 ${isListeleri.SURESI_DOLAN.length ? 'text-rose-700' : 'text-slate-400'}`}>
              {isListeleri.SURESI_DOLAN.length}
            </div>
            <div className="text-2xs text-slate-600">son ödeme tarihi {tr(s.bugun)} itibarıyla geçmiş</div>
          </div>
          <div className="ml-auto flex flex-col gap-1">
            <Buton tur="tehlike" disabled={!isListeleri.SURESI_DOLAN.length || !izin('pesinat.toplu_iptal')}
              title={izin('pesinat.toplu_iptal') ? 'Süresi dolan talepleri iptal et, yatakları serbest bırak' : yetkiNotu(s.kullanici, 'pesinat.toplu_iptal')}
              onClick={() => gonder({ tip: 'SURE_KONTROL' })}>
              Toplu İptal
            </Buton>
            <Buton tur="sessiz" onClick={() => { setListe('SURESI_DOLAN'); setStatuFiltre('HEPSI'); }}>Listede süz</Buton>
          </div>
        </div>
      </div>}

      {/* ── Kayıt tablosu (işlem sütunu solda) */}
      <Kart govdeSinif="p-0"
        baslik={`${tahsilatSayfasi ? 'Tahsilat Takibi' : 'Kayıt Listesi'} — ${IS_LISTELERI.find(x => x.kod === liste).ad}` +
                (statuFiltre !== 'HEPSI' ? ` · ${statuAd(statuFiltre)}` : '')}
        sag={<>
          <span className="num text-2xs text-slate-500">{kayitlar.length} kayıt</span>
          {(liste !== 'HEPSI' || statuFiltre !== 'HEPSI' || arama) &&
            <Buton tur="sessiz" onClick={() => { setListe('HEPSI'); setStatuFiltre('HEPSI'); setArama(''); }}>Filtreleri temizle</Buton>}
        </>}>
        <div className="max-h-[60vh] overflow-auto kaydir kaydir-x">
          <table className="veri w-full">
            <thead><tr>
              <th>İşlem</th>
              <th>Rez. No</th><th>Adı Soyadı</th><th>Geliş / Çıkış</th><th>Kurum-Şahıs</th><th title="Ödeme Türü">Öd. Türü</th>
              <th className="text-right" title="Yatak Bedeli">Bedel</th><th className="text-right">Peşinat</th>
              <th title="Peşinat son ödeme tarihi">Son Ödeme</th>
              <th className="text-right" title="Tahsil Edilen">Tahsil</th><th className="text-right" title="Peşinattan Kalan">Kalan</th>
              <th title="Makbuz No">Makbuz</th><th>Statü</th>
            </tr></thead>
            <tbody>
              {kayitlar.map(rz => {
                const kalan = kalanTutar(rz);
                const gecti = suresiDoldu(rz);
                return (
                  <tr key={rz.id} onDoubleClick={() => setDetay(rz)}
                    className={gecti ? 'bg-rose-50/70' : kalan > 0 && acikMi(rz) ? 'bg-amber-50/60' : ''}>
                    <td>
                      <div className="flex gap-1">
                        {kalan > 0 && acikMi(rz)
                          ? <Buton tur="basari" className="!py-0.5" disabled={!izin('pesinat.tahsilat')}
                              title={izin('pesinat.tahsilat') ? 'Peşinat tahsilatı gir' : yetkiNotu(s.kullanici, 'pesinat.tahsilat')}
                              onClick={() => setTahsilat({ rz, tutar: kalan, makbuz_no: rz.makbuz_no || '' })}>
                              ₺ Tahsilat Al
                            </Buton>
                          : <span className="text-2xs text-slate-400 px-1.5 py-0.5">
                              {rz.pesinat_tutari ? 'tahsil edildi' : 'peşinat yok'}
                            </span>}
                        {acikMi(rz) && izin('rezervasyon.iptal') &&
                          <Buton tur="tehlike" className="!py-0.5" onClick={() => gonder({ tip: 'STATU', rezId: rz.id, statu: 'IPTAL' })}>İptal</Buton>}
                        <Buton tur="sessiz" className="!py-0.5" title="Kayıt detayı ve hareketler" onClick={() => setDetay(rz)}>Detay</Buton>
                      </div>
                    </td>
                    <td className="num" title={rz.rez_no}>{rz.rez_no.slice(4)}</td>
                    <td className="font-semibold text-ttk-900 max-w-[150px] truncate" title={rz.ad_soyad}>
                      {rz.protokol && <span className="text-violet-600 mr-1">★</span>}{rz.ad_soyad}
                    </td>
                    <td className="num" title={`${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)}`}>
                      {tr(rz.gelis_tarihi).slice(0, 6)} – {tr(rz.cikis_tarihi)}
                    </td>
                    <td>{rz.kurum_sahis === 'KURUM' ? <Rozet sinif="bg-ttk-50 text-ttk-700 border-ttk-200">Kurum</Rozet>
                                                   : <Rozet sinif="bg-slate-100 text-slate-700 border-slate-300">Şahıs</Rozet>}</td>
                    <td className="text-slate-600" title={ODEME_TURU[rz.odeme_turu]}>{rz.odeme_turu}</td>
                    <td className="num text-right">{para(rz.yatak_bedeli)}</td>
                    <td className="num text-right font-semibold">{rz.pesinat_tutari ? para(rz.pesinat_tutari) : <span className="text-slate-400">aranmıyor</span>}</td>
                    <td className={`num ${gecti ? 'text-rose-700 font-bold' : 'text-slate-600'}`}>
                      {rz.pesinat_son_odeme_tarihi ? tr(rz.pesinat_son_odeme_tarihi) : '—'}{gecti && ' ⚠'}
                    </td>
                    <td className="num text-right text-emerald-700">{rz.tahsil_edilen ? para(rz.tahsil_edilen) : '—'}</td>
                    <td className={`num text-right ${kalan ? 'text-rose-700 font-semibold' : 'text-slate-400'}`}>{kalan ? para(kalan) : '—'}</td>
                    <td className="num text-slate-500">{rz.makbuz_no || '—'}</td>
                    <td><StatuRozet kod={rz.statu} kisa /></td>
                  </tr>
                );
              })}
              {!kayitlar.length && <tr><td colSpan="13" className="text-center text-slate-400 py-6">
                Seçili dönem ve filtrelerde kayıt yok. Dönemi genişletin veya «Filtreleri temizle» deyin.
              </td></tr>}
            </tbody>
          </table>
        </div>
      </Kart>

      {tahsilat && (
        <Modal baslik={`Peşinat Tahsilatı — ${tahsilat.rz.rez_no} · ${tahsilat.rz.ad_soyad}`} genislik="max-w-lg" kapat={() => setTahsilat(null)}
          altlik={<>
            <Buton tur="sessiz" onClick={() => setTahsilat(null)}>Vazgeç</Buton>
            <Buton tur="basari" disabled={!(Number(tahsilat.tutar) > 0)}
              onClick={() => { gonder({ tip: 'TAHSILAT', rezId: tahsilat.rz.id, tutar: Number(tahsilat.tutar) || 0,
                                        makbuzNo: (tahsilat.makbuz_no || '').trim() }); setTahsilat(null); }}>
              Tahsilatı Kaydet
            </Buton>
          </>}>
          <div className="text-xs space-y-3">
            <div className="grid grid-cols-2 gap-2">
              {[['Konaklama', `${tr(tahsilat.rz.gelis_tarihi)} – ${tr(tahsilat.rz.cikis_tarihi)} (${tahsilat.rz.gun_sayisi} gün)`],
                ['Kurum-Şahıs', tahsilat.rz.kurum_sahis === 'KURUM' ? 'Kurum · ' + tahsilat.rz.odeyecek : 'Şahıs'],
                ['Yatak Bedeli', para(tahsilat.rz.yatak_bedeli)],
                ['Ödeme Türü', ODEME_TURU[tahsilat.rz.odeme_turu]],
                ['Peşinat Tutarı', para(tahsilat.rz.pesinat_tutari)],
                ['Son Ödeme Tarihi', tahsilat.rz.pesinat_son_odeme_tarihi ? tr(tahsilat.rz.pesinat_son_odeme_tarihi) : '—'],
                ['Daha Önce Tahsil Edilen', para(tahsilat.rz.tahsil_edilen || 0)],
                ['Kalan', para(kalanTutar(tahsilat.rz))]].map(([k, v]) => (
                <div key={k} className="bg-slate-50 border border-slate-200 rounded px-2 py-1">
                  <div className="text-2xs uppercase text-slate-500 font-semibold">{k}</div>
                  <div className="num text-ttk-900">{v}</div>
                </div>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Alan etiket="Tahsil edilen tutar (₺)" zorunlu>
                <input type="number" value={tahsilat.tutar} onChange={e => setTahsilat({ ...tahsilat, tutar: e.target.value })}
                  className={`${GIRDI} num text-right`} />
                <div className="flex gap-1 mt-1">
                  <Buton tur="sessiz" className="!py-0.5 !px-1.5" onClick={() => setTahsilat({ ...tahsilat, tutar: kalanTutar(tahsilat.rz) })}>Tamamı</Buton>
                  <Buton tur="sessiz" className="!py-0.5 !px-1.5" onClick={() => setTahsilat({ ...tahsilat, tutar: Math.round(kalanTutar(tahsilat.rz) / 2 / 50) * 50 })}>Yarısı</Buton>
                </div>
              </Alan>
              <Alan etiket="Makbuz No" ipucu={`Tahsilat tarihi: ${tr(s.bugun)} · İşlemi yapan: ${s.kullanici.kod}`}>
                <input value={tahsilat.makbuz_no} onChange={e => setTahsilat({ ...tahsilat, makbuz_no: e.target.value })}
                  className={`${GIRDI} num`} placeholder="Örn. 8347" />
              </Alan>
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded p-2 text-2xs text-amber-900">
              Tutar tamamlandığında statü otomatik olarak <b>Onaylı</b> olur. Bu prototipte tahsilat yalnız
              <b> statü ve kayıt seviyesinde</b> modellenir; gerçek ödeme veya muhasebe entegrasyonu yapılmaz.
            </div>
          </div>
        </Modal>
      )}

      {detay && (
        <Modal baslik={`Rezervasyon Detayı — ${detay.rez_no}`} genislik="max-w-3xl" kapat={() => setDetay(null)}
          altlik={<>
            {kalanTutar(detay) > 0 && acikMi(detay) && izin('pesinat.tahsilat') &&
              <Buton tur="basari" onClick={() => { setTahsilat({ rz: detay, tutar: kalanTutar(detay), makbuz_no: detay.makbuz_no || '' }); setDetay(null); }}>
                ₺ Tahsilat Al
              </Buton>}
            <Buton tur="sessiz" onClick={() => setDetay(null)}>Kapat</Buton>
          </>}>
          <div className="space-y-3">
            <RezervasyonOzet rz={detay} />
            <div>
              <h4 className="text-xs font-bold text-ttk-800 uppercase mb-1">Misafirler</h4>
              <table className="veri w-full">
                <thead><tr><th>Tc Kimlik No</th><th>Adı Soyadı</th><th>C.</th><th>Sicil No</th><th>Görev Sevk No</th><th className="text-right">Harcırah Miktarı</th><th>Oda / Yatak No</th></tr></thead>
                <tbody>
                  {detay.misafirler.map((g, i) => (
                    <tr key={i}>
                      <td className="num">{g.tc_kimlik_no || '—'}</td><td className="font-semibold">{g.adi_soyadi}</td>
                      <td>{g.cinsiyet}</td><td className="num">{g.sicil_no || '—'}</td><td className="num">{g.gorev_sevk_no || '—'}</td>
                      <td className="num text-right">{g.harcirah_miktari ? para(g.harcirah_miktari) : '—'}</td>
                      <td className="num">{g.oda_no ? `${g.oda_no} / ${g.yatak_no}` : <span className="text-rose-600">tahsis yok</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div>
              <h4 className="text-xs font-bold text-ttk-800 uppercase mb-1">Kayıt Hareketleri</h4>
              <ul className="text-xs space-y-1">
                {detay.hareketler.map((h, i) => (
                  <li key={i} className="flex gap-2 border-b border-slate-100 pb-1">
                    <span className="num text-slate-500 w-20">{tr(h.tarih)}</span>
                    <span className="flex-1">{h.metin}</span>
                    <span className="text-slate-400 num">{h.kullanici}</span>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════════════════════
   9) YENİ REZERVASYON / KAYIT GİRİŞİ  (MSFH0100 karşılığı)
   ══════════════════════════════════════════════════════════════════════════ */

const GIRDI = 'w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-ttk-400 disabled:bg-slate-100 disabled:text-slate-400';

const Alan = ({ etiket, zorunlu, ipucu, children, className = '' }) => (
  <label className={`block ${className}`}>
    <span className="text-2xs uppercase tracking-wide font-semibold text-slate-500">
      {etiket}{zorunlu && <span className="text-rose-600"> *</span>}
    </span>
    {children}
    {ipucu && <span className="block text-2xs text-slate-400 mt-0.5">{ipucu}</span>}
  </label>
);

function bosMisafir(cinsiyet = 'E') {
  return { tc_kimlik_no: '', adi_soyadi: '', cinsiyet, sicil_no: '', gorev_sevk_no: '',
           harcirah_miktari: '', birim: '', yatakId: null };
}

function YeniRezervasyonFormu({ s, gonder, kapat, dolu, temizlik, onDolgu }) {
  const [f, setF] = useState(() => ({
    tesis: (onDolgu && onDolgu.tesis) || s.tesis,
    ad_soyad: '', rezerv_tarihi: s.bugun, tel_no: '', aciklama: '', gelis_nedeni: 'Görevli',
    gelis_tarihi: (onDolgu && onDolgu.gelis_tarihi) || s.bugun,
    cikis_tarihi: ekle((onDolgu && onDolgu.gelis_tarihi) || s.bugun, 1),
    aile: false, protokol: false, plaka_no: '',
    kurum_sahis: 'KURUM', odeyecek: '', odeme_turu: 'MSD',
    pesinatTahsil: false, makbuz_no: '',
    misafirler: [{ ...bosMisafir(), yatakId: (onDolgu && onDolgu.yatakId) || null }],
  }));
  const [motorNotu, setMotorNotu] = useState(null);
  const yaz = (alan, deger) => setF(x => ({ ...x, [alan]: deger }));
  const misafirYaz = (i, alan, deger) => setF(x => ({
    ...x, misafirler: x.misafirler.map((g, k) => k === i ? { ...g, [alan]: deger } : g) }));

  const gunSayisi = Math.max(0, fark(f.gelis_tarihi, f.cikis_tarihi));
  const tesisYatak = useMemo(() => s.yataklar.filter(y => y.tesis === f.tesis), [s.yataklar, f.tesis]);

  /* Seçilen tarih aralığında kesintisiz müsait yataklar */
  const musaitYataklar = useMemo(() => {
    if (gunSayisi < 1) return [];
    return tesisYatak.filter(y => yatakMusait(y.id, f.gelis_tarihi, f.cikis_tarihi, dolu, temizlik));
  }, [tesisYatak, f.gelis_tarihi, f.cikis_tarihi, gunSayisi, dolu, temizlik]);

  /* Tesis veya tarih değişince artık geçersiz olan seçimleri düşür */
  useEffect(() => {
    setF(x => {
      const gecerli = new Set(musaitYataklar.map(y => y.id));
      if (x.misafirler.every(g => !g.yatakId || gecerli.has(g.yatakId))) return x;
      return { ...x, misafirler: x.misafirler.map(g => gecerli.has(g.yatakId) ? g : { ...g, yatakId: null }) };
    });
  }, [musaitYataklar]);

  const kisiDegistir = (n) => setF(x => {
    const adet = Math.max(1, Math.min(8, n));
    const liste = x.misafirler.slice(0, adet);
    while (liste.length < adet) liste.push(bosMisafir(liste.length ? liste[0].cinsiyet : 'E'));
    return { ...x, misafirler: liste };
  });

  /* Peşinat önizlemesi — tesisin güncel kuralına göre */
  const pesinatOnizleme = useMemo(() => {
    const taslak = {
      tesis: f.tesis, gun_sayisi: gunSayisi || 1, kurum_sahis: f.kurum_sahis,
      odeme_turu: f.protokol ? 'BOS' : f.odeme_turu, rezerv_tarihi: f.rezerv_tarihi,
      gelis_tarihi: f.gelis_tarihi, tahsil_edilen: 0,
      misafirler: f.misafirler.map(g => {
        const y = g.yatakId ? tesisYatak.find(x => x.id === g.yatakId) : null;
        return { oda_no: y ? y.oda_no : null };
      }),
    };
    pesinatHesapla(taslak, s.odalar, s.kurallar[f.tesis]);
    return taslak;
  }, [f, gunSayisi, s.odalar, s.kurallar, tesisYatak]);

  /* Doğrulama */
  const { hatalar, uyarilar } = useMemo(() => {
    const h = [], u = [];
    if (!f.ad_soyad.trim()) h.push('Rezervasyonu yaptıranın adı soyadı zorunludur.');
    if (gunSayisi < 1) h.push('Çıkış tarihi geliş tarihinden sonra olmalıdır.');
    if (gunSayisi > 60) h.push('Konaklama süresi 60 günü aşamaz.');
    f.misafirler.forEach((g, i) => {
      if (!g.adi_soyadi.trim()) h.push(`${i + 1}. misafirin adı soyadı zorunludur.`);
      if (g.tc_kimlik_no && !/^[1-9][0-9]{10}$/.test(g.tc_kimlik_no.trim()))
        h.push(`${i + 1}. misafirin Tc kimlik no 11 haneli olmalı ve 0 ile başlamamalıdır.`);
      if (!g.tc_kimlik_no.trim()) u.push(`${i + 1}. misafirin Tc kimlik no alanı boş — girişte zorunludur.`);
      if (f.kurum_sahis === 'KURUM' && !g.sicil_no.trim()) u.push(`${i + 1}. misafirin sicil no alanı boş.`);
    });
    const secilen = f.misafirler.map(g => g.yatakId).filter(Boolean);
    if (new Set(secilen).size !== secilen.length) h.push('Aynı yatak birden fazla misafire tahsis edilemez.');
    if (f.kurum_sahis === 'KURUM' && !f.odeyecek.trim()) u.push('Ödeyecek kurum girilmedi.');
    if (f.pesinatTahsil && !f.makbuz_no.trim()) u.push('Peşinat tahsil edildi işaretli ancak makbuz no girilmedi.');

    if (!f.aile) {                                   // karma oda kısıtı
      const formdaki = new Map();
      f.misafirler.forEach((g, i) => {
        if (!g.yatakId) return;
        const y = tesisYatak.find(x => x.id === g.yatakId);
        if (!y) return;
        const mevcut = odaCinsiyetleri(y.odaId, f.gelis_tarihi, f.cikis_tarihi, tesisYatak, dolu);
        const hepsi = new Set([...mevcut, ...(formdaki.get(y.odaId) || [])]);
        if (hepsi.size && !hepsi.has(g.cinsiyet))
          h.push(`${i + 1}. misafir: Oda ${y.oda_no} karma konaklamaya kapalı (odada farklı cinsiyette misafir var). ` +
                 `Aile/birlikte kalma talebi ise üstteki kutuyu işaretleyin.`);
        const set = formdaki.get(y.odaId) || new Set(); set.add(g.cinsiyet); formdaki.set(y.odaId, set);
      });
    }
    const yerlesikSayi = secilen.length;
    if (yerlesikSayi && yerlesikSayi < f.misafirler.length)
      u.push(`${f.misafirler.length - yerlesikSayi} misafire yatak tahsis edilmedi; kayıt «Talep» olarak açılacak.`);
    return { hatalar: h, uyarilar: u };
  }, [f, gunSayisi, tesisYatak, dolu]);

  /* Motoru bu forma uygula */
  const geciciRez = () => ({
    id: '__YENI__', rez_no: 'YENİ KAYIT', tesis: f.tesis,
    ad_soyad: f.ad_soyad || '(yeni talep)', rezerv_tarihi: f.rezerv_tarihi,
    aciklama: f.aciklama, tel_no: f.tel_no,
    kisi_sayisi: f.misafirler.length, gun_sayisi: gunSayisi,
    gelis_tarihi: f.gelis_tarihi, cikis_tarihi: f.cikis_tarihi,
    kurum_sahis: f.kurum_sahis, odeyecek: f.odeyecek,
    odeme_turu: f.protokol ? 'BOS' : f.odeme_turu, gelis_nedeni: f.gelis_nedeni,
    protokol: f.protokol, aile: f.aile, statu: 'TALEP', tahsil_edilen: 0, pesinat_tutari: 0,
    misafirler: f.misafirler.map(g => ({ ...g, adi_soyadi: g.adi_soyadi || 'MİSAFİR' })),
  });

  const otomatikYerlestir = () => {
    if (gunSayisi < 1) { setMotorNotu({ tip: 'hata', metin: 'Önce geçerli bir geliş/çıkış tarihi giriniz.' }); return; }
    const sonuc = yerlestirmeMotoru([geciciRez()], s.yataklar, s.odalar, dolu, temizlik, {});
    if (!sonuc.oneriler.length) {
      setMotorNotu({ tip: 'hata', metin: sonuc.basarisiz[0] ? sonuc.basarisiz[0].gerekce : 'Uygun yatak bulunamadı.' });
      return;
    }
    const o = sonuc.oneriler[0];
    setF(x => ({ ...x, misafirler: x.misafirler.map((g, i) => {
      const at = o.atamalar.find(a => a.misafirIndex === i);
      return at ? { ...g, yatakId: at.yatakId } : { ...g, yatakId: null };
    }) }));
    setMotorNotu({ tip: 'basari', metin: `Öneri uygulandı — ${[...new Set(o.atamalar.map(a => 'Oda ' + a.oda_no + '/' + a.yatak_no))].join(', ')}` +
      ` (skor ${o.skor})${o.notlar.length ? ' · ' + o.notlar.join(' · ') : ''}` });
  };

  const kaydet = () => {
    if (hatalar.length) return;
    const sira = s.rezervasyonlar.length + 1;
    const misafirler = f.misafirler.map(g => {
      const y = g.yatakId ? tesisYatak.find(x => x.id === g.yatakId) : null;
      return {
        tc_kimlik_no: g.tc_kimlik_no.trim(), adi_soyadi: g.adi_soyadi.trim().toLocaleUpperCase('tr-TR'),
        cinsiyet: g.cinsiyet, sicil_no: g.sicil_no.trim(), gorev_sevk_no: g.gorev_sevk_no.trim(),
        harcirah_miktari: Number(g.harcirah_miktari) || 0, birim: g.birim || '',
        yatakId: y ? y.id : null, oda_no: y ? y.oda_no : null, yatak_no: y ? y.yatak_no : null,
      };
    });
    const rz = {
      id: 'Y' + String(sira).padStart(5, '0'),
      rez_no: 'MSF-' + f.gelis_tarihi.slice(0, 4) + '-' + String(sira).padStart(5, '0'),
      tesis: f.tesis,
      ad_soyad: f.ad_soyad.trim().toLocaleUpperCase('tr-TR') +
                (misafirler.length > 1 ? (f.aile ? ' ve Ailesi' : ' ve Ark.') : ''),
      rezerv_tarihi: f.rezerv_tarihi, aciklama: f.aciklama.trim(), tel_no: f.tel_no.trim(),
      kisi_sayisi: misafirler.length, gun_sayisi: gunSayisi,
      gelis_tarihi: f.gelis_tarihi, cikis_tarihi: f.cikis_tarihi,
      kurum_sahis: f.kurum_sahis, odeyecek: f.odeyecek.trim() || misafirler[0].adi_soyadi,
      odeme_turu: f.protokol ? 'BOS' : f.odeme_turu, gelis_nedeni: f.gelis_nedeni,
      protokol: f.protokol, aile: f.aile, plaka_no: f.plaka_no.trim(),
      kayit_yapan: s.kullanici.kod, misafirler,
      statu: 'TALEP', uzatma: false, onceki_cikis_tarihi: null,
      pesinat_tutari: 0, pesinat_son_odeme_tarihi: null, tahsil_edilen: 0,
      makbuz_no: null, hareketler: [],
    };
    pesinatHesapla(rz, s.odalar, s.kurallar[f.tesis]);
    if (f.pesinatTahsil && rz.pesinat_tutari > 0) {
      rz.tahsil_edilen = rz.pesinat_tutari;
      rz.makbuz_no = f.makbuz_no.trim() || null;
    }
    rz.pesinattan_kalan = Math.max(0, rz.pesinat_tutari - rz.tahsil_edilen);

    const hepsiYerlesik = misafirler.every(g => g.yatakId);
    if (rz.pesinattan_kalan > 0) rz.statu = 'PESINAT_BEKLENIYOR';
    else if (!hepsiYerlesik) rz.statu = 'TALEP';
    else if (rz.cikis_tarihi <= s.bugun) rz.statu = 'CIKIS';
    else if (rz.gelis_tarihi <= s.bugun) rz.statu = 'KONAKLIYOR';
    else rz.statu = 'ONAYLI';

    rz.hareketler.push({ tarih: s.bugun, kullanici: s.kullanici.kod, metin: 'Rezervasyon talebi alındı (web kaydı)' });
    if (hepsiYerlesik) rz.hareketler.push({ tarih: s.bugun, kullanici: s.kullanici.kod,
      metin: `Yatak tahsisi: ${[...new Set(misafirler.map(g => 'Oda ' + g.oda_no + '/' + g.yatak_no))].join(', ')}` });
    if (rz.tahsil_edilen > 0) rz.hareketler.push({ tarih: s.bugun, kullanici: s.kullanici.kod,
      metin: `Peşinat tahsilatı ${para(rz.tahsil_edilen)}${rz.makbuz_no ? ' (Makbuz No ' + rz.makbuz_no + ')' : ''}` });
    if (rz.statu === 'KONAKLIYOR') rz.hareketler.push({ tarih: s.bugun, kullanici: s.kullanici.kod, metin: 'Giriş kaydı açıldı' });

    gonder({ tip: 'REZ_EKLE', rez: rz });
    kapat();
  };

  const yatakSecenekleri = (i) => {
    const digerleri = new Set(f.misafirler.filter((_, k) => k !== i).map(g => g.yatakId).filter(Boolean));
    return musaitYataklar.filter(y => !digerleri.has(y.id));
  };
  const tipAdi = t => t === 'TEK' ? 'tek kişilik' : t === 'CIFT' ? 'iki kişilik' : 'üç kişilik';

  return (
    <Modal baslik="Yeni Rezervasyon / Kayıt Girişi" genislik="max-w-6xl" kapat={kapat}
      altlik={<>
        <span className="text-2xs text-slate-500 mr-auto">
          {hatalar.length
            ? <b className="text-rose-700">{hatalar.length} eksik/hatalı alan var — kayıt açılamaz</b>
            : <>Kayıt açıldığında statü: <b className="text-ttk-800">{(() => {
                const hepsi = f.misafirler.every(g => g.yatakId);
                const kalan = Math.max(0, pesinatOnizleme.pesinat_tutari - (f.pesinatTahsil ? pesinatOnizleme.pesinat_tutari : 0));
                if (kalan > 0) return 'Peşinat Bekleniyor';
                if (!hepsi) return 'Talep';
                if (f.gelis_tarihi <= s.bugun) return 'Konaklıyor';
                return 'Onaylı';
              })()}</b></>}
        </span>
        <Buton tur="sessiz" onClick={kapat}>Vazgeç</Buton>
        <Buton onClick={otomatikYerlestir} disabled={!yetkiVar(s.kullanici, 'rezervasyon.yerlestir')}
          title={yetkiVar(s.kullanici, 'rezervasyon.yerlestir') ? '' : yetkiNotu(s.kullanici, 'rezervasyon.yerlestir')}>
          ⚙ Uygun Yatağı Otomatik Bul
        </Buton>
        <Buton tur="basari" onClick={kaydet} disabled={hatalar.length > 0}>Kaydet</Buton>
      </>}>
      <div className="grid grid-cols-12 gap-3">
        {/* Sol: talep ve ödeme bilgileri */}
        <div className="col-span-5 space-y-3">
          <fieldset className="border border-slate-200 rounded p-2.5 space-y-2">
            <legend className="text-2xs font-bold text-ttk-800 uppercase px-1">Rezervasyon Bilgileri</legend>
            <div className="grid grid-cols-2 gap-2">
              <Alan etiket="Misafirhane" zorunlu>
                <select value={f.tesis} onChange={e => yaz('tesis', e.target.value)} className={GIRDI}>
                  {TESISLER.filter(t => tesisYetkisi(s.kullanici, t.kod)).map(t => <option key={t.kod} value={t.kod}>{t.ad}</option>)}
                </select>
              </Alan>
              <Alan etiket="Rezerv Tarihi">
                <TarihGirdi deger={f.rezerv_tarihi} onChange={v => yaz('rezerv_tarihi', v)} className="!w-full" />
              </Alan>
            </div>
            <Alan etiket="Adı Soyadı (rezervasyonu yaptıran)" zorunlu>
              <input value={f.ad_soyad} onChange={e => yaz('ad_soyad', e.target.value)} className={GIRDI} placeholder="Örn. Mehmet Yılmaz" />
            </Alan>
            <div className="grid grid-cols-2 gap-2">
              <Alan etiket="Tel No">
                <input value={f.tel_no} onChange={e => yaz('tel_no', e.target.value)} className={GIRDI} placeholder="5xx xxx xxxx" />
              </Alan>
              <Alan etiket="Geliş Nedeni">
                <select value={f.gelis_nedeni} onChange={e => yaz('gelis_nedeni', e.target.value)} className={GIRDI}>
                  {GELIS_NEDENI.map(x => <option key={x}>{x}</option>)}
                </select>
              </Alan>
            </div>
            <Alan etiket="Açıklama" ipucu="En fazla 200 karakter">
              <input value={f.aciklama} maxLength={200} onChange={e => yaz('aciklama', e.target.value)} className={GIRDI} />
            </Alan>
          </fieldset>

          <fieldset className="border border-slate-200 rounded p-2.5 space-y-2">
            <legend className="text-2xs font-bold text-ttk-800 uppercase px-1">Konaklama</legend>
            <div className="grid grid-cols-3 gap-2 items-end">
              <Alan etiket="Geliş Tarihi" zorunlu>
                <TarihGirdi deger={f.gelis_tarihi} onChange={v => setF(x => ({
                  ...x, gelis_tarihi: v, cikis_tarihi: v >= x.cikis_tarihi ? ekle(v, Math.max(1, fark(x.gelis_tarihi, x.cikis_tarihi))) : x.cikis_tarihi
                }))} className="!w-full" />
              </Alan>
              <Alan etiket="Çıkış Tarihi" zorunlu>
                <TarihGirdi deger={f.cikis_tarihi} onChange={v => yaz('cikis_tarihi', v)} className="!w-full" />
              </Alan>
              <Alan etiket="Kaldığı Gün">
                <div className="flex items-center gap-1">
                  <button onClick={() => yaz('cikis_tarihi', ekle(f.cikis_tarihi, -1))} disabled={gunSayisi <= 1}
                    className="px-2 py-1 border border-slate-300 rounded text-xs disabled:opacity-40">−</button>
                  <span className="num flex-1 text-center font-bold text-ttk-800">{gunSayisi}</span>
                  <button onClick={() => yaz('cikis_tarihi', ekle(f.cikis_tarihi, 1))}
                    className="px-2 py-1 border border-slate-300 rounded text-xs">+</button>
                </div>
              </Alan>
            </div>
            <div className="grid grid-cols-3 gap-2 items-end">
              <Alan etiket="Kişi Sayısı" zorunlu>
                <div className="flex items-center gap-1">
                  <button onClick={() => kisiDegistir(f.misafirler.length - 1)} disabled={f.misafirler.length <= 1}
                    className="px-2 py-1 border border-slate-300 rounded text-xs disabled:opacity-40">−</button>
                  <span className="num flex-1 text-center font-bold text-ttk-800">{f.misafirler.length}</span>
                  <button onClick={() => kisiDegistir(f.misafirler.length + 1)} disabled={f.misafirler.length >= 8}
                    className="px-2 py-1 border border-slate-300 rounded text-xs disabled:opacity-40">+</button>
                </div>
              </Alan>
              <label className="flex items-center gap-1.5 text-xs pb-1 cursor-pointer">
                <input type="checkbox" checked={f.aile} onChange={e => yaz('aile', e.target.checked)} />
                <span title="Grup bölünmez, oda münhasıran bu gruba tahsis edilir">Aile / birlikte kalacak</span>
              </label>
              <label className="flex items-center gap-1.5 text-xs pb-1 cursor-pointer">
                <input type="checkbox" checked={f.protokol} onChange={e => yaz('protokol', e.target.checked)} />
                <span title="Protokol odası ve öncelik kuralı uygulanır">Protokol misafiri</span>
              </label>
            </div>
            <Alan etiket="Plaka No">
              <input value={f.plaka_no} onChange={e => yaz('plaka_no', e.target.value)} className={GIRDI} />
            </Alan>
          </fieldset>

          <fieldset className="border border-slate-200 rounded p-2.5 space-y-2">
            <legend className="text-2xs font-bold text-ttk-800 uppercase px-1">Ödeme ve Peşinat</legend>
            <div className="grid grid-cols-2 gap-2">
              <Alan etiket="Kurum-Şahıs" zorunlu>
                <select value={f.kurum_sahis} onChange={e => setF(x => ({ ...x, kurum_sahis: e.target.value,
                  odeme_turu: e.target.value === 'KURUM' ? 'MSD' : 'KRT' }))} className={GIRDI}>
                  <option value="KURUM">Kurum</option>
                  <option value="SAHIS">Şahıs</option>
                </select>
              </Alan>
              <Alan etiket="Ödeme Türü">
                <select value={f.protokol ? 'BOS' : f.odeme_turu} disabled={f.protokol}
                  onChange={e => yaz('odeme_turu', e.target.value)} className={GIRDI}>
                  {Object.entries(ODEME_TURU).map(([k, v]) => <option key={k} value={k}>{k} — {v}</option>)}
                </select>
              </Alan>
            </div>
            <Alan etiket="Ödeyecek" ipucu={f.kurum_sahis === 'KURUM' ? 'Masrafı üstlenen kurum' : 'Boş bırakılırsa misafirin kendisi'}>
              <input value={f.odeyecek} onChange={e => yaz('odeyecek', e.target.value)} className={GIRDI}
                list="kurum-listesi" placeholder={f.kurum_sahis === 'KURUM' ? 'Örn. TTK Genel Müdürlüğü' : ''} />
              <datalist id="kurum-listesi">{KURUMLAR.map(k => <option key={k} value={k} />)}</datalist>
            </Alan>
            <div className="bg-slate-50 border border-slate-200 rounded p-2 text-xs space-y-1">
              <div className="flex justify-between"><span className="text-slate-500">Yatak bedeli ({gunSayisi} gün × {f.misafirler.length} kişi)</span>
                <b className="num">{para(pesinatOnizleme.yatak_bedeli)}</b></div>
              <div className="flex justify-between"><span className="text-slate-500">Peşinat tutarı</span>
                <b className="num text-ttk-800">{pesinatOnizleme.pesinat_tutari ? para(pesinatOnizleme.pesinat_tutari)
                  : <span className="text-emerald-700">aranmıyor</span>}</b></div>
              {pesinatOnizleme.pesinat_son_odeme_tarihi &&
                <div className="flex justify-between"><span className="text-slate-500">Son ödeme tarihi</span>
                  <b className="num">{tr(pesinatOnizleme.pesinat_son_odeme_tarihi)}</b></div>}
              <div className="text-2xs text-slate-500 border-t border-slate-200 pt-1">
                {f.kurum_sahis === 'KURUM' && s.kurallar[f.tesis].kurumMisafirindePesinatAranmasin
                  ? 'Bu tesiste kurum misafirinden peşinat aranmıyor (kural: Peşinat ve Statü ekranı).'
                  : `Şahsi misafirde peşinat = yatak bedelinin %${s.kurallar[f.tesis].sahisOran}'i, asgari ${para(s.kurallar[f.tesis].sahisAsgariTutar)}.`}
              </div>
              {pesinatOnizleme.pesinat_tutari > 0 && (
                <div className="flex items-center gap-2 pt-1">
                  <label className={`flex items-center gap-1.5 ${yetkiVar(s.kullanici, 'pesinat.tahsilat') ? 'cursor-pointer' : 'opacity-60'}`}
                    title={yetkiVar(s.kullanici, 'pesinat.tahsilat') ? '' : yetkiNotu(s.kullanici, 'pesinat.tahsilat')}>
                    <input type="checkbox" checked={f.pesinatTahsil} disabled={!yetkiVar(s.kullanici, 'pesinat.tahsilat')}
                      onChange={e => yaz('pesinatTahsil', e.target.checked)} />
                    <span>Peşinat tahsil edildi</span>
                  </label>
                  <input value={f.makbuz_no} onChange={e => yaz('makbuz_no', e.target.value)}
                    disabled={!f.pesinatTahsil || !yetkiVar(s.kullanici, 'pesinat.tahsilat')}
                    placeholder="Makbuz No" className={`${GIRDI} !w-28 num`} />
                </div>
              )}
            </div>
          </fieldset>
        </div>

        {/* Sağ: misafirler ve yatak tahsisi */}
        <div className="col-span-7 space-y-3">
          <div className={`px-2 py-1.5 rounded border text-2xs flex items-center gap-3
            ${gunSayisi < 1 ? 'bg-slate-50 border-slate-200 text-slate-500'
              : musaitYataklar.length >= f.misafirler.length ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
              : 'bg-rose-50 border-rose-200 text-rose-800'}`}>
            {gunSayisi < 1 ? 'Geçerli bir tarih aralığı giriniz.' : <>
              <span><b className="num">{musaitYataklar.length}</b> yatak {tr(f.gelis_tarihi)} – {tr(f.cikis_tarihi)} arasında
                ({gunSayisi} gece) kesintisiz müsait</span>
              <span className="text-slate-500">· tek kişilik odada {musaitYataklar.filter(y => y.tip === 'TEK').length}</span>
              {musaitYataklar.length < f.misafirler.length &&
                <b className="ml-auto">Talep {f.misafirler.length} kişi — yeterli müsait yatak yok.</b>}
            </>}
          </div>

          {motorNotu && (
            <div className={`px-2 py-1.5 rounded border text-2xs bel
              ${motorNotu.tip === 'hata' ? 'bg-rose-50 border-rose-300 text-rose-800' : 'bg-ttk-50 border-ttk-200 text-ttk-900'}`}>
              {motorNotu.metin}
            </div>
          )}

          <fieldset className="border border-slate-200 rounded p-2.5">
            <legend className="text-2xs font-bold text-ttk-800 uppercase px-1">
              Misafirler ve Yatak Tahsisi ({f.misafirler.length} kişi)
            </legend>
            <table className="veri w-full">
              <thead><tr>
                <th className="w-6">#</th><th>Tc Kimlik No</th><th>Adı ve Soyadı</th><th className="w-14">Cinsiyet</th>
                <th className="w-20">Sicil No</th><th className="w-24">Görev Sevk No</th>
                <th className="w-20 text-right">Harcırah</th><th>Oda / Yatak No</th>
              </tr></thead>
              <tbody>
                {f.misafirler.map((g, i) => (
                  <tr key={i}>
                    <td className="num text-slate-400">{i + 1}</td>
                    <td><input value={g.tc_kimlik_no} maxLength={11} inputMode="numeric"
                      onChange={e => misafirYaz(i, 'tc_kimlik_no', e.target.value.replace(/\D/g, ''))}
                      className={`${GIRDI} num !w-28`} placeholder="11 hane" /></td>
                    <td><input value={g.adi_soyadi} onChange={e => misafirYaz(i, 'adi_soyadi', e.target.value)}
                      className={`${GIRDI} !w-40`} placeholder="Ad Soyad" /></td>
                    <td>
                      <select value={g.cinsiyet} onChange={e => misafirYaz(i, 'cinsiyet', e.target.value)} className={`${GIRDI} !w-14`}>
                        <option value="E">E</option><option value="K">K</option>
                      </select>
                    </td>
                    <td><input value={g.sicil_no} onChange={e => misafirYaz(i, 'sicil_no', e.target.value.replace(/\D/g, ''))}
                      disabled={f.kurum_sahis !== 'KURUM'} className={`${GIRDI} num !w-20`} /></td>
                    <td><input value={g.gorev_sevk_no} onChange={e => misafirYaz(i, 'gorev_sevk_no', e.target.value.replace(/\D/g, ''))}
                      disabled={f.kurum_sahis !== 'KURUM'} className={`${GIRDI} num !w-24`} /></td>
                    <td><input value={g.harcirah_miktari} inputMode="numeric"
                      onChange={e => misafirYaz(i, 'harcirah_miktari', e.target.value.replace(/[^\d]/g, ''))}
                      disabled={f.kurum_sahis !== 'KURUM'} className={`${GIRDI} num !w-20 text-right`} /></td>
                    <td>
                      <select value={g.yatakId || ''} onChange={e => misafirYaz(i, 'yatakId', e.target.value || null)}
                        disabled={!yetkiVar(s.kullanici, 'rezervasyon.yerlestir')}
                        title={yetkiVar(s.kullanici, 'rezervasyon.yerlestir') ? '' : yetkiNotu(s.kullanici, 'rezervasyon.yerlestir')}
                        className={`${GIRDI} !w-56 ${g.yatakId ? 'border-emerald-400 bg-emerald-50' : ''}`}>
                        <option value="">— yatak seçilmedi —</option>
                        {yatakSecenekleri(i).map(y => (
                          <option key={y.id} value={y.id}>
                            Oda {y.oda_no} / Yatak {y.yatak_no} · {tipAdi(y.tip)}{y.protokol ? ' · protokol' : ''} · {para(y.yatak_fiyati)}
                          </option>
                        ))}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-2xs text-slate-500 mt-1.5">
              Yatak seçmeden de kayıt açabilirsiniz; kayıt «Talep» statüsünde kalır ve
              Rezervasyon ekranındaki otomatik yerleştirmeye dahil olur.
            </div>
          </fieldset>

          {(hatalar.length > 0 || uyarilar.length > 0) && (
            <div className="space-y-1">
              {hatalar.map((h, i) => (
                <div key={'h' + i} className="px-2 py-1 rounded border bg-rose-50 border-rose-300 text-rose-800 text-2xs">⛔ {h}</div>
              ))}
              {uyarilar.map((u, i) => (
                <div key={'u' + i} className="px-2 py-1 rounded border bg-amber-50 border-amber-300 text-amber-900 text-2xs">⚠ {u}</div>
              ))}
            </div>
          )}
        </div>
      </div>
    </Modal>
  );
}


/* ══════════════════════════════════════════════════════════════════════════
  10) GİRİŞ EKRANI VE KULLANICI YÖNETİMİ
   ══════════════════════════════════════════════════════════════════════════ */

const HesapSatiri = ({ k, hizli }) => (
  <button onClick={() => hizli(k)} disabled={!k.aktif}
    className={`w-full text-left px-2 py-1.5 rounded border text-xs flex items-center gap-2 transition-colors
      ${k.aktif ? 'bg-white border-slate-200 hover:bg-ttk-50 hover:border-ttk-300' : 'bg-slate-50 border-slate-200 opacity-60 cursor-not-allowed'}`}>
    <span className="num font-bold text-ttk-800 w-20">{k.kod}</span>
    <span className="flex-1 truncate">{k.ad} <span className="text-slate-400">· {k.unvan}</span></span>
    <Rozet sinif={ROLLER[k.rol].renk}>{ROLLER[k.rol].kisa}</Rozet>
    <span className="num text-2xs text-slate-500 w-12 text-right">{k.sifre}</span>
    {!k.aktif && <Rozet sinif="bg-rose-100 text-rose-700 border-rose-300">pasif</Rozet>}
  </button>
);

function GirisEkrani({ kullanicilar, gonder }) {
  const [kod, setKod] = useState('');
  const [sifre, setSifre] = useState('');
  const [hata, setHata] = useState(null);
  const [hesaplarAcik, setHesaplarAcik] = useState(true);
  const [testAcik, setTestAcik] = useState(false);
  const kodRef = useRef(null);
  useEffect(() => { if (kodRef.current) kodRef.current.focus(); }, []);

  const baglan = () => {
    const k = kullanicilar.find(x => x.kod.toLocaleUpperCase('tr-TR') === kod.trim().toLocaleUpperCase('tr-TR'));
    if (!k)          { setHata('Kullanıcı adı bulunamadı.'); return; }
    if (k.sifre !== sifre) { setHata('Şifre hatalı.'); return; }
    if (!k.aktif)    { setHata('Bu kullanıcı pasif durumda. Bilgi İşlem ile görüşünüz.'); return; }
    setHata(null);
    gonder({ tip: 'GIRIS', kullanici: k });
  };
  const hizli = (k) => { setKod(k.kod); setSifre(k.sifre); setHata(null); gonder({ tip: 'GIRIS', kullanici: k }); };

  return (
    <div className="min-h-screen flex items-center justify-center p-6"
      style={{ background: 'linear-gradient(135deg,#0d2340 0%,#173c6d 55%,#2a61a8 100%)' }}>
      <div className="w-full max-w-4xl grid grid-cols-12 bg-white rounded-lg shadow-2xl overflow-hidden">
        {/* Sol tanıtım */}
        <div className="col-span-5 bg-ttk-800 text-white p-6 flex flex-col">
          <div className="flex items-center gap-2.5">
            <TtkLogo boyut="h-24 w-auto" />
            <div className="leading-tight">
              <div className="font-bold text-sm">TÜRKİYE TAŞKÖMÜRÜ KURUMU</div>
              <div className="text-2xs text-ttk-200">Bilgi İşlem Şube Müdürlüğü</div>
            </div>
          </div>
          <div className="mt-7">
            <div className="text-2xl font-bold tracking-wide">TTKNET</div>
            <div className="text-sm text-ttk-100">Misafirhane Bilgi Sistemi</div>
            <div className="text-2xs text-ttk-300 mt-0.5 num">Web Prototipi · Sürüm {SURUM} · {tr(SURUM_TARIHI)}</div>
          </div>
          <ul className="mt-6 space-y-2 text-xs text-ttk-100">
            {[['Ayrı ayrı sayfalar', 'Özet, takvim, odalar, yatak listesi, talepler, tahsilat, statü'],
              ['Otomatik ve manuel yerleştirme', 'Öneri motoru, onay akışı ve elle oda/yatak seçimi'],
              ['Rol bazlı yetki', 'Admin, müdür, resepsiyon ve muhasebe için ayrı görünüm']].map(([b, a]) => (
              <li key={b} className="flex gap-2">
                <span className="text-emerald-400 mt-0.5">▸</span>
                <span><b className="text-white">{b}</b><span className="block text-ttk-300">{a}</span></span>
              </li>
            ))}
          </ul>
          <div className="mt-auto pt-6 text-2xs text-ttk-300 leading-relaxed">
            Bu ekran mevcut TTKNET sistemine dokunmayan bir <b className="text-amber-300">demo prototiptir</b>.
            Kimlik doğrulama yalnız tarayıcıda çalışır, gerçek veri içermez. Kurulumda TTKNET/YBS
            oturumu ve sunucu taraflı yetki denetimi kullanılır.
          </div>
        </div>

        {/* Sağ giriş formu */}
        <div className="col-span-7 p-6">
          <h1 className="text-lg font-bold text-ttk-800">Bağlantı</h1>
          <p className="text-xs text-slate-500 mb-4">Kullanıcı adınız ve şifrenizle oturum açınız.</p>

          <div className="space-y-3 max-w-sm">
            <Alan etiket="YBS Kullanıcı Adı" zorunlu>
              <input ref={kodRef} value={kod} onChange={e => { setKod(e.target.value); setHata(null); }}
                onKeyDown={e => e.key === 'Enter' && baglan()} autoComplete="username"
                className={`${GIRDI} !py-1.5 !text-sm num tracking-wide`} placeholder="Örn. TTK7719" />
            </Alan>
            <Alan etiket="Şifre" zorunlu>
              <input type="password" value={sifre} onChange={e => { setSifre(e.target.value); setHata(null); }}
                onKeyDown={e => e.key === 'Enter' && baglan()} autoComplete="current-password"
                className={`${GIRDI} !py-1.5 !text-sm`} placeholder="••••" />
            </Alan>
            {hata && <div className="px-2 py-1.5 rounded border bg-rose-50 border-rose-300 text-rose-800 text-xs bel">⛔ {hata}</div>}
            <div className="flex items-center gap-2 pt-1">
              <Buton tur="birincil" className="!px-5 !py-1.5" onClick={baglan}>BAĞLAN</Buton>
              <Buton tur="sessiz" onClick={() => { setKod(''); setSifre(''); setHata(null); }}>Temizle</Buton>
            </div>
          </div>

          <div className="mt-5 border-t border-slate-200 pt-3 max-h-[42vh] overflow-auto kaydir pr-1">
            <button onClick={() => setHesaplarAcik(x => !x)}
              className="text-2xs font-bold text-ttk-700 uppercase tracking-wide hover:underline">
              Demo hesapları {hesaplarAcik ? '▲' : '▼'}
            </button>
            {hesaplarAcik && (
              <div className="mt-2 space-y-1">
                <p className="text-2xs text-slate-500">
                  Rol farklarını görmek için bir hesaba tıklayın; kullanıcı adı ve şifre otomatik doldurulur.
                </p>
                {kullanicilar.filter(k => !k.test).map(k => <HesapSatiri key={k.kod} k={k} hizli={hizli} />)}
              </div>
            )}
            <button onClick={() => setTestAcik(x => !x)}
              className="mt-3 text-2xs font-bold text-emerald-700 uppercase tracking-wide hover:underline">
              Giriş testi hesapları · 4 haneli {testAcik ? '▲' : '▼'}
            </button>
            {testAcik && (
              <div className="mt-2 space-y-1">
                <p className="text-2xs text-slate-500">
                  Her rol için üç farklı şifre uzunluğu (123 / 1234 / 12345).
                  Ayrıntılı liste <span className="num">.gizli/test-hesaplari.md</span> dosyasındadır
                  (depoya dahil değildir).
                </p>
                {kullanicilar.filter(k => k.test).map(k => <HesapSatiri key={k.kod} k={k} hizli={hizli} />)}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function YetkiUyarisi({ metin }) {
  return (
    <div className="p-6">
      <div className="max-w-xl mx-auto bg-white border border-amber-300 rounded p-4 text-center">
        <div className="text-3xl mb-2">🔒</div>
        <h2 className="text-sm font-bold text-ttk-800 mb-1">Bu ekrana erişim yetkiniz yok</h2>
        <p className="text-xs text-slate-600">{metin}</p>
      </div>
    </div>
  );
}

/* ── Kullanıcı ve yetki yönetimi (yalnız Admin) ─────────────────────────── */
function KullaniciEkrani({ s, gonder }) {
  const [yeni, setYeni] = useState(null);
  const [matrisAcik, setMatrisAcik] = useState(false);
  const duzenle = (kod, degisiklik) => gonder({ tip: 'KULLANICI_GUNCELLE', kod, degisiklik });

  const tesisSec = (k, kodT) => {
    if (k.tesisler === '*') return;
    const yeniListe = k.tesisler.includes(kodT) ? k.tesisler.filter(x => x !== kodT) : [...k.tesisler, kodT];
    if (!yeniListe.length) return;
    duzenle(k.kod, { tesisler: yeniListe });
  };

  const yeniKaydet = () => {
    const kod = (yeni.kod || '').trim().toLocaleUpperCase('tr-TR');
    if (!kod || !yeni.ad.trim() || !yeni.sifre.trim()) return;
    if (s.kullanicilar.some(k => k.kod === kod)) return;
    gonder({ tip: 'KULLANICI_EKLE', kullanici: { ...yeni, kod, aktif: true } });
    setYeni(null);
  };

  return (
    <div className="space-y-3">
      <Kart baslik="Roller ve Yetki Tanımları"
        sag={<Buton tur="sessiz" onClick={() => setMatrisAcik(x => !x)}>{matrisAcik ? 'Yetki matrisini gizle' : 'Yetki matrisini göster'}</Buton>}>
        <div className="grid grid-cols-4 gap-2">
          {Object.entries(ROLLER).map(([kod, r]) => (
            <div key={kod} className={`border rounded p-2 ${r.renk}`}>
              <div className="font-bold text-xs">{r.ad}</div>
              <div className="text-2xs opacity-80 mt-0.5">{r.aciklama}</div>
              <div className="num text-2xs mt-1.5 font-semibold">
                {r.izinler === '*' ? 'Tüm yetkiler' : `${r.izinler.length} / ${IZINLER.length} yetki`} ·
                {' '}{s.kullanicilar.filter(k => k.rol === kod).length} kullanıcı
              </div>
            </div>
          ))}
        </div>
        {matrisAcik && (
          <div className="mt-3 overflow-x-auto kaydir">
            <table className="veri w-full">
              <thead><tr>
                <th>Yetki</th><th>Grup</th>
                {Object.entries(ROLLER).map(([kod, r]) => <th key={kod} className="text-center">{r.kisa}</th>)}
              </tr></thead>
              <tbody>
                {IZINLER.map(iz => (
                  <tr key={iz.kod}>
                    <td className="font-semibold text-ttk-900">{iz.ad}</td>
                    <td className="text-slate-500">{iz.grup}</td>
                    {Object.keys(ROLLER).map(rk => {
                      const v = yetkiVar({ rol: rk }, iz.kod);
                      return <td key={rk} className={`text-center font-bold ${v ? 'text-emerald-600' : 'text-slate-300'}`}>{v ? '✓' : '—'}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-2xs text-slate-500 mt-1">
              Yetki matrisi prototipte sabittir; kurulumda rol-yetki eşleşmesi veritabanında tutulur
              (bkz. <span className="num">docs/api-sozlesmesi.md</span> § Yetkilendirme).
            </div>
          </div>
        )}
      </Kart>

      <Kart baslik={`Kullanıcılar (${s.kullanicilar.length})`} govdeSinif="p-0"
        sag={<Buton tur="basari" onClick={() => setYeni({ kod:'', sifre:'', ad:'', unvan:'', rol:'RESEPSIYON', tesisler:[s.tesis] })}>
          + Yeni Kullanıcı
        </Buton>}>
        <table className="veri w-full">
          <thead><tr>
            <th>Kullanıcı Adı</th><th>Adı Soyadı</th><th>Unvan</th><th className="w-44">Rol</th>
            <th>Yetkili Misafirhaneler</th><th>Son Giriş</th><th className="text-center">Durum</th>
          </tr></thead>
          <tbody>
            {s.kullanicilar.map(k => {
              const kendisi = s.kullanici.kod === k.kod;
              return (
                <tr key={k.kod} className={k.aktif ? '' : 'opacity-60'}>
                  <td className="num font-bold text-ttk-900">
                    {k.kod}
                    {kendisi && <span className="text-2xs text-emerald-600 ml-1">(siz)</span>}
                    {k.test && <Rozet sinif="bg-slate-100 text-slate-600 border-slate-300 ml-1" baslik="Giriş testi için tanımlanmış hesap — kurulumda silinmelidir">test</Rozet>}
                  </td>
                  <td className="font-semibold">{k.ad}</td>
                  <td className="text-slate-600">{k.unvan}</td>
                  <td>
                    <select value={k.rol} onChange={e => duzenle(k.kod, { rol: e.target.value })}
                      disabled={kendisi} title={kendisi ? 'Kendi rolünüzü değiştiremezsiniz' : ''}
                      className={`${GIRDI} !w-40`}>
                      {Object.entries(ROLLER).map(([kod, r]) => <option key={kod} value={kod}>{r.ad}</option>)}
                    </select>
                  </td>
                  <td>
                    {k.tesisler === '*'
                      ? <Rozet sinif="bg-violet-100 text-violet-800 border-violet-300">Tüm misafirhaneler</Rozet>
                      : <div className="flex gap-1 flex-wrap">
                          {TESISLER.map(t => (
                            <button key={t.kod} onClick={() => tesisSec(k, t.kod)}
                              className={`px-1.5 py-[1px] rounded border text-2xs font-semibold
                                ${k.tesisler.includes(t.kod) ? 'bg-ttk-600 text-white border-ttk-700' : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-50'}`}>
                              {t.ad.split(' ')[0]}
                            </button>
                          ))}
                        </div>}
                  </td>
                  <td className="num text-slate-500">{k.sonGiris ? tr(k.sonGiris) : '—'}</td>
                  <td className="text-center">
                    <button onClick={() => duzenle(k.kod, { aktif: !k.aktif })} disabled={kendisi}

function Uygulama() {
  const [s, gonder] = useReducer(indirgeyici, null, baslangicDurumu);
  const [gunlukAcik, setGunlukAcik] = useState(false);
  const [bilgiAcik, setBilgiAcik] = useState(false);
  const [yeniForm, setYeniForm] = useState(null);
  const [menuAcik, setMenuAcik] = useState(false);

  useEffect(() => { document.documentElement.style.setProperty('--olcek', String(s.olcek)); }, [s.olcek]);

  const { dolu, temizlik } = useMemo(() => dolulukKur(s.rezervasyonlar), [s.rezervasyonlar]);
  const k = s.kullanici;

  const izin = (x) => yetkiVar(k, x);
  const sayfalar = SAYFALAR.filter(x => izin(x.izin));
  const aktif = s.ekran === 'ANA_MENU' ? null : (sayfaBul(s.ekran) || sayfalar[0]);
  const tesisler = TESISLER.filter(t => tesisYetkisi(k, t.kod));
  const git = (kod) => { gonder({ tip: 'EKRAN', ekran: kod }); setMenuAcik(false); };

  /* Ana menü kartlarındaki canlı sayılar */
  const sayilar = useMemo(() => {
    const tesisYatak = s.yataklar.filter(y => y.tesis === s.tesis);
    let doluSayi = 0;
    for (const y of tesisYatak) if (dolu.has(y.id + '|' + s.bugun)) doluSayi++;
    const bos = tesisYatak.length - doluSayi;
    const kapsam = s.rezervasyonlar.filter(r => r.tesis === s.tesis);
    const ufuk = ekle(s.bugun, 21);
    const bekleyen = kapsam.filter(r => ['TALEP', 'PESINAT_BEKLENIYOR'].includes(r.statu) &&
      r.gelis_tarihi >= s.bugun && r.gelis_tarihi <= ufuk && r.misafirler.some(g => !g.yatakId)).length;
    const tahsilat = kapsam.filter(r => !['IPTAL', 'CIKIS'].includes(r.statu) &&
      (r.pesinat_tutari || 0) > (r.tahsil_edilen || 0)).length;
    const konaklayan = kapsam.filter(r => r.statu === 'KONAKLIYOR').length;
    const oran = tesisYatak.length ? Math.round(doluSayi / tesisYatak.length * 100) : 0;
    return {
      OZET:          { deger: '%' + oran, etiket: 'bugünkü doluluk' },
      TAKVIM:        { deger: bos, etiket: 'bugün boş yatak', renk: 'text-emerald-700' },
      ODALAR:        { deger: `${doluSayi}/${tesisYatak.length}`, etiket: 'yatak dolu' },
      YATAK_LISTESI: { deger: doluSayi, etiket: 'kayıtlı misafir' },
      TALEPLER:      { deger: bekleyen, etiket: '21 gün içinde yerleştirme bekleyen', renk: bekleyen ? 'text-amber-600' : 'text-slate-400' },
      TAHSILAT:      { deger: tahsilat, etiket: 'tahsilat bekleyen kayıt', renk: tahsilat ? 'text-rose-600' : 'text-slate-400' },
      STATU:         { deger: konaklayan, etiket: 'hâlen konaklayan' },
      KULLANICILAR:  { deger: s.kullanicilar.length, etiket: 'tanımlı kullanıcı' },
    };
  }, [s.rezervasyonlar, s.yataklar, s.tesis, s.bugun, dolu, s.kullanicilar.length]);

  if (!k) return <GirisEkrani kullanicilar={s.kullanicilar} gonder={gonder} />;

  const seciliRez = s.seciliRezId ? s.rezervasyonlar.find(r => r.id === s.seciliRezId) : null;
  const ortak = { s, gonder, dolu, temizlik, acYeniKayit: setYeniForm, izin, git, seciliRez };

      {/* Üst bant — sade */}

            <TtkLogo boyut="h-11 w-auto" />
            <div className="leading-tight text-left">
              <div className="font-bold text-sm tracking-wide">TTKNET</div>
              <div className="text-2xs text-ttk-200">Misafirhane Bilgi Sistemi</div>
            </div>
          </button>

          <select value={s.tesis} onChange={e => gonder({ tip: 'TESIS', tesis: e.target.value })}
            className="bg-ttk-700 border border-ttk-600 text-white rounded px-2 py-1.5 text-xs font-semibold max-w-[15rem]">
            {tesisler.map(t => <option key={t.kod} value={t.kod} className="text-slate-900">{t.ad} — {t.sehir}</option>)}
          </select>

          <div className="ml-auto flex items-center gap-2 flex-wrap justify-end text-xs">
            {izin('rezervasyon.olustur') &&
              <button onClick={() => setYeniForm({ tesis: s.tesis })}
                className="flex items-center gap-1 px-2.5 py-1.5 rounded bg-emerald-500 hover:bg-emerald-400 text-white font-semibold text-2xs whitespace-nowrap">
                <Ikon ad="yeni" sinif="w-3.5 h-3.5" /> Yeni Kayıt
              </button>}
            <span className="px-2 py-1 rounded bg-amber-400 text-amber-950 font-bold text-2xs">DEMO</span>
            <OlcekKontrol olcek={s.olcek} gonder={gonder} />
            <div className="flex items-center gap-1 bg-ttk-700/70 rounded px-2 py-1">
              <span className="text-ttk-200 text-2xs">Tarih</span>
              <span className="num font-bold">{tr(s.bugun)}</span>
              {izin('sistem.tarih') && <>
                <button title="1 gün ilerlet" onClick={() => gonder({ tip: 'GUN_ILERLET', adet: 1 })} className="px-1 hover:bg-ttk-600 rounded font-bold">+1</button>
                <button title="7 gün ilerlet" onClick={() => gonder({ tip: 'GUN_ILERLET', adet: 7 })} className="px-1 hover:bg-ttk-600 rounded font-bold">+7</button>
              </>}
            </div>
            <button onClick={() => setBilgiAcik(true)} className="px-2 py-1 rounded hover:bg-ttk-700 text-ttk-100" title="Prototip ve yetkiler hakkında">?</button>
            <div className="flex items-center gap-2 bg-ttk-700/70 rounded pl-2 pr-1 py-1">
              <div className="leading-tight text-right hidden sm:block">
                <div className="num font-bold">{k.kod}</div>
                <div className="text-2xs text-ttk-200">{ROLLER[k.rol].kisa}</div>
              </div>
              <button onClick={() => gonder({ tip: 'CIKIS' })} title="Oturumu kapat"
                className="px-2 py-1 rounded hover:bg-rose-500/80 text-ttk-100 hover:text-white text-2xs font-semibold">Çıkış</button>
            </div>
          </div>
        </div>

        {/* Sayfa şeridi */}
        <nav className="bg-ttk-900/40 border-t border-ttk-700">
          <div className="sayfa-govde px-3 flex items-center gap-1 overflow-x-auto kaydir">

              className={`flex items-center gap-1.5 px-2.5 py-2 text-xs font-semibold whitespace-nowrap border-b-2 transition-colors
                ${s.ekran === 'ANA_MENU' ? 'border-white text-white' : 'border-transparent text-ttk-200 hover:text-white'}`}>
              <Ikon ad="menu" sinif="w-3.5 h-3.5" /> Ana Menü
            </button>
            <span className="w-px h-5 bg-ttk-700 mx-1" />
            {sayfalar.map(x => (
              <button key={x.kod} onClick={() => git(x.kod)} title={x.aciklama}
                className={`flex items-center gap-1.5 px-2.5 py-2 text-xs font-semibold whitespace-nowrap border-b-2 transition-colors
                  ${s.ekran === x.kod ? 'border-white text-white' : 'border-transparent text-ttk-200 hover:text-white'}`}>
                <Ikon ad={x.ikon} sinif="w-3.5 h-3.5" /> {x.kisa}
              </button>
            ))}
          </div>
        </nav>
      </header>

      <main className="flex-1 p-3">
        <div className="sayfa-govde">
          {s.ekran === 'ANA_MENU'
            ? <AnaMenu s={s} sayfalar={sayfalar} sayilar={sayilar} git={git} acYeniKayit={setYeniForm} izin={izin} />
            : !aktif || !izin(aktif.izin)
              ? <YetkiUyarisi metin={`Bu sayfa ${rolAd(k.rol)} rolüne kapalıdır. Yetki için Bilgi İşlem Şube Müdürlüğü ile görüşünüz.`} />
              : <>
                  {['OZET', 'TAKVIM', 'YATAK_LISTESI'].includes(s.ekran) && <DolulukPanosu {...ortak} bolum={s.ekran} />}
                  {['TALEPLER', 'ODALAR'].includes(s.ekran) && <RezervasyonEkrani {...ortak} bolum={s.ekran} />}
                  {['TAHSILAT', 'STATU'].includes(s.ekran) && <PesinatEkrani {...ortak} bolum={s.ekran} />}
                  {s.ekran === 'KULLANICILAR' && <KullaniciEkrani s={s} gonder={gonder} />}
                </>}
        </div>
      </main>

      {/* Alt bant */}
      <footer className="bg-slate-200 border-t border-slate-300">
        <div className="sayfa-govde px-3 py-1 flex items-center gap-3 text-2xs text-slate-600 flex-wrap">
          <span className="num font-semibold" title={`${k.ad} · ${rolAd(k.rol)}`}>{k.kod}</span>
          <span className="num">{aktif ? aktif.form : 'MSFH-W00'}</span>
          <span className="num">{tr(s.bugun)}</span>
          <button onClick={() => setGunlukAcik(true)} className="flex-1 min-w-[12rem] text-left truncate hover:text-ttk-700">
            <b className="mr-1">Son işlem:</b>{s.gunluk[0] ? s.gunluk[0].metin : '—'}
          </button>
          <span className="num">Kayıt: {s.rezervasyonlar.length}</span>
          <span className="num text-slate-500">v{SURUM}</span>
        </div>
      </footer>

      {yeniForm && (
        <YeniRezervasyonFormu s={s} gonder={gonder} dolu={dolu} temizlik={temizlik}
          onDolgu={yeniForm} kapat={() => setYeniForm(null)} />
      )}

      {gunlukAcik && (
        <Modal baslik="İşlem Günlüğü" genislik="max-w-3xl" kapat={() => setGunlukAcik(false)}>
          <ul className="text-xs space-y-1">
            {s.gunluk.map((g, i) => (
              <li key={i} className={`flex gap-2 px-2 py-1.5 rounded border
                ${g.tip === 'uyari' ? 'bg-amber-50 border-amber-200' : g.tip === 'basari' ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
                <span className="num text-slate-500 w-20 shrink-0">{tr(g.tarih)}</span>
                <span className="flex-1">{g.metin}</span>
              </li>
            ))}
          </ul>
        </Modal>
      )}

      {bilgiAcik && <BilgiPenceresi kapat={() => setBilgiAcik(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('kok')).render(<Uygulama />);
</script>
</body>
</html>
