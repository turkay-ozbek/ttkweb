/* ══════════════════════════════════════════════════════════════════════════
   7) EKRAN 2 — REZERVASYON VE OTOMATİK YERLEŞTİRME
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Manuel yerleştirme penceresi ──────────────────────────────────────────
   Otomatik yerleştirmeye alternatif: her misafir için oda/yatak elle seçilir.
   Seçenekler yalnız talebin tüm gecelerinde müsait olan yataklardır; odadaki
   mevcut misafirler seçenekle birlikte gösterilir. */
function ManuelYerlestirme({ s, rz, gonder, kapat }) {
  const [secim, setSecim] = useState(() => rz.misafirler.map(g => g.yatakId || ''));
  const [odaSecim, setOdaSecim] = useState('');

  const { dolu, temizlik } = useMemo(
    () => dolulukKur(s.rezervasyonlar.filter(r => r.id !== rz.id)), [s.rezervasyonlar, rz.id]);
  const tesisYatak = useMemo(() => s.yataklar.filter(y => y.tesis === rz.tesis), [s.yataklar, rz.tesis]);
  const tesisOda = useMemo(() => s.odalar.filter(o => o.tesis === rz.tesis), [s.odalar, rz.tesis]);
  const geceler = aralik(rz.gelis_tarihi, rz.cikis_tarihi);

  const musaitler = useMemo(
    () => tesisYatak.filter(y => yatakMusait(y.id, rz.gelis_tarihi, rz.cikis_tarihi, dolu, temizlik)),
    [tesisYatak, rz.gelis_tarihi, rz.cikis_tarihi, dolu, temizlik]);

  /* Odada, talebin tarihlerinde konaklayan diğer misafirler */
  const odaSakinleri = useMemo(() => {
    const m = new Map();
    for (const y of tesisYatak) {
      for (const t of geceler) {
        const d = dolu.get(y.id + '|' + t);
        if (!d || !d.misafir) continue;
        const liste = m.get(y.odaId) || [];
        if (!liste.some(x => x.tc === d.misafir.tc_kimlik_no)) {
          liste.push({ tc: d.misafir.tc_kimlik_no, ad: d.misafir.adi_soyadi, cinsiyet: d.misafir.cinsiyet, yatak_no: y.yatak_no });
        }
        m.set(y.odaId, liste);
      }
    }
    return m;
  }, [tesisYatak, dolu, geceler.join()]);

  /* Grubun tamamını alabilecek odalar */
  const uygunOdalar = useMemo(() => tesisOda.filter(o => {
    const bos = musaitler.filter(y => y.odaId === o.id).length;
    return bos >= rz.misafirler.length;
  }), [tesisOda, musaitler, rz.misafirler.length]);

  const odayaYerlestir = (odaId) => {
    if (!odaId) return;
    const bos = musaitler.filter(y => y.odaId === odaId).sort((a, b) => a.yatak_no - b.yatak_no);
    setSecim(rz.misafirler.map((_, i) => bos[i] ? bos[i].id : ''));
    setOdaSecim(odaId);
  };

  const hatalar = useMemo(() => {
    const h = [];
    const dolular = secim.filter(Boolean);
    if (new Set(dolular).size !== dolular.length) h.push('Aynı yatak birden fazla misafire verilemez.');
    if (!rz.aile) {
      const odaCins = new Map();
      secim.forEach((yid, i) => {
        if (!yid) return;
        const y = tesisYatak.find(x => x.id === yid);
        if (!y) return;
        const mevcut = new Set((odaSakinleri.get(y.odaId) || []).map(x => x.cinsiyet));
        const formda = odaCins.get(y.odaId) || new Set();
        const hepsi = new Set([...mevcut, ...formda]);
        if (hepsi.size && !hepsi.has(rz.misafirler[i].cinsiyet))
          h.push(`${rz.misafirler[i].adi_soyadi}: Oda ${y.oda_no} karma konaklamaya kapalı (odada farklı cinsiyette misafir var).`);
        formda.add(rz.misafirler[i].cinsiyet); odaCins.set(y.odaId, formda);
      });
    }
    return [...new Set(h)];
  }, [secim, tesisYatak, odaSakinleri, rz]);

  const secenekler = (i) => {
    const digerleri = new Set(secim.filter((v, k) => k !== i && v));
    return musaitler.filter(y => !digerleri.has(y.id));
  };
  const yerlesen = secim.filter(Boolean).length;

  const kaydet = () => {
    if (hatalar.length) return;
    const atamalar = secim.map((yid, i) => {
      const y = yid ? tesisYatak.find(x => x.id === yid) : null;
      return { misafirIndex: i, yatakId: y ? y.id : null, oda_no: y ? y.oda_no : null, yatak_no: y ? y.yatak_no : null };
    });
    gonder({ tip: 'MANUEL_ATA_TOPLU', rezId: rz.id, atamalar });
    kapat();
  };

  return (
    <Modal baslik={`Manuel Yerleştirme — ${rz.rez_no} · ${rz.ad_soyad}`} genislik="max-w-5xl" kapat={kapat}
      altlik={<>
        <span className="text-2xs text-slate-500 mr-auto">
          {hatalar.length ? <b className="text-rose-700">{hatalar.length} çakışma var — kaydedilemez</b>
            : `${yerlesen} / ${rz.misafirler.length} misafir yerleştirildi`}
        </span>
        <Buton tur="sessiz" onClick={kapat}>Vazgeç</Buton>
        <Buton tur="sessiz" onClick={() => { setSecim(rz.misafirler.map(() => '')); setOdaSecim(''); }}>Seçimi Temizle</Buton>
        <Buton tur="basari" onClick={kaydet} disabled={hatalar.length > 0}>Yerleşimi Kaydet</Buton>
      </>}>
      <div className="space-y-3 text-xs">
        <div className="grid grid-cols-4 gap-2">
          {[['Konaklama', `${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)} · ${geceler.length} gece`],
            ['Kişi / Talep', `${rz.misafirler.length} kişi${rz.aile ? ' · aile (birlikte)' : ''}${rz.protokol ? ' · protokol' : ''}`],
            ['Kurum-Şahıs', rz.kurum_sahis === 'KURUM' ? 'Kurum · ' + rz.odeyecek : 'Şahıs'],
            ['Kesintisiz müsait yatak', `${musaitler.length} yatak · ${uygunOdalar.length} oda grubu tamamen alabilir`]].map(([k, v]) => (
            <div key={k} className="bg-slate-50 border border-slate-200 rounded px-2 py-1.5">
              <div className="text-2xs uppercase text-slate-500 font-semibold">{k}</div>
              <div className="num text-ttk-900 truncate" title={v}>{v}</div>
            </div>
          ))}
        </div>

        {rz.misafirler.length > 1 && (
          <div className="flex items-center gap-2 bg-ttk-50 border border-ttk-200 rounded px-2 py-1.5">
            <span className="font-semibold text-ttk-800">Hızlı seçim:</span>
            <span className="text-slate-600">grubun tamamını tek odaya yerleştir</span>
            <select value={odaSecim} onChange={e => odayaYerlestir(e.target.value)}
              className={`${GIRDI} !w-72`}>
              <option value="">— oda seçiniz —</option>
              {uygunOdalar.map(o => {
                const sakin = odaSakinleri.get(o.id) || [];
                return (
                  <option key={o.id} value={o.id}>
                    Oda {o.oda_no} · {o.tip === 'TEK' ? 'tek' : o.tip === 'CIFT' ? 'iki' : 'üç'} kişilik · {o.kat}. kat
                    {sakin.length ? ` · odada: ${sakin.map(x => x.ad.split(' ')[0]).join(', ')}` : ' · oda tamamen boş'}
                  </option>
                );
              })}
            </select>
            {!uygunOdalar.length && <span className="text-rose-700 font-semibold">Grubun tamamını alabilecek oda yok — kişileri tek tek yerleştirin.</span>}
          </div>
        )}

        <table className="veri w-full">
          <thead><tr>
            <th className="w-6">#</th><th>Adı ve Soyadı</th><th className="text-center">C.</th><th>Tc Kimlik No</th>
            <th>Mevcut Yatak</th><th>Yeni Oda / Yatak No</th><th>Odada kimler var</th>
          </tr></thead>
          <tbody>
            {rz.misafirler.map((g, i) => {
              const secili = secim[i] ? tesisYatak.find(y => y.id === secim[i]) : null;
              const sakin = secili ? (odaSakinleri.get(secili.odaId) || []) : [];
              return (
                <tr key={i}>
                  <td className="num text-slate-400">{i + 1}</td>
                  <td className="font-semibold text-ttk-900">{g.adi_soyadi}</td>
                  <td className="text-center">
                    <span className={`inline-flex w-5 h-5 rounded-full text-2xs font-bold items-center justify-center text-white ${g.cinsiyet === 'E' ? 'bg-sky-600' : 'bg-pink-600'}`}>{g.cinsiyet}</span>
                  </td>
                  <td className="num">{g.tc_kimlik_no || '—'}</td>
                  <td className="num">{g.oda_no ? `Oda ${g.oda_no} / Yatak ${g.yatak_no}` : <span className="text-rose-600">tahsis yok</span>}</td>
                  <td>
                    <select value={secim[i] || ''} onChange={e => { const v = e.target.value; setSecim(x => x.map((o, k) => k === i ? v : o)); setOdaSecim(''); }}
                      className={`${GIRDI} !w-64 ${secim[i] ? 'border-emerald-400 bg-emerald-50' : ''}`}>
                      <option value="">— yerleştirme —</option>
                      {secenekler(i).map(y => {
                        const s2 = odaSakinleri.get(y.odaId) || [];
                        return (
                          <option key={y.id} value={y.id}>
                            Oda {y.oda_no} / Yatak {y.yatak_no} · {y.kat}. kat{y.protokol ? ' · protokol' : ''}
                            {s2.length ? ` · odada ${s2.length} kişi` : ' · oda boş'}
                          </option>
                        );
                      })}
                    </select>
                  </td>
                  <td className="text-slate-600 max-w-[260px]">
                    {!secili ? '—' : sakin.length
                      ? sakin.map(x => `${x.yatak_no}: ${x.ad} (${x.cinsiyet})`).join(' · ')
                      : <span className="text-emerald-700">oda tamamen boş</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        {hatalar.map((h, i) => (
          <div key={i} className="px-2 py-1 rounded border bg-rose-50 border-rose-300 text-rose-800 text-2xs">⛔ {h}</div>
        ))}
        <div className="text-2xs text-slate-500">
          Listede yalnız <b>{tr(rz.gelis_tarihi)} – {tr(rz.cikis_tarihi)}</b> arasındaki {geceler.length} gecenin
          tamamında boş olan yataklar görünür; çıkış sonrası {TEMIZLIK_GUN} günlük temizlik boşluğu da hesaba katılmıştır.
        </div>
      </div>
    </Modal>
  );
}

function RezervasyonEkrani({ s, gonder, dolu, temizlik, acYeniKayit, izin, git, bolum }) {
  const [filtreBas, setFiltreBas] = useState(s.bugun);
  const [filtreSon, setFiltreSon] = useState(ekle(s.bugun, 21));
  const [statuFiltre, setStatuFiltre] = useState('BEKLEYEN');
  const [arama, setArama] = useState('');
  const [oneri, setOneri] = useState(null);
  const [onaylanan, setOnaylanan] = useState({});
  const [uyari, setUyari] = useState(null);
  const [surukleHedef, setSurukleHedef] = useState(null);
  const [seciliMisafir, setSeciliMisafir] = useState(null);
  const [geceGorunum, setGeceGorunum] = useState(null);
  const [isimli, setIsimli] = useState(true);
  const [manuel, setManuel] = useState(null);
  const [haritaTarihi, setHaritaTarihi] = useState(s.bugun);
  const [yatakDetay, setYatakDetay] = useState(null);

  const secili = s.seciliRezId;
  const setSecili = (id) => gonder({ tip: 'SECILI_REZ', rezId: id });
  const seciliRez = secili ? s.rezervasyonlar.find(r => r.id === secili) : null;

  useEffect(() => { setFiltreBas(s.bugun); setFiltreSon(ekle(s.bugun, 21)); setHaritaTarihi(s.bugun); }, [s.bugun]);
  useEffect(() => { if (!uyari) return; const t = setTimeout(() => setUyari(null), 5000); return () => clearTimeout(t); }, [uyari]);
  useEffect(() => { setSeciliMisafir(null); setGeceGorunum(null); }, [secili]);

  useEffect(() => {
    if (!s.odakRezId) return;
    const rz = s.rezervasyonlar.find(r => r.id === s.odakRezId);
    if (!rz) return;
    setStatuFiltre('HEPSI'); setArama('');
    if (rz.gelis_tarihi < filtreBas) setFiltreBas(rz.gelis_tarihi);
    if (rz.gelis_tarihi > filtreSon) setFiltreSon(rz.gelis_tarihi);
    setUyari({ tip: 'bilgi', metin: `${rz.rez_no} — ${rz.ad_soyad} kaydı açıldı (${statuAd(rz.statu)}). ` +
      (rz.misafirler.every(g => g.yatakId) ? 'Yatak tahsisi yapıldı.' : 'Yerleştirme için «Otomatik» veya «Manuel» düğmesini kullanabilirsiniz.') });
    gonder({ tip: 'ODAK_TEMIZLE' });
  }, [s.odakRezId]);

  const talepler = useMemo(() => s.rezervasyonlar.filter(rz => {
    if (rz.tesis !== s.tesis) return false;
    if (rz.gelis_tarihi < filtreBas || rz.gelis_tarihi > filtreSon) return false;
    if (statuFiltre === 'BEKLEYEN' && !['TALEP', 'PESINAT_BEKLENIYOR'].includes(rz.statu)) return false;
    if (statuFiltre === 'YERLESMEMIS' && rz.misafirler.every(g => g.yatakId)) return false;
    if (!['HEPSI', 'BEKLEYEN', 'YERLESMEMIS'].includes(statuFiltre) && rz.statu !== statuFiltre) return false;
    if (statuFiltre === 'HEPSI' && rz.statu === 'IPTAL') return false;
    if (arama) {
      const q = arama.toLocaleLowerCase('tr-TR');
      const havuz = (rz.ad_soyad + ' ' + rz.rez_no + ' ' + rz.aciklama + ' ' +
        rz.misafirler.map(g => g.adi_soyadi + ' ' + g.tc_kimlik_no).join(' ')).toLocaleLowerCase('tr-TR');
      if (!havuz.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => a.gelis_tarihi < b.gelis_tarihi ? -1 : a.gelis_tarihi > b.gelis_tarihi ? 1 : (a.rez_no < b.rez_no ? -1 : 1)),
    [s.rezervasyonlar, s.tesis, filtreBas, filtreSon, statuFiltre, arama]);

  const tesisYatak = useMemo(() => s.yataklar.filter(y => y.tesis === s.tesis), [s.yataklar, s.tesis]);
  const tesisOda = useMemo(() => s.odalar.filter(o => o.tesis === s.tesis), [s.odalar, s.tesis]);
  const katlar = useMemo(() => {
    const m = new Map();
    tesisOda.forEach(o => { if (!m.has(o.kat)) m.set(o.kat, []); m.get(o.kat).push(o); });
    return [...m.entries()].sort((a, b) => a[0] - b[0]);
  }, [tesisOda]);
  const geceler = useMemo(() => seciliRez ? aralik(seciliRez.gelis_tarihi, seciliRez.cikis_tarihi) : [], [seciliRez]);

  const musaitlik = useMemo(() => {
    if (!seciliRez) return null;
    const { dolu: d2, temizlik: t2 } = dolulukKur(s.rezervasyonlar.filter(r => r.id !== seciliRez.id));
    const gs = aralik(seciliRez.gelis_tarihi, seciliRez.cikis_tarihi);
    const harita = new Map();
    let tamSayi = 0;
    for (const y of tesisYatak) {
      let engel = 0;
      for (const t of gs) if (hucreDurumu(y.id, t, d2, t2)) engel++;
      harita.set(y.id, { tam: engel === 0, engel, gece: gs.length });
      if (!engel) tamSayi++;
    }
    return { harita, dolu: d2, temizlik: t2, gece: gs.length, tamSayi };
  }, [seciliRez, s.rezervasyonlar, tesisYatak]);

  const yerlesmemisSayi = talepler.filter(rz => rz.misafirler.some(g => !g.yatakId)).length;

  const otomatikYerlestir = (hedefListe) => {
    const hedef = (hedefListe || talepler).filter(rz => rz.misafirler.some(g => !g.yatakId) && !['IPTAL', 'CIKIS'].includes(rz.statu));
    if (!hedef.length) { setUyari({ tip: 'bilgi', metin: 'Yerleştirilecek talep bulunmuyor.' }); return; }
    const haricSet = new Set(hedef.map(r => r.id));
    const { dolu: d2, temizlik: t2 } = dolulukKur(s.rezervasyonlar.filter(r => !haricSet.has(r.id)));
    const t0 = performance.now();
    const sonuc = yerlestirmeMotoru(hedef, s.yataklar, s.odalar, d2, t2, {});
    sonuc.sure = Math.round(performance.now() - t0);
    setOneri(sonuc);
    const isaret = {}; sonuc.oneriler.forEach(o => isaret[o.rez.id] = true);
    setOnaylanan(isaret);
  };

  const onayla = () => {
    const secilenler = oneri.oneriler.filter(o => onaylanan[o.rez.id]);
    if (secilenler.length) gonder({ tip: 'ONERI_UYGULA', oneriler: secilenler });
    setOneri(null);
  };

  const yerlestir = (yatak, veri) => {
    if (!izin('rezervasyon.yerlestir')) { setUyari({ tip: 'hata', metin: yetkiNotu(s.kullanici, 'rezervasyon.yerlestir') }); return; }
    const rz = s.rezervasyonlar.find(r => r.id === veri.rezId);
    if (!rz) return;
    const { dolu: d2, temizlik: t2 } = dolulukKur(s.rezervasyonlar.filter(r => r.id !== rz.id));
    if (!yatakMusait(yatak.id, rz.gelis_tarihi, rz.cikis_tarihi, d2, t2)) {
      setUyari({ tip: 'hata', metin: `Oda ${yatak.oda_no} / Yatak ${yatak.yatak_no} — ${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)} aralığında müsait değil.` });
      return;
    }
    const oda = tesisOda.find(o => o.id === yatak.odaId);
    const cins = odaCinsiyetleri(yatak.odaId, rz.gelis_tarihi, rz.cikis_tarihi, tesisYatak, d2);
    const misafirCins = rz.misafirler[veri.misafirIndex].cinsiyet;
    if (!rz.aile && cins.size && !cins.has(misafirCins)) {
      setUyari({ tip: 'hata', metin: `Oda ${yatak.oda_no} karma konaklamaya kapalı — odada ${[...cins].map(c => c === 'E' ? 'erkek' : 'kadın').join('/')} misafir var.` });
      return;
    }
    if (oda && oda.protokol && !rz.protokol) setUyari({ tip: 'uyari', metin: `Oda ${yatak.oda_no} protokol odasıdır; yine de tahsis edildi.` });
    gonder({ tip: 'MANUEL_ATA', rezId: rz.id, misafirIndex: veri.misafirIndex, yatak });
    setSeciliMisafir(null);
  };

  const birak = (yatak) => (e) => {
    e.preventDefault(); setSurukleHedef(null);
    let veri; try { veri = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (_) { return; }
    yerlestir(yatak, veri);
  };

  const yatagaTikla = (yatak) => {
    if (!seciliRez) {
      const { durum, kayit } = yatakDurumu(yatak, haritaTarihi, dolu, temizlik);
      setYatakDetay({ yatak, tarih: haritaTarihi, durum, kayit });
      return;
    }
    const i = seciliMisafir != null ? seciliMisafir : seciliRez.misafirler.findIndex(g => !g.yatakId);
    if (i < 0) { setUyari({ tip: 'bilgi', metin: 'Bu talepteki tüm misafirler yerleştirilmiş. Değiştirmek için önce bir misafir kartına tıklayın.' }); return; }
    yerlestir(yatak, { rezId: seciliRez.id, misafirIndex: i });
  };

  const sayfa = sayfaBul(bolum);
  const uyariKutusu = uyari && (
    <div className={`px-3 py-2 rounded border text-xs bel mb-3 ${uyari.tip === 'hata' ? 'bg-rose-50 border-rose-300 text-rose-800'
      : uyari.tip === 'uyari' ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-ttk-50 border-ttk-200 text-ttk-800'}`}>
      {uyari.metin}
    </div>
  );

  /* ══ TALEPLER SAYFASI ══════════════════════════════════════════════════ */
  if (bolum === 'TALEPLER') {
    const odalar = seciliRez ? [...new Set(seciliRez.misafirler.filter(g => g.oda_no).map(g => g.oda_no))] : [];
    return (
      <div>
        <SayfaBasligi ikon={sayfa.ikon} baslik={sayfa.ad} aciklama={sayfa.aciklama}
          sag={<>
            {izin('rezervasyon.olustur') &&
              <Buton tur="basari" onClick={() => acYeniKayit({ tesis: s.tesis })}>
                <span className="flex items-center gap-1"><Ikon ad="yeni" sinif="w-3.5 h-3.5" /> Yeni Kayıt</span>
              </Buton>}
            <Buton tur="birincil" onClick={() => otomatikYerlestir()} disabled={!izin('rezervasyon.yerlestir')}
              title={izin('rezervasyon.yerlestir') ? 'Listedeki bekleyen talepler için öneri üret' : yetkiNotu(s.kullanici, 'rezervasyon.yerlestir')}>
              ⚙ Tümünü Otomatik Yerleştir
            </Buton>
          </>} />
        {uyariKutusu}

        <div className="bg-white border border-slate-200 rounded px-3 py-2.5 flex items-center gap-3 flex-wrap mb-3">
          <div className="flex items-center gap-1.5">
            <span className="text-2xs uppercase font-semibold text-slate-500">Geliş</span>
            <TarihGirdi deger={filtreBas} onChange={setFiltreBas} />
            <span className="text-slate-400 text-xs">–</span>
            <TarihGirdi deger={filtreSon} onChange={setFiltreSon} />
          </div>
          <select value={statuFiltre} onChange={e => setStatuFiltre(e.target.value)}
            className="border border-slate-300 rounded px-2 py-1 text-xs bg-white">
            <option value="BEKLEYEN">Bekleyen talepler</option>
            <option value="YERLESMEMIS">Yatağı olmayan kayıtlar</option>
            <option value="HEPSI">Tüm kayıtlar (iptal hariç)</option>
            {STATULER.map(x => <option key={x.kod} value={x.kod}>{x.ad}</option>)}
          </select>
          <input value={arama} onChange={e => setArama(e.target.value)} placeholder="Ad soyad / Tc kimlik / Rez. no ara…"
            className="border border-slate-300 rounded px-2 py-1 text-xs w-56" />
          <span className="text-xs text-slate-500 num ml-auto">
            <b className="text-ttk-800">{talepler.length}</b> kayıt · yerleştirilmemiş <b className="text-rose-600">{yerlesmemisSayi}</b>
          </span>
        </div>

        <div className="grid gap-3 items-start" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(28rem, 1fr))' }}>
          <Kart baslik="Talep Listesi" govdeSinif="p-0"
            sag={<span className="text-2xs text-slate-500">satıra tıklayın</span>}>
            <div className="max-h-[60vh] overflow-auto kaydir">
              <table className="veri w-full">
                <thead><tr>
                  <th>Adı Soyadı</th><th>Geliş / Çıkış</th><th className="text-center">Kişi</th>
                  <th className="text-center">Gün</th><th>Oda No</th><th>Statü</th>
                </tr></thead>
                <tbody>
                  {talepler.map(rz => {
                    const rzOdalar = [...new Set(rz.misafirler.filter(g => g.oda_no).map(g => g.oda_no))];
                    const eksik = rz.misafirler.some(g => !g.yatakId);
                    return (
                      <tr key={rz.id} onClick={() => setSecili(rz.id)}
                        onDoubleClick={() => izin('rezervasyon.yerlestir') && setManuel(rz)}
                        title="Tek tık: seç · Çift tık: manuel yerleştirme"
                        className={`cursor-pointer ${secili === rz.id ? 'secili' : ''} ${eksik ? 'bg-rose-50/40' : ''}`}>
                        <td className="max-w-[13rem] truncate font-semibold text-ttk-900" title={rz.ad_soyad + ' — ' + rz.aciklama}>
                          {rz.protokol && <span title="Protokol" className="text-violet-600 mr-1">★</span>}{rz.ad_soyad}
                        </td>
                        <td className="num">{tr(rz.gelis_tarihi).slice(0, 6)} – {tr(rz.cikis_tarihi)}</td>
                        <td className="num text-center">{rz.kisi_sayisi}{rz.aile && <span title="Aile / birlikte" className="text-amber-600 ml-0.5">⚭</span>}</td>
                        <td className="num text-center">{rz.gun_sayisi}</td>
                        <td className="num">{rzOdalar.length ? rzOdalar.join(', ') : <span className="text-rose-600 font-semibold">—</span>}</td>
                        <td><StatuRozet kod={rz.statu} kisa /></td>
                      </tr>
                    );
                  })}
                  {!talepler.length && <tr><td colSpan="6" className="text-center text-slate-400 py-6">Filtreye uyan talep yok.</td></tr>}
                </tbody>
              </table>
            </div>
          </Kart>

          <Kart baslik={seciliRez ? `Seçili Talep — ${seciliRez.rez_no}` : 'Seçili Talep'}>
            {!seciliRez ? <BosDurum metin="Soldaki listeden bir talep seçiniz." /> : (
              <div className="space-y-3">
                <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(9rem, 1fr))' }}>
                  {[['Rezerv Eden', seciliRez.ad_soyad],
                    ['Geliş / Çıkış', `${tr(seciliRez.gelis_tarihi)} – ${tr(seciliRez.cikis_tarihi)} (${seciliRez.gun_sayisi} gece)`],
                    ['Kişi / Özellik', `${seciliRez.kisi_sayisi} kişi${seciliRez.aile ? ' · aile' : ''}${seciliRez.protokol ? ' · protokol' : ''}`],
                    ['Kurum-Şahıs', seciliRez.kurum_sahis === 'KURUM' ? 'Kurum · ' + seciliRez.odeyecek : 'Şahıs'],
                    ['Ödeme Türü', ODEME_TURU[seciliRez.odeme_turu]],
                    ['Peşinat / Kalan', seciliRez.pesinat_tutari ? `${para(seciliRez.tahsil_edilen)} / ${para(Math.max(0, seciliRez.pesinat_tutari - seciliRez.tahsil_edilen))}` : 'Aranmıyor'],
                    ['Tel No', seciliRez.tel_no || '—'],
                    ['Açıklama', seciliRez.aciklama || '—'],
                    ['Tahsis Edilen Oda', odalar.length ? odalar.map(o => 'Oda ' + o).join(', ') : 'yerleştirilmedi'],
                    ['Statü', statuAd(seciliRez.statu)]].map(([kk, v]) => (
                    <div key={kk} className="bg-slate-50 border border-slate-200 rounded px-2 py-1.5 min-w-0">
                      <div className="text-2xs uppercase text-slate-500 font-semibold">{kk}</div>
                      <div className="num text-xs text-ttk-900 truncate" title={v}>{v}</div>
                    </div>
                  ))}
                </div>

                <div>
                  <div className="text-2xs uppercase font-semibold text-slate-500 mb-1">Misafirler</div>
                  <div className="space-y-1">
                    {seciliRez.misafirler.map((g, i) => (
                      <div key={i} className={`flex items-center gap-2 px-2 py-1.5 rounded border text-xs
                        ${g.yatakId ? 'bg-emerald-50 border-emerald-300' : 'bg-amber-50 border-amber-300'}`}>
                        <span className={`w-5 h-5 rounded-full text-2xs font-bold flex items-center justify-center text-white shrink-0 ${g.cinsiyet === 'E' ? 'bg-sky-600' : 'bg-pink-600'}`}>{g.cinsiyet}</span>
                        <span className="font-semibold text-ttk-900 truncate">{g.adi_soyadi}</span>
                        <span className="num text-slate-500">{g.tc_kimlik_no}</span>
                        <span className="num font-semibold ml-auto whitespace-nowrap">{g.oda_no ? `Oda ${g.oda_no} / Yatak ${g.yatak_no}` : 'yerleşmedi'}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex flex-wrap gap-2 pt-1 border-t border-slate-100">
                  <Buton tur="birincil" disabled={!izin('rezervasyon.yerlestir')} onClick={() => otomatikYerlestir([seciliRez])}
                    title={izin('rezervasyon.yerlestir') ? '' : yetkiNotu(s.kullanici, 'rezervasyon.yerlestir')}>⚙ Otomatik Yerleştir</Buton>
                  <Buton disabled={!izin('rezervasyon.yerlestir')} onClick={() => setManuel(seciliRez)}
                    title={izin('rezervasyon.yerlestir') ? 'Oda ve yatakları elle seç' : yetkiNotu(s.kullanici, 'rezervasyon.yerlestir')}>✋ Manuel Yerleştir</Buton>
                  <Buton disabled={!izin('rezervasyon.yerlestir')} onClick={() => git('ODALAR')}
                    title="Oda haritasında sürükleyerek yerleştir">🗺 Haritada Yerleştir</Buton>
                  {izin('rezervasyon.tahsis_kaldir') &&
                    <Buton tur="tehlike" onClick={() => gonder({ tip: 'ATAMA_KALDIR', rezId: seciliRez.id })}>Tahsisi Kaldır</Buton>}
                </div>
              </div>
            )}
          </Kart>
        </div>

        {manuel && <ManuelYerlestirme s={s} rz={s.rezervasyonlar.find(r => r.id === manuel.id) || manuel}
                     gonder={gonder} kapat={() => setManuel(null)} />}
        {oneri && <OneriPenceresi oneri={oneri} onaylanan={onaylanan} setOnaylanan={setOnaylanan}
                    kapat={() => setOneri(null)} onayla={onayla} izin={izin} kullanici={s.kullanici} />}
      </div>
    );
  }

  /* ══ ODA VE YATAK DURUMU SAYFASI ═══════════════════════════════════════ */
  const yerlestirmeModu = !!seciliRez;
  return (
    <div>
      <SayfaBasligi ikon={sayfa.ikon} baslik={sayfa.ad}
        aciklama={yerlestirmeModu
          ? `Yerleştirme modu — ${seciliRez.rez_no} · ${tr(seciliRez.gelis_tarihi)} – ${tr(seciliRez.cikis_tarihi)}`
          : sayfa.aciklama}
        sag={<>
          <GorunumSecici deger={isimli ? 'AD' : 'KOMPAKT'} ayarla={v => setIsimli(v === 'AD')} secenekler={[
            ['AD', 'İsimli', 'Yataklarda misafir adı yazar'], ['KOMPAKT', 'Kompakt', 'Yalnız yatak numaraları'],
          ]} />
          {!yerlestirmeModu && <>
            <Buton tur="sessiz" onClick={() => setHaritaTarihi(ekle(haritaTarihi, -1))}>◀</Buton>
            <TarihGirdi deger={haritaTarihi} onChange={setHaritaTarihi} />
            <Buton tur="sessiz" onClick={() => setHaritaTarihi(ekle(haritaTarihi, 1))}>▶</Buton>
          </>}
        </>} />
      {uyariKutusu}

      {yerlestirmeModu && (
        <div className="bg-ttk-50 border border-ttk-300 rounded p-3 mb-3 space-y-2">
          <div className="flex items-center gap-3 flex-wrap">
            <span className="font-bold text-ttk-900 text-sm">{seciliRez.ad_soyad}</span>
            <span className="num text-xs text-slate-600">{seciliRez.kisi_sayisi} kişi · {geceler.length} gece · {tr(seciliRez.gelis_tarihi)} – {tr(seciliRez.cikis_tarihi)}</span>
            <StatuRozet kod={seciliRez.statu} />
            <div className="ml-auto flex items-center gap-2 flex-wrap">
              <Buton onClick={() => setManuel(seciliRez)} disabled={!izin('rezervasyon.yerlestir')}>✋ Listeden Seç</Buton>
              <Buton tur="birincil" onClick={() => otomatikYerlestir([seciliRez])} disabled={!izin('rezervasyon.yerlestir')}>⚙ Otomatik</Buton>
              <Buton tur="sessiz" onClick={() => setSecili(null)}>Yerleştirmeyi Bitir</Buton>
            </div>
          </div>
          <div className="text-2xs uppercase font-semibold text-slate-500">
            Misafir kartına tıklayın, sonra haritada bir yatağa tıklayın (veya kartı yatağın üzerine sürükleyin)
          </div>
          <div className="flex flex-wrap gap-1.5">
            {seciliRez.misafirler.map((g, i) => (
              <div key={i} draggable
                onDragStart={e => { setSeciliMisafir(i); e.dataTransfer.setData('text/plain', JSON.stringify({ rezId: seciliRez.id, misafirIndex: i })); }}
                onClick={() => setSeciliMisafir(seciliMisafir === i ? null : i)}
                className={`cursor-grab active:cursor-grabbing border rounded px-2 py-1.5 text-xs flex items-center gap-2
                  ${seciliMisafir === i ? 'ring-2 ring-ttk-500 ' : ''}
                  ${g.yatakId ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-amber-300'}`}>
                <span className={`w-5 h-5 rounded-full text-2xs font-bold flex items-center justify-center text-white ${g.cinsiyet === 'E' ? 'bg-sky-600' : 'bg-pink-600'}`}>{g.cinsiyet}</span>
                <span className="font-semibold text-ttk-900">{g.adi_soyadi}</span>
                <span className="num font-semibold">{g.oda_no ? `Oda ${g.oda_no}/${g.yatak_no}` : 'yerleşmedi'}</span>
                {g.yatakId && izin('rezervasyon.tahsis_kaldir') &&
                  <button title="Tahsisi kaldır" onClick={e => { e.stopPropagation(); gonder({ tip: 'ATAMA_KALDIR', rezId: seciliRez.id, misafirIndex: i }); }}
                    className="text-rose-500 hover:text-rose-700 font-bold px-1">×</button>}
              </div>
            ))}
          </div>
          {geceler.length > 1 && (
            <div className="flex items-center gap-1 flex-wrap">
              <span className="text-2xs uppercase font-semibold text-slate-500 mr-1">Geceler</span>
              <button onClick={() => setGeceGorunum(null)}
                className={`px-2 py-0.5 rounded border text-2xs font-semibold ${!geceGorunum ? 'bg-ttk-600 text-white border-ttk-700' : 'bg-white text-ttk-700 border-slate-300'}`}>
                Tüm aralık
              </button>
              {geceler.map(t => (
                <button key={t} onClick={() => setGeceGorunum(t === geceGorunum ? null : t)}
                  className={`px-2 py-0.5 rounded border text-2xs font-semibold num ${geceGorunum === t ? 'bg-ttk-600 text-white border-ttk-700' : 'bg-white text-ttk-700 border-slate-300'}`}>
                  {tr(t).slice(0, 5)} <span className="opacity-70">{hg(t)}</span>
                </button>
              ))}
              <span className="text-2xs text-slate-500 ml-1">çıkış günü ({tr(seciliRez.cikis_tarihi)}) gecelenmez</span>
            </div>
          )}
        </div>
      )}

      <Kart govdeSinif="p-3"
        baslik={yerlestirmeModu
          ? (geceGorunum ? `${tr(geceGorunum)} ${hg(geceGorunum)} gecesi` : `${geceler.length} gecenin tamamında müsaitlik`)
          : `Oda / Yatak Durumu — ${tr(haritaTarihi)}`}
        sag={<div className="flex items-center gap-3 flex-wrap text-2xs text-slate-600">
          {yerlestirmeModu && !geceGorunum ? <>
            <span className="flex items-center gap-1"><i className="w-3 h-3 rounded-sm border border-emerald-400 bg-white inline-block" /> müsait</span>
            <span className="flex items-center gap-1"><i className="w-3 h-3 rounded-sm border border-amber-300 bg-amber-50 inline-block" /> kısmen dolu</span>
            <span className="flex items-center gap-1"><i className="w-3 h-3 rounded-sm border border-slate-300 bg-slate-200 inline-block" /> dolu</span>
            <span className="flex items-center gap-1"><i className="w-3 h-3 rounded-sm bg-emerald-600 inline-block" /> bu talebe tahsisli</span>
          </> : Object.entries(YATAK_DURUM).map(([kk, v]) => (
            <span key={kk} className="flex items-center gap-1"><i className={`w-3 h-3 rounded-sm inline-block border border-black/10 ${v.nokta}`} />{v.ad}</span>
          ))}
        </div>}>
        {yerlestirmeModu && musaitlik && (
          <div className={`mb-2 px-2 py-1.5 rounded border text-2xs
            ${musaitlik.tamSayi ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-800'}`}>
            <b className="num">{musaitlik.tamSayi}</b> yatak, konaklanacak {musaitlik.gece} gecenin
            ({geceler.map(t => tr(t).slice(0, 5)).join(', ')}) tamamında kesintisiz müsait
            {!musaitlik.tamSayi && ' — talebi bölmek veya tarihi değiştirmek gerekir.'}
          </div>
        )}
        <YatakHaritasi katlar={katlar} yataklar={tesisYatak} isimli={isimli} yukseklik="max-h-[62vh]"
          hucre={(y) => {
            let sinif, baslik, ad;
            const bende = seciliRez ? seciliRez.misafirler.find(g => g.yatakId === y.id) : null;
            if (yerlestirmeModu && musaitlik && geceGorunum) {
              const { durum, kayit } = yatakDurumu(y, geceGorunum, musaitlik.dolu, musaitlik.temizlik);
              const m = musaitlik.harita.get(y.id) || { tam: false };
              sinif = bende ? 'bg-emerald-600 border-emerald-700 text-white font-semibold' : YATAK_DURUM[durum].kutu;
              ad = bende ? bende.adi_soyadi : durum === 'TEMIZLIK' ? 'Temizlik'
                 : kayit && kayit.misafir ? kayit.misafir.adi_soyadi : (m.tam ? 'Müsait' : 'Boş');
              baslik = bende ? `${bende.adi_soyadi} — bu talebe tahsis edildi`
                : `${tr(geceGorunum)}: ${YATAK_DURUM[durum].ad}` +
                  (kayit && kayit.misafir ? ` — ${kayit.misafir.adi_soyadi}` : '');
            } else if (yerlestirmeModu && musaitlik) {
              const m = musaitlik.harita.get(y.id) || { tam: false, engel: 0, gece: 0 };
              const kismi = !m.tam && m.engel < m.gece;
              sinif = bende ? 'bg-emerald-600 border-emerald-700 text-white font-semibold'
                : m.tam ? 'bg-white border-emerald-400 text-emerald-700 hover:bg-emerald-50'
                : kismi ? 'bg-amber-50 border-amber-300 text-amber-800'
                : 'bg-slate-200 border-slate-300 text-slate-500';
              ad = bende ? bende.adi_soyadi : m.tam ? 'Müsait' : kismi ? `${m.engel}/${m.gece} gece dolu` : 'Dolu';
              baslik = bende ? `${bende.adi_soyadi} — bu talebe tahsis edildi`
                : m.tam ? `${m.gece} gecenin tamamında müsait — yerleştirmek için tıklayın`
                : `Kesintisiz müsait değil — ${m.gece} gecenin ${m.engel} tanesinde dolu/temizlikte`;
            } else {
              const { durum, kayit } = yatakDurumu(y, haritaTarihi, dolu, temizlik);
              sinif = YATAK_DURUM[durum].kutu;
              ad = durum === 'TEMIZLIK' ? 'Temizlik' : kayit && kayit.misafir ? kayit.misafir.adi_soyadi : 'Boş';
              baslik = `Oda ${y.oda_no} / Yatak ${y.yatak_no} — ${YATAK_DURUM[durum].ad}` +
                (kayit && kayit.misafir ? `\n${kayit.misafir.adi_soyadi} · ${tr(kayit.rez.gelis_tarihi)} – ${tr(kayit.rez.cikis_tarihi)}` : '\nTıklayın: kayıt detayı');
            }
            return {
              sinif, ad, baslik,
              ek: `cursor-pointer ${surukleHedef === y.id ? 'surukle-hedef' : ''}`,
              props: {
                onClick: () => yatagaTikla(y),
                onDragOver: e => { if (yerlestirmeModu) { e.preventDefault(); setSurukleHedef(y.id); } },
                onDragLeave: () => setSurukleHedef(null),
                onDrop: birak(y),
              },
            };
          }} />
      </Kart>

      {!yerlestirmeModu && (
        <div className="text-2xs text-slate-500 mt-2">
          Bir talebi yerleştirmek için «Rezervasyon Talepleri» sayfasından talep seçip «Haritada Yerleştir» deyin.
        </div>
      )}

      {yatakDetay && <YatakDetayModal detay={yatakDetay} kapat={() => setYatakDetay(null)}
        acYeniKayit={acYeniKayit} izin={izin} tesis={s.tesis} />}
      {manuel && <ManuelYerlestirme s={s} rz={s.rezervasyonlar.find(r => r.id === manuel.id) || manuel}
                   gonder={gonder} kapat={() => setManuel(null)} />}
      {oneri && <OneriPenceresi oneri={oneri} onaylanan={onaylanan} setOnaylanan={setOnaylanan}
                  kapat={() => setOneri(null)} onayla={onayla} izin={izin} kullanici={s.kullanici} />}
    </div>
  );
}

              <table className="veri w-full">

                  <th className="w-8"></th><th>Rez. No</th><th>Adı Soyadı</th><th>Geliş / Çıkış</th>

                      <td className="font-semibold text-ttk-900">{o.rez.protokol && <span className="text-violet-600 mr-1">★</span>}{o.rez.ad_soyad}</td>
                      <td className="num">{tr(o.rez.gelis_tarihi)} – {tr(o.rez.cikis_tarihi)}</td>

                      <td className="text-slate-600 max-w-[22rem] truncate" title={o.notlar.join(' · ')}>{o.notlar.join(' · ') || '—'}</td>

        </div>
        <div>

          {!oneri.basarisiz.length ? <div className="text-xs text-slate-500">Tüm talepler yerleştirildi.</div> : (
            <table className="veri w-full">
              <thead><tr><th>Rez. No</th><th>Adı Soyadı</th><th>Geliş / Çıkış</th><th className="text-center">Kişi</th><th>Gerekçe</th></tr></thead>
              <tbody>
                {oneri.basarisiz.map(b => (
                  <tr key={b.rez.id}>
                    <td className="num">{b.rez.rez_no.slice(4)}</td>
                    <td className="font-semibold text-ttk-900">{b.rez.ad_soyad}</td>
                    <td className="num">{tr(b.rez.gelis_tarihi)} – {tr(b.rez.cikis_tarihi)}</td>
                    <td className="num text-center">{b.rez.kisi_sayisi}</td>
