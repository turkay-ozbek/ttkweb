    etiket.textContent = `@page { size: A4 ${yon === 'yatay' ? 'landscape' : 'portrait'}; margin: 12mm; }`;
    document.body.classList.add('yazdiriliyor');

    window.addEventListener('afterprint', temizle);

    <Modal baslik="Yatak Listesini Yazdır" genislik="max-w-3xl" kapat={kapat}

        <div className="flex items-center gap-4 flex-wrap">
          <span className="text-2xs uppercase font-semibold text-slate-500">Kâğıt yönü</span>

            ['yatay', 'Yatay (A4 landscape)', 'Geniş tablolar sığar']].map(([kod, ad, not]) => (
            <label key={kod} data-ipucu={not}
              className={`flex items-center gap-2 px-3 py-2 rounded border cursor-pointer transition-colors
                ${yon === kod ? 'bg-ttk-50 border-ttk-400 text-ttk-800' : 'bg-white border-slate-300 text-slate-600'}`}>
              <input type="radio" name="yon" checked={yon === kod} onChange={() => setYon(kod)} />

/* ══════════════════════════════════════════════════════════════════════════
  11d) KAHVALTI TAKİBİ VE AY SONU BELGESİ
   Resepsiyon: her gün kahvaltıya inmeyen misafirleri işaretler.
   Muhasebe:   ay sonu hesabı için belgeyi resepsiyondan ister, hazırlanınca alır.
   ══════════════════════════════════════════════════════════════════════════ */

/* Bir tarihte o tesiste konaklayan misafirleri (kayıt + misafir sırası) döker */
function oGeceKonaklayanlar(s, tesisKod, tarih) {
  const liste = [];
  for (const rz of s.rezervasyonlar) {
    if (rz.tesis !== tesisKod || ['IPTAL'].includes(rz.statu)) continue;
    if (!(rz.gelis_tarihi <= tarih && tarih < rz.cikis_tarihi)) continue;
    rz.misafirler.forEach((g, i) => {
      if (!g.yatakId) return;
      liste.push({ anahtar: rz.id + '|' + i, rz, misafir: g, oda: g.oda_no, yatak: g.yatak_no });
    });
  }
  return liste.sort((a, b) => (a.oda - b.oda) || (a.yatak - b.yatak));
}

function KahvaltiEkrani({ s, gonder, izin }) {
  const sayfa = sayfaBul('KAHVALTI');
  const tesisAd = (TESISLER.find(t => t.kod === s.tesis) || {}).ad || '';
  const [tarih, setTarih] = useState(s.bugun);
  const [arama, setArama] = useState('');
  useEffect(() => setTarih(s.bugun), [s.bugun]);

  const duzenleyebilir = izin('kahvalti.isle');
  const kayitlar = useMemo(() => oGeceKonaklayanlar(s, s.tesis, tarih), [s.rezervasyonlar, s.tesis, tarih]);
  const gunKaydi = (s.kahvalti && s.kahvalti[s.tesis + '|' + tarih]) || {};
  const yapmayan = kayitlar.filter(k => gunKaydi[k.anahtar]).length;
  const q = aramaAnahtari(arama);
  const suzulmus = q ? kayitlar.filter(k => aramaAnahtari(k.misafir.adi_soyadi + ' ' + k.oda).includes(q)) : kayitlar;

  const isaretle = (anahtar, deger) =>
    gonder({ tip: 'KAHVALTI', tesis: s.tesis, tarih, anahtar, deger });

  return (
    <div className="space-y-3">
      <SayfaBasligi ikon={sayfa.ikon} baslik={sayfa.ad} aciklama={sayfa.aciklama} tesis={tesisAd}
        sag={<div className="flex items-center gap-1">
          <Buton tur="sessiz" onClick={() => setTarih(ekle(tarih, -1))} data-ipucu="Önceki gün">◀</Buton>
          <TarihGirdi deger={tarih} onChange={setTarih} bugun={s.bugun} enCok={ekle(s.bugun, 1)} />
          <Buton tur="sessiz" onClick={() => setTarih(ekle(tarih, 1))} data-ipucu="Sonraki gün">▶</Buton>
          {tarih !== s.bugun && <Buton tur="sessiz" onClick={() => setTarih(s.bugun)}>Bugün</Buton>}
        </div>} />

      {!duzenleyebilir && (
        <YetkiUyarisi metin="Bu sayfayı görüntüleyebilirsiniz; kahvaltı işaretlemesi resepsiyon görevlisi ve müdür tarafından yapılır." />
      )}

      <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(11rem, 100%), 1fr))' }}>
        <Kpi etiket="Konaklayan Misafir" deger={kayitlar.length} alt={tr(tarih)} />
        <Kpi etiket="Kahvaltı Yapmadı" deger={yapmayan} renk="text-rose-600" alt="işaretlenen misafir" />
        <Kpi etiket="Kahvaltı Verildi" deger={kayitlar.length - yapmayan} renk="text-emerald-700" alt="ücretlendirilecek" />
        <Kpi etiket="Ay Başından Beri" renk="text-ttk-700"

/* ── Ay sonu belgesi: muhasebe ister, resepsiyon hazırlar ───────────────── */
const AY_ADLARI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ayEtiketi = (ay) => `${AY_ADLARI[Number(ay.slice(5, 7)) - 1]} ${ay.slice(0, 4)}`;

/* Belgede yer alacak sayıları hesaplar */
function aySonuOzeti(s, tesisKod, ay) {
  const bas = ay + '-01';
  const sonGun = new Date(Date.UTC(Number(ay.slice(0, 4)), Number(ay.slice(5, 7)), 0)).getUTCDate();
  const son = `${ay}-${String(sonGun).padStart(2, '0')}`;
  const kapsam = s.rezervasyonlar.filter(rz => rz.tesis === tesisKod && rz.statu !== 'IPTAL' &&
    rz.gelis_tarihi <= son && rz.cikis_tarihi > bas);
  let gece = 0;
  for (const rz of kapsam) {
    const yerlesik = rz.misafirler.filter(g => g.yatakId).length;
    for (const t of aralik(rz.gelis_tarihi, rz.cikis_tarihi)) if (t >= bas && t <= son) gece += yerlesik;
  }
  let kahvaltisiz = 0;
  for (const [k, v] of Object.entries(s.kahvalti || {})) {
    const [tesis, gun] = k.split('|');
    if (tesis === tesisKod && gun >= bas && gun <= son) kahvaltisiz += Object.values(v).filter(Boolean).length;
  }
  const tahsilat = kapsam.reduce((a, rz) => a + (rz.tahsil_edilen || 0), 0);
  const bedel = kapsam.reduce((a, rz) => a + (rz.yatak_bedeli || 0), 0);
  const iptal = s.rezervasyonlar.filter(rz => rz.tesis === tesisKod && rz.statu === 'IPTAL' &&
    rz.gelis_tarihi >= bas && rz.gelis_tarihi <= son).length;
  return { bas, son, kayit: kapsam.length, gece, kahvalti: gece - kahvaltisiz, kahvaltisiz, tahsilat, bedel, iptal };
}

                    {r.durum === 'HAZIR' && <>

                </td>

                <td className="num">{r.isteyen}</td>

                <td className="num">{r.hazirlayan || '—'}</td>

      {goster && (
        <Modal baslik={`Ay Sonu Belgesi — ${ayEtiketi(goster.ay)}`} genislik="max-w-4xl" kapat={() => setGoster(null)}>
          <iframe src={goster.belge} title="Ay sonu belgesi" className="w-full h-[62vh] border border-slate-300 rounded" />
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
  11c) İPUCU KATMANI, KOMUT ARAMASI VE YARDIMCI BOT
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Tek merkezden yönetilen ipucu (tooltip) ───────────────────────────────
   Bir öğeye data-ipucu="..." yazmak yeterlidir; öğede yalnız title varsa o da
   devralınır (title kaldırılır ki tarayıcının kendi sarı balonu çıkmasın).
   Tarayıcının title balonundan farkı: gecikmesi tutarlı, okunaklı, ekran
   dışına taşmaz ve PASİF düğmelerde de çıkar — imlecin altındaki öğe
   elementFromPoint ile bulunur, çünkü disabled düğmeler fare olayı yaymaz.  */
function IpucuKatmani() {
  const [ipucu, setIpucu] = useState(null);
  const kutuRef = useRef(null);
  useEffect(() => {
    let zamanlayici = null, sonHedef = null, bekliyor = false;
    const gizle = () => { clearTimeout(zamanlayici); sonHedef = null; setIpucu(null); };
    /* title'ı olan öğeyi data-ipucu'ya çevirir; boş title'lar yok sayılır. */
    const devral = (hedef) => {
      const yerel = hedef.getAttribute('title');
      if (yerel && yerel.trim()) hedef.setAttribute('data-ipucu', yerel.trim());
      if (yerel !== null) hedef.removeAttribute('title');
    };
    const hesapla = (hedef) => {
      devral(hedef);
      const metin = hedef.getAttribute('data-ipucu');
      if (!metin) return gizle();
      const r = hedef.getBoundingClientRect();
      setIpucu({ metin, hedef: { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width } });
    };
    const kipirda = (e) => {
      if (bekliyor) return;
      bekliyor = true;
      requestAnimationFrame(() => {
        bekliyor = false;
        const alt = document.elementFromPoint(e.clientX, e.clientY);
        const hedef = alt && alt.closest ? alt.closest('[data-ipucu],[title]') : null;
        if (hedef === sonHedef) return;
        clearTimeout(zamanlayici);
        sonHedef = hedef;
        if (!hedef) return setIpucu(null);
        zamanlayici = setTimeout(() => hesapla(hedef), 400);
      });
    };
    const odak = (e) => {
      const hedef = e.target.closest ? e.target.closest('[data-ipucu],[title]') : null;
      clearTimeout(zamanlayici);
      if (!hedef) return setIpucu(null);
      sonHedef = hedef; hesapla(hedef);
    };
    document.addEventListener('mousemove', kipirda, { passive: true });
    document.addEventListener('mousedown', gizle);
    document.addEventListener('focusin', odak);
    document.addEventListener('focusout', gizle);
    window.addEventListener('scroll', gizle, true);
    window.addEventListener('blur', gizle);
    return () => {
      clearTimeout(zamanlayici);
      document.removeEventListener('mousemove', kipirda);
      document.removeEventListener('mousedown', gizle);
      document.removeEventListener('focusin', odak);
      document.removeEventListener('focusout', gizle);
      window.removeEventListener('scroll', gizle, true);
      window.removeEventListener('blur', gizle);
    };
  }, []);

  /* Balon önce görünmez çizilir, ölçülür, sonra tam yerine oturtulur; böylece
     açılırken kaymaz ve dar ekranda kenardan taşmaz. */
  useLayoutEffect(() => {
    const el = kutuRef.current;
    if (!el || !ipucu) return;
    const g = el.getBoundingClientRect();
    const r = ipucu.hedef, bosluk = 8;
    const altta = r.bottom + g.height + bosluk <= window.innerHeight;
    const sol = Math.min(Math.max(r.left + r.width / 2 - g.width / 2, bosluk), window.innerWidth - g.width - bosluk);
    const ust = altta ? r.bottom + bosluk : Math.max(bosluk, r.top - g.height - bosluk);
    el.style.left = Math.round(sol) + 'px';
    el.style.top = Math.round(ust) + 'px';
    el.style.visibility = 'visible';
  }, [ipucu]);

  if (!ipucu) return null;
  return (
    <div ref={kutuRef} role="tooltip" id="ipucu-balonu" style={{ left: 0, top: 0, visibility: 'hidden' }}
      className="fixed z-[60] pointer-events-none w-max max-w-[16rem] px-2.5 py-1.5 rounded-md
                 bg-ttk-900 text-white text-2xs leading-snug shadow-xl ipucu-bel print:hidden">
      {ipucu.metin}
    </div>
  );
}

/* Türkçe duyarlı arama anahtarı: küçük harfe indirir, şapka/noktaları sadeleştirir */
const aramaAnahtari = (x) => (x || '').toLocaleLowerCase('tr-TR')
  .replace(/[çğıöşüâî]/g, c => ({ 'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i' }[c]))
  .replace(/\s+/g, ' ').trim();

/* ── Komut araması: «Hangi işlemi yapmak istiyorsunuz?» ────────────────────
   Sayfalar, işlemler, rehber başlıkları ve kayıtlar tek kutudan aranır.    */
function KomutArama({ s, izin, git, gonder, acYeniKayit, tesisler, kapat }) {
  const [sorgu, setSorgu] = useState('');
  const [secili, setSecili] = useState(0);
  const girdiRef = useRef(null);
  useEffect(() => { girdiRef.current && girdiRef.current.focus(); }, []);

  const komutlar = useMemo(() => {
    const liste = [];
    /* Sayfalar */
    SAYFALAR.filter(x => izin(x.izin) && !x.gizli).forEach(x => liste.push({
      tur: 'Sayfa', ad: x.ad, aciklama: x.aciklama, ikon: x.ikon,
      anahtarlar: [x.kisa, x.grup, x.aciklama].join(' '),
      calistir: () => git(x.kod),
    }));
    liste.push({ tur: 'Sayfa', ad: 'Ana Menü', aciklama: 'Bütün sayfaların kart görünümü', ikon: 'menu',
      anahtarlar: 'anasayfa başlangıç menü', calistir: () => git('ANA_MENU') });

    /* İşlemler */
    if (izin('rezervasyon.olustur')) liste.push({
      tur: 'İşlem', ad: 'Yeni rezervasyon / kayıt aç', aciklama: 'Misafir kaydı girişi formunu açar', ikon: 'yeni',
      anahtarlar: 'ekle giris misafir kayit rezervasyon olustur yeni',
      calistir: () => { git('TALEPLER'); acYeniKayit({ tesis: s.tesis }); } });
    if (izin('pesinat.tahsilat')) liste.push({
      tur: 'İşlem', ad: 'Tahsilat bekleyenleri listele', aciklama: 'Peşinat ve Tahsilat sayfasını açar', ikon: 'para',
      anahtarlar: 'kapora pesinat para makbuz odeme tahsil', calistir: () => git('TAHSILAT') });
    if (izin('rezervasyon.dekont')) liste.push({
      tur: 'İşlem', ad: 'Kapora dekontu yükle', aciklama: 'Talebi seçip kapora şeridinden dekont ekleyin', ikon: 'onay',
      anahtarlar: 'dekont banka pdf belge yukle kapora', calistir: () => git('TALEPLER') });
    if (izin('rezervasyon.onay')) liste.push({
      tur: 'İşlem', ad: 'Onay bekleyen dekontlar', aciklama: 'Müdür onayı kuyruğunu açar', ikon: 'onay',
      anahtarlar: 'onayla reddet dekont mudur kuyruk', calistir: () => git('ONAY') });
    if (izin('rezervasyon.yerlestir')) liste.push({
      tur: 'İşlem', ad: 'Haritada yerleştirme', aciklama: 'Oda ve yatak haritasını açar', ikon: 'oda',
      anahtarlar: 'yatak oda yerlestir surukle harita tahsis', calistir: () => git('ODALAR') });
    liste.push({ tur: 'İşlem', ad: 'Kullanım rehberini aç', aciklama: 'Adım adım nasıl yapılır', ikon: 'rehber',
      anahtarlar: 'yardim nasil rehber kilavuz ogren', calistir: () => git('REHBER') });

    /* Misafirhane değiştirme */
    if (tesisler.length > 1) tesisler.forEach(t => liste.push({
      tur: 'Misafirhane', ad: t.ad + ' misafirhanesine geç', aciklama: `${t.sehir} · çalışılan misafirhaneyi değiştirir`,
      ikon: 'oda', anahtarlar: `${t.ad} ${t.sehir} tesis degistir gec`,
      calistir: () => gonder({ tip: 'TESIS', tesis: t.kod }) }));

    /* Rehber başlıkları */
    REHBER_KONULARI.forEach(k => liste.push({
      tur: 'Rehber', ad: k.baslik, aciklama: k.ozet, ikon: 'rehber',
      anahtarlar: k.ozet + ' ' + (k.adimlar || []).map(a => a.b).join(' '),
      calistir: () => git('REHBER', k.kod) }));

    /* Görünüm */
    liste.push({ tur: 'Görünüm', ad: 'Yazıyı büyüt', aciklama: 'Arayüz ölçeğini bir kademe artırır', ikon: 'buyut',
      anahtarlar: 'buyut zoom olcek yazi boyut okunmuyor kucuk',
      calistir: () => gonder({ tip: 'OLCEK', olcek: s.olcek + 0.05 }) });
    liste.push({ tur: 'Görünüm', ad: 'Yazıyı küçült', aciklama: 'Arayüz ölçeğini bir kademe azaltır', ikon: 'kucult',
      anahtarlar: 'kucult zoom olcek sigmiyor tasiyor',
      calistir: () => gonder({ tip: 'OLCEK', olcek: s.olcek - 0.05 }) });
    liste.push({ tur: 'Oturum', ad: 'Oturumu kapat', aciklama: 'Giriş ekranına döner', ikon: 'guc',
      anahtarlar: 'cikis logout kapat oturum', calistir: () => gonder({ tip: 'CIKIS' }) });
    return liste;
  }, [s.tesis, s.olcek, tesisler, izin]);

  const sonuclar = useMemo(() => {
    const q = aramaAnahtari(sorgu);
    if (!q) return komutlar.slice(0, 8);
    const puanla = (k) => {
      const ad = aramaAnahtari(k.ad), hepsi = aramaAnahtari(k.ad + ' ' + k.aciklama + ' ' + k.anahtarlar);
      if (ad.startsWith(q)) return 3;
      if (ad.includes(q)) return 2;
      if (q.split(' ').every(p => hepsi.includes(p))) return 1;
      return 0;
    };
    const bulunan = komutlar.map(k => ({ k, p: puanla(k) })).filter(x => x.p > 0)
      .sort((a, b) => b.p - a.p).map(x => x.k).slice(0, 8);

    /* Kayıt araması — ad soyad, Tc kimlik no, rezervasyon no */
    if (q.length >= 3) {
      const kayitlar = s.rezervasyonlar.filter(rz => tesisler.some(t => t.kod === rz.tesis))
        .filter(rz => aramaAnahtari(rz.ad_soyad + ' ' + rz.rez_no + ' ' +
                        rz.misafirler.map(g => g.adi_soyadi + ' ' + g.tc_kimlik_no).join(' ')).includes(q))
        .slice(0, 5)
        .map(rz => ({
          tur: 'Kayıt', ad: rz.ad_soyad, ikon: 'talep',
          aciklama: `${rz.rez_no} · ${tr(rz.gelis_tarihi)} – ${tr(rz.cikis_tarihi)} · ${statuAd(rz.statu)}`,
          calistir: () => gonder({ tip: 'REZ_ODAKLA', rezId: rz.id }),
        }));
      return [...bulunan, ...kayitlar];
    }
    return bulunan;
  }, [sorgu, komutlar, s.rezervasyonlar, tesisler]);

  useEffect(() => { setSecili(0); }, [sorgu]);

  const sec = (k) => { if (!k) return; k.calistir(); kapat(); };
  const tus = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSecili(i => Math.min(i + 1, sonuclar.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); setSecili(i => Math.max(i - 1, 0)); }
    if (e.key === 'Enter')     { e.preventDefault(); sec(sonuclar[secili]); }
    if (e.key === 'Escape')    { e.preventDefault(); kapat(); }
  };

  let oncekiTur = null;
  return (
    <div className="fixed inset-0 z-50 bg-ttk-900/40 flex items-start justify-center p-6 overflow-auto"
      onMouseDown={e => { if (e.target === e.currentTarget) kapat(); }}>
      <div className="bg-white rounded-lg shadow-2xl w-full max-w-2xl mt-10 bel overflow-hidden"
        onMouseDown={e => e.stopPropagation()}>
        <div className="flex items-center gap-2 px-3 py-2.5 border-b border-slate-200">
          <Ikon ad="ara" sinif="w-5 h-5 text-ttk-600" />
          <input ref={girdiRef} value={sorgu} onChange={e => setSorgu(e.target.value)} onKeyDown={tus}
            placeholder="Hangi işlemi yapmak istiyorsunuz?" aria-label="İşlem ara"
            className="flex-1 text-sm outline-none placeholder:text-slate-400" />
          <kbd className="text-2xs num text-slate-400 border border-slate-300 rounded px-1.5 py-0.5">Esc</kbd>
        </div>
        <div className="max-h-[52vh] overflow-auto kaydir py-1">
          {!sonuclar.length && (
            <div className="px-4 py-6 text-center text-xs text-slate-500">
              «{sorgu}» için sonuç yok. Sayfa adı, işlem (örn. <b>tahsilat</b>, <b>dekont</b>),
              misafir adı, Tc kimlik no veya rezervasyon no yazabilirsiniz.
            </div>
          )}
          {sonuclar.map((k, i) => {
            const baslik = k.tur !== oncekiTur ? (oncekiTur = k.tur) : null;
            return (
              <Fragment key={k.tur + k.ad + i}>
                {baslik && <div className="px-3 pt-2 pb-1 text-2xs font-bold uppercase tracking-wider text-slate-400">{baslik}</div>}
                <button onClick={() => sec(k)} onMouseEnter={() => setSecili(i)}
                  aria-selected={i === secili}
                  className={`w-full text-left px-3 py-2 flex items-center gap-2.5 transition-colors
                    ${i === secili ? 'bg-ttk-50' : 'hover:bg-slate-50'}`}>
                  <span className={`w-7 h-7 rounded shrink-0 flex items-center justify-center
                    ${i === secili ? 'bg-ttk-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                    <Ikon ad={k.ikon} sinif="w-4 h-4" />
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-sm font-semibold text-ttk-900 truncate">{k.ad}</span>
                    <span className="block text-2xs text-slate-500 truncate">{k.aciklama}</span>
                  </span>
                  {i === secili && <kbd className="text-2xs num text-slate-400 border border-slate-300 rounded px-1.5 py-0.5">↵</kbd>}
                </button>
              </Fragment>
            );
          })}
        </div>
        <div className="px-3 py-1.5 border-t border-slate-200 bg-slate-50 text-2xs text-slate-500 flex gap-3 flex-wrap">
          <span><b>↑ ↓</b> gezin</span><span><b>↵</b> seç</span><span><b>Esc</b> kapat</span>
          <span className="ml-auto">Her yerden <b>Ctrl + K</b> ile açılır</span>
        </div>
      </div>
    </div>
  );
}

/* ── Yardımcı botun yanıt üreteci ──────────────────────────────────────────
   Bu prototipte dış bir yapay zekâ servisine bağlanılmaz; yanıtlar ekrandaki
   canlı veriden ve kullanım rehberinden kural tabanlı üretilir. Kurulumda
   yerine kurumsal bir dil modeli servisi konabilir.                        */
function botYanit(soru, b) {
  const q = aramaAnahtari(soru);
  const gecer = (...kelimeler) => kelimeler.some(k => q.includes(k));
  const sayfaEylemi = (kod) => { const sf = sayfaBul(kod); return sf && b.izin(sf.izin) ? [{ ad: sf.ad + ' sayfasını aç', ekran: kod }] : []; };

  if (!q) return { metin: 'Bir şey yazın; size yardımcı olayım.' };

  if (gecer('merhaba', 'selam', 'gunaydin', 'iyi gunler', 'kolay gelsin'))
    return { metin: `Merhaba ${b.kullaniciAdi}. ${b.tesisAd} için buradayım. «Bugün kaç yatak boş?», «kapora nasıl işlenir?» ya da «yeni kayıt nasıl açılır?» diye sorabilirsiniz.` };

  if (gecer('tesekkur', 'sagol', 'sag ol', 'eyvallah'))
    return { metin: 'Rica ederim. Başka bir konuda da sorabilirsiniz.' };

  /* ── Canlı veri soruları ── */
  if (gecer('bos yatak', 'kac yatak', 'yer var', 'yerimiz var', 'doluluk', 'dolu mu', 'bos yer'))
    return {
      metin: `${b.tesisAd} bugün ${b.canli.dolu}/${b.canli.kapasite} yatak dolu (%${b.canli.oran}). ` +
             `${b.canli.bos} yatak boş, ${b.canli.temizlik} yatak temizlik bloğunda. ` +
             `İleri bir tarih aralığı için «Doluluk Takvimi» sayfasında kesintisiz boş yatak hesaplanır.`,
      eylemler: [...sayfaEylemi('OZET'), ...sayfaEylemi('TAKVIM')],
    };

  if (gecer('bugun giris', 'giris yapacak', 'kim geliyor', 'gelen misafir'))
    return { metin: `Bugün ${b.canli.giris} misafir giriş, ${b.canli.cikis} misafir çıkış yapacak. ` +
                    `Listeleri «Peşinat ve Tahsilat» sayfasındaki «Bugün giriş» ve «Bugün çıkış» kutularından görebilirsiniz.`,
             eylemler: sayfaEylemi('TAHSILAT') };
  if (gecer('bugun cikis', 'cikis yapacak', 'kim gidiyor'))
    return { metin: `Bugün ${b.canli.cikis} misafir çıkış yapacak. Çıkıştan sonra her yatak ${TEMIZLIK_GUN} gün temizlik için bloklanır.`,
             eylemler: sayfaEylemi('TAHSILAT') };

  if (gecer('bekleyen talep', 'talep bekl', 'yerlestirilmemis', 'yerlestirme bekleyen', 'kac talep'))
    return { metin: `${b.tesisAd} için 21 gün içinde yerleştirme bekleyen ${b.canli.bekleyen} talep var. ` +
                    `«Rezervasyon Talepleri» sayfasında «⚙ Tümünü Otomatik Yerleştir» ile toplu öneri alabilirsiniz; öneri onaylanmadan doluluk değişmez.`,
             eylemler: sayfaEylemi('TALEPLER') };

  if (gecer('onay bekleyen', 'onaydaki dekont', 'kac dekont', 'onay kuyrugu'))
    return { metin: `Müdür onayı bekleyen ${b.canli.onayBekleyen} dekont var.` +
                    (b.izin('rezervasyon.onay') ? ' «Dekont ve Onay» sayfasından inceleyip onaylayabilirsiniz.'
                                                : ' Onay yetkisi misafirhane müdüründedir.'),
             eylemler: sayfaEylemi('ONAY') };

  if (gecer('tahsilat bekleyen', 'kac tahsilat', 'odenmemis', 'borclu'))
    return { metin: `Tahsilat bekleyen ${b.canli.tahsilat} kayıt var. «Peşinat ve Tahsilat» sayfasında «Tahsilat bekleyen» kutusuna tıklayın; satırdaki «₺ Tahsilat Al» ile tutarı ve makbuz numarasını girin.`,
             eylemler: sayfaEylemi('TAHSILAT') };

  if (gecer('kahvalti')) {
    const anahtar = b.tesisKod + '|' + b.bugun;
    const yapmayan = Object.values((b.kahvalti || {})[anahtar] || {}).filter(Boolean).length;
    return { metin: `Bugün ${b.canli.konaklayan} kayıt konaklıyor; kahvaltıya inmeyen olarak ${yapmayan} misafir işaretlenmiş. ` +
                    `Yoklamayı «Kahvaltı Takibi» sayfasından resepsiyon görevlisi işler; sayılar ay sonu belgesine aynen geçer.`,
             eylemler: sayfaEylemi('KAHVALTI') };
  }
  if (gecer('ay sonu', 'belge talep', 'rapor'))
    return { metin: `Ay sonu belgesini muhasebe ister, resepsiyon hazırlar. Şu anda ${b.canli.bekleyenRapor} bekleyen talep var. ` +
                    `«Ay Sonu Belgesi» sayfasında dönem seçilip «Belgeyi İste» denir; hazırlanınca PDF olarak indirilir.`,
             eylemler: sayfaEylemi('AY_SONU') };
  if (gecer('kac kisi kaliyor', 'konaklayan', 'su an kalan'))
    return { metin: `${b.tesisAd} misafirhanesinde hâlen ${b.canli.konaklayan} kayıt konaklıyor. Kimin hangi yatakta olduğunu «Yatak Listesi» sayfasında görebilirsiniz.`,
             eylemler: sayfaEylemi('YATAK_LISTESI') };

  /* ── Kapora kuralı ── */
  if (gecer('kapora ne kadar', 'kapora tutari', 'kapora hesap', 'pesinat ne kadar', 'kapora kurali')) {
    const k = b.kural || {};
    const tutar = k.kaporaTuru === 'GECE'
      ? `ilk ${k.kaporaGece} gecenin yatak bedeli (asgari ${para(k.sahisAsgariTutar)})`
      : `toplam bedelin %${k.sahisOran}'i (asgari ${para(k.sahisAsgariTutar)})`;
    return { metin: `${b.tesisAd} kuralına göre şahsi misafirde kapora ${tutar}. Ödeme süresi ${k.odemeSuresiGun} gün; ` +
                    `gelişten en geç ${k.gelistenOnceEnGecGun} gün önce yatırılmalı. ` +
                    (k.kurumMisafirindePesinatAranmasin ? 'Kurum misafirinden kapora aranmıyor.' : 'Kurum misafirinden de kapora alınıyor.') +
                    ' Kuralı «Peşinat ve Tahsilat» sayfasının altından misafirhane müdürü değiştirir.',
             eylemler: sayfaEylemi('TAHSILAT') };
  }

  /* ── Yetki sorusu ── */
  if (gecer('ne yapabilirim', 'yetkim', 'yetkilerim', 'neden yapamiyorum', 'dugme pasif', 'buton pasif')) {
    const acik = IZINLER.filter(iz => b.izin(iz.kod)).map(iz => iz.ad);
    return { metin: `${b.rolAdi} rolündesiniz. Yapabildikleriniz: ${acik.join(', ')}. ` +
                    `Pasif bir düğmenin üzerine gelirseniz hangi yetkinin gerektiği ipucu olarak yazar.`,
             eylemler: sayfaEylemi('REHBER').length ? [{ ad: 'Rehberde rol yetkilerini gör', ekran: 'REHBER', konu: 'ROLLER' }] : [] };
  }

  /* ── Misafir arama ── */
  if (gecer('nerede kaliyor', 'hangi odada', 'kacinci odada', 'hangi yatakta')) {
    const isim = soru.replace(/nerede kal[ıi]yor|hangi odada|ka[çc][ıi]nc[ıi] odada|hangi yatakta|\?/gi, '').trim();
    const bulunan = isim.length >= 3 ? b.kayitlar.filter(rz =>
      aramaAnahtari(rz.ad_soyad + ' ' + rz.misafirler.map(g => g.adi_soyadi).join(' ')).includes(aramaAnahtari(isim))) : [];
    if (!bulunan.length)
      return { metin: `«${isim || soru}» için kayıt bulamadım. Üst bandaki arama kutusuna (Ctrl + K) ad soyad, Tc kimlik no veya rezervasyon no yazarak da arayabilirsiniz.` };
    const satirlar = bulunan.slice(0, 4).flatMap(rz => rz.misafirler.map(g =>
      `${g.adi_soyadi} — ${g.oda_no ? `Oda ${g.oda_no} / Yatak ${g.yatak_no}` : 'henüz yatak tahsis edilmedi'} (${statuAd(rz.statu)})`));
    return { metin: satirlar.join('\n'), eylemler: sayfaEylemi('YATAK_LISTESI') };
  }

  /* ── «Nasıl yapılır» soruları: kullanım rehberinden ── */
  /* «Nasıl yapılır» eşleştirmesi: Türkçe çekim ekleri yüzünden serbest metin
     karşılaştırması yanıltıcı olduğundan her rehber başlığının kendi anahtar
     kelimeleri var. Eşitlik hâlinde başlık ve gövde metnindeki kök eşleşmesi
     ayırt edici olur.                                                          */
  const konuPuani = (k) => {
    const anahtar = (k.anahtarlar || []).filter(x => q.includes(x)).length;
    const kokler = q.split(' ').filter(x => x.length > 4).map(x => x.slice(0, x.length - 2));
    const metin = aramaAnahtari(k.baslik + ' ' + k.ozet + ' ' + (k.adimlar || []).map(a => a.b).join(' '));
    const kok = kokler.filter(x => metin.includes(x)).length;
    return anahtar * 10 + kok;
  };
  const enIyi = REHBER_KONULARI.map(k => ({ k, p: konuPuani(k) })).sort((a, b2) => b2.p - a.p)[0];
  if (enIyi && enIyi.p >= 10 && enIyi.k.adimlar) {
    const adimlar = enIyi.k.adimlar.slice(0, 4).map((a, i) => `${i + 1}. ${a.b} — ${a.m}`).join('\n');
    return {
      metin: `**${enIyi.k.baslik}**\n${adimlar}` +
             (enIyi.k.adimlar.length > 4 ? `\n… ${enIyi.k.adimlar.length - 4} adım daha rehberde.` : ''),
      eylemler: [{ ad: 'Rehberde tamamını oku', ekran: 'REHBER', konu: enIyi.k.kod },
                 ...(enIyi.k.sayfa ? sayfaEylemi(enIyi.k.sayfa) : [])],
    };
  }

  /* ── Sayfaya götürme ── */
  const sayfa = SAYFALAR.filter(x => b.izin(x.izin))
    .find(x => q.includes(aramaAnahtari(x.ad)) || q.includes(aramaAnahtari(x.kisa)));
  if (sayfa) return { metin: `«${sayfa.ad}» sayfası: ${sayfa.aciklama}.`, eylemler: sayfaEylemi(sayfa.kod) };

  return {
    metin: 'Bunu tam anlayamadım. Şunları sorabilirsiniz: «bugün kaç yatak boş?», «kapora nasıl işlenir?», ' +
           '«yeni kayıt nasıl açılır?», «dekont nasıl onaylanır?», «yetkilerim neler?». ' +
           'İşlem aramak için üstteki kutuyu (Ctrl + K) da kullanabilirsiniz.',
    eylemler: [{ ad: 'Kullanım rehberini aç', ekran: 'REHBER' }],
  };
}

const BOT_ONERILERI = ['Bugün kaç yatak boş?', 'Kapora nasıl işlenir?', 'Yeni kayıt nasıl açılır?',
                       'Dekont nasıl onaylanır?', 'Yetkilerim neler?'];

/* ── Yardımcı bot penceresi ────────────────────────────────────────────── */
/* Bulunulan sayfaya göre önerilen sorular — yardımcının işe yaradığı hemen görülsün */
const SAYFA_ONERILERI = {
  OZET:          ['Bugün kaç yatak boş?', 'Bugün kaç giriş var?', 'Kaç dekont onay bekliyor?'],
  TAKVIM:        ['Bugün kaç yatak boş?', 'Boş yatak nasıl aranır?'],
  ODALAR:        ['Misafiri odaya nasıl yerleştiririm?', 'Bugün kaç yatak boş?'],
  YATAK_LISTESI: ['Kaç kişi kalıyor?', 'Misafiri odaya nasıl yerleştiririm?'],
  TALEPLER:      ['Yeni kayıt nasıl açılır?', 'Kaç talep bekliyor?', 'Misafiri odaya nasıl yerleştiririm?'],
  ONAY:          ['Dekont nasıl onaylanır?', 'Kaç dekont onay bekliyor?'],
  TAHSILAT:      ['Kapora nasıl işlenir?', 'Kapora tutarı ne kadar?', 'Tahsilat bekleyen kaç kayıt var?'],
  STATU:         ['Misafir çıkışı nasıl yapılır?', 'Kaç kişi kalıyor?'],
  KAHVALTI:      ['Kahvaltı yoklaması nasıl işlenir?', 'Kaç kişi kalıyor?'],
  AY_SONU:       ['Ay sonu belgesi nasıl hazırlanır?', 'Tahsilat bekleyen kaç kayıt var?'],
};

function YardimBotu({ s, izin, git, dolu, temizlik, acik, setAcik }) {
  const [gecmis, setGecmis] = useState([]);
  const [girdi, setGirdi] = useState('');
  const [yaziyor, setYaziyor] = useState(false);
  const [genis, setGenis] = useState(false);
  const oneriler = SAYFA_ONERILERI[s.ekran] || BOT_ONERILERI;
  const altRef = useRef(null);
  const tesisAd = (TESISLER.find(t => t.kod === s.tesis) || {}).ad || 'Misafirhane';

  const baglam = useMemo(() => {
    const yataklar = s.yataklar.filter(y => y.tesis === s.tesis);
    let doluSayi = 0, temizlikSayi = 0;
    for (const y of yataklar) {
      if (dolu.has(y.id + '|' + s.bugun)) doluSayi++;
      else if (temizlik.has(y.id + '|' + s.bugun)) temizlikSayi++;
    }
    const kayitlar = s.rezervasyonlar.filter(r => r.tesis === s.tesis);
    const ufuk = ekle(s.bugun, 21);
    return {
      kullaniciAdi: s.kullanici.ad, rolAdi: rolAd(s.kullanici.rol), tesisAd, izin, kayitlar,
      kural: s.kurallar[s.tesis], tesisKod: s.tesis, bugun: s.bugun, kahvalti: s.kahvalti,
      canli: {
        kapasite: yataklar.length, dolu: doluSayi, temizlik: temizlikSayi,
        bos: yataklar.length - doluSayi - temizlikSayi,
        oran: yataklar.length ? Math.round(doluSayi / yataklar.length * 100) : 0,
        giris: kayitlar.filter(r => r.gelis_tarihi === s.bugun && r.statu !== 'IPTAL').length,
        cikis: kayitlar.filter(r => r.cikis_tarihi === s.bugun && r.statu !== 'IPTAL').length,
        bekleyen: kayitlar.filter(r => ['TALEP', 'PESINAT_BEKLENIYOR'].includes(r.statu) &&
          r.gelis_tarihi >= s.bugun && r.gelis_tarihi <= ufuk && r.misafirler.some(g => !g.yatakId)).length,
        onayBekleyen: kayitlar.filter(r => r.dekont && r.dekont.durum === 'YUKLENDI').length,
        tahsilat: kayitlar.filter(r => !['IPTAL', 'CIKIS'].includes(r.statu) && (r.pesinat_tutari || 0) > (r.tahsil_edilen || 0)).length,
        konaklayan: kayitlar.filter(r => r.statu === 'KONAKLIYOR').length,
        bekleyenRapor: (s.raporlar || []).filter(r => r.tesis === s.tesis && r.durum === 'TALEP').length,
      },
    };
  }, [s.rezervasyonlar, s.yataklar, s.tesis, s.bugun, s.kurallar, dolu, temizlik]);

  useEffect(() => {
    if (acik && !gecmis.length)
      setGecmis([{ kim: 'bot', metin: `Merhaba ${s.kullanici.ad}, ${tesisAd} için yardımcı olabilirim — doluluk sorabilir, bir işlemin nasıl yapıldığını öğrenebilirsiniz.` }]);
  }, [acik]);
  useEffect(() => { altRef.current && altRef.current.scrollIntoView({ block: 'end' }); }, [gecmis, yaziyor, acik]);

  const sor = (metin) => {
    const soru = (metin || girdi).trim();
    if (!soru) return;
    setGecmis(g => [...g, { kim: 'ben', metin: soru }]);
    setGirdi(''); setYaziyor(true);
    setTimeout(() => {
      const y = botYanit(soru, baglam);
      setGecmis(g => [...g, { kim: 'bot', ...y }]);
      setYaziyor(false);
    }, 320);
  };

  if (!acik) return null;
  return (
    <div className={`fixed right-3 bottom-[9.5rem] z-40 bg-white rounded-2xl shadow-2xl border-2 border-ttk-600
                    flex flex-col overflow-hidden bel print:hidden
                    ${genis ? 'w-[min(34rem,calc(100vw-1.5rem))]' : 'w-[min(27rem,calc(100vw-1.5rem))]'}`}
      role="dialog" aria-label="Yardımcı bot">
      <header className="flex items-center gap-2.5 px-3 py-2.5 bg-ttk-800 text-white shrink-0">
        <span className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center shrink-0">
          <Maskot sinif="w-10 h-10" />
        </span>
        <div className="leading-tight min-w-0 flex-1">
          <div className="text-base font-bold">Madenci</div>
          <div className="text-2xs text-ttk-200 truncate flex items-center gap-1">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block" />
            {tesisAd} · misafirhane yardımcısı
          </div>
        </div>
        <button onClick={() => setGenis(x => !x)} aria-label={genis ? 'Küçült' : 'Genişlet'}
          data-ipucu={genis ? 'Pencereyi küçült' : 'Pencereyi genişlet'}
          className="text-white/80 hover:text-white px-1.5 py-0.5 rounded hover:bg-white/10 text-sm">
          {genis ? '⤡' : '⤢'}
        </button>
        <button onClick={() => setAcik(false)} aria-label="Yardımcıyı kapat" data-ipucu="Yardımcıyı kapat"
          className="text-white/80 hover:text-white text-xl leading-none px-1.5 rounded hover:bg-white/10">×</button>
      </header>

      <div className={`flex-1 overflow-auto kaydir p-3 space-y-3 bg-slate-50 ${genis ? 'max-h-[64vh]' : 'max-h-[52vh]'}`}>
        {gecmis.map((m, i) => (
          <div key={i} className={`flex gap-2 ${m.kim === 'ben' ? 'justify-end' : ''}`}>
            {m.kim === 'bot' && <Maskot sinif="w-8 h-8 shrink-0 mt-0.5" />}
            <div className={`max-w-[85%] rounded-xl px-3 py-2 text-[0.8rem] leading-relaxed whitespace-pre-line shadow-sm
              ${m.kim === 'ben' ? 'bg-ttk-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}`}>
              {m.metin.split('**').map((p, j) => j % 2 ? <b key={j} className="text-ttk-800">{p}</b> : p)}
              {m.eylemler && m.eylemler.length > 0 && (
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {m.eylemler.map((e, j) => (
                    <button key={j} onClick={() => { git(e.ekran, e.konu); setAcik(false); }}
                      className="px-2 py-1 rounded border border-ttk-300 bg-ttk-50 text-ttk-800 text-2xs font-semibold hover:bg-ttk-100">
                      {e.ad} →
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        ))}
        {yaziyor && (
          <div className="flex gap-2">
            <Maskot sinif="w-8 h-8 shrink-0 mt-0.5" />
            <div className="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-400 flex gap-1 items-center shadow-sm">
              {[0, 1, 2].map(i => (
                <span key={i} className="w-1.5 h-1.5 rounded-full bg-slate-400"
                  style={{ animation: `ipucuBel .6s ease-in-out ${i * 0.15}s infinite alternate` }} />
              ))}
            </div>
          </div>
        )}
        <div ref={altRef} />
      </div>

      <div className="px-3 py-2 border-t border-slate-200 bg-white shrink-0">
        <div className="text-[0.6rem] uppercase tracking-wider font-bold text-slate-400 mb-1.5">
          {oneriler === BOT_ONERILERI ? 'Sık sorulanlar' : 'Bu sayfada sorulabilecekler'}
        </div>
        <div className="flex flex-wrap gap-1.5">
          {oneriler.map(o => (
            <button key={o} onClick={() => sor(o)}
              className="px-2.5 py-1 rounded-full border border-ttk-200 bg-ttk-50 text-2xs text-ttk-800 font-medium
                         hover:bg-ttk-100 hover:border-ttk-400 transition-colors">
              {o}
            </button>
          ))}
          {gecmis.length > 1 && (
            <button onClick={() => setGecmis(g => g.slice(0, 1))}
              className="px-2.5 py-1 rounded-full border border-slate-300 text-2xs text-slate-500 hover:text-rose-700 hover:border-rose-300 ml-auto">
              Sohbeti temizle
            </button>
          )}
        </div>
      </div>

      <div className="flex items-center gap-2 p-2.5 border-t border-slate-200 bg-white shrink-0">
        <input value={girdi} onChange={e => setGirdi(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') sor(); }}
          placeholder="Sorunuzu yazın…" aria-label="Yardımcıya soru yazın"
          className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-[0.8rem] focus:outline-none focus:ring-2 focus:ring-ttk-300" />
        <Buton tur="birincil" className="!px-4 !py-2" onClick={() => sor()} disabled={!girdi.trim()}
          data-ipucu="Soruyu gönder (Enter)">Gönder</Buton>
      </div>
      <div className="px-3 py-1 bg-amber-50 border-t border-amber-200 text-[0.62rem] leading-tight text-amber-900 shrink-0">
        Demo asistan: yanıtlar ekrandaki veriden ve kullanım rehberinden kural tabanlı üretilir;
        dış bir yapay zekâ servisine bağlanılmaz.
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
  12) KABUK VE UYGULAMA
   ══════════════════════════════════════════════════════════════════════════ */

function Uygulama() {
  const [s, gonder] = useReducer(indirgeyici, null, baslangicDurumu);
  const [gunlukAcik, setGunlukAcik] = useState(false);
  const [smsAcik, setSmsAcik] = useState(false);
  const [yeniForm, setYeniForm] = useState(null);
  const [menuAcik, setMenuAcik] = useState(false);
  const [komutAcik, setKomutAcik] = useState(false);
  const [botAcik, setBotAcik] = useState(false);
  /* Yardımcı ilk kez dikkat çeksin: bir süre sonra kendini tanıtan baloncuk açılır,
     kullanıcı kapatınca ya da yardımcıyı bir kez açınca bir daha çıkmaz. */
  const [botBalonu, setBotBalonu] = useState(false);
  useEffect(() => {
    if (botAcik) { setBotBalonu(false); return; }
    let gosterildi = false;
    try { gosterildi = localStorage.getItem('msfh_bot_tanitim') === '1'; } catch (_) {}
    if (gosterildi) return;
    const t = setTimeout(() => {
      setBotBalonu(true);
      try { localStorage.setItem('msfh_bot_tanitim', '1'); } catch (_) {}
    }, 6000);
    return () => clearTimeout(t);
  }, [botAcik]);
  const [rehberKonu, setRehberKonu] = useState(null);

  useEffect(() => { document.documentElement.style.setProperty('--olcek', String(s.olcek)); }, [s.olcek]);

  const { dolu, temizlik } = useMemo(() => dolulukKur(s.rezervasyonlar), [s.rezervasyonlar]);
  const k = s.kullanici;

  const izin = (x) => yetkiVar(k, x);
  const sayfalar = SAYFALAR.filter(x => izin(x.izin));
  const menuSayfalari = sayfalar.filter(x => !x.gizli);   /* şerit ve ana menü kartları */
  const aktif = s.ekran === 'ANA_MENU' ? null : (sayfaBul(s.ekran) || sayfalar[0]);
  const tesisler = TESISLER.filter(t => tesisYetkisi(k, t.kod));
  const tesisAdi = (TESISLER.find(t => t.kod === s.tesis) || {}).ad || 'Misafirhane';
  const git = (kod, konu) => {
    gonder({ tip: 'EKRAN', ekran: kod });
    setMenuAcik(false);
    if (kod === 'REHBER') setRehberKonu(konu || null);
  };

  /* Ctrl/⌘ + K her yerden komut aramasını açar */
  useEffect(() => {
    const tus = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setKomutAcik(x => !x); }
    };
    window.addEventListener('keydown', tus);
    return () => window.removeEventListener('keydown', tus);
  }, []);

  /* Ana menü kartlarındaki canlı sayılar */
  const sayilar = useMemo(() => {
    const tesisYatak = s.yataklar.filter(y => y.tesis === s.tesis);
    let doluSayi = 0;
    for (const y of tesisYatak) if (dolu.has(y.id + '|' + s.bugun)) doluSayi++;
    const bos = tesisYatak.length - doluSayi;
    const kapsam = s.rezervasyonlar.filter(r => r.tesis === s.tesis);
    const ufuk = ekle(s.bugun, 21);
    const bekleyen = kapsam.filter(r => ['TALEP', 'PESINAT_BEKLENIYOR'].includes(r.statu) &&
      r.gelis_tarihi >= s.bugun && r.gelis_tarihi <= ufuk && r.misafirler.some(g => !g.yatakId)).length;
    const tahsilat = kapsam.filter(r => !['IPTAL', 'CIKIS'].includes(r.statu) &&
      (r.pesinat_tutari || 0) > (r.tahsil_edilen || 0)).length;
    const konaklayan = kapsam.filter(r => r.statu === 'KONAKLIYOR').length;
    const onayBekleyen = kapsam.filter(r => r.dekont && r.dekont.durum === 'YUKLENDI').length;
    const oran = tesisYatak.length ? Math.round(doluSayi / tesisYatak.length * 100) : 0;
    return {
      OZET:          { deger: '%' + oran, etiket: 'bugünkü doluluk' },
      TAKVIM:        { deger: bos, etiket: 'bugün boş yatak', renk: 'text-emerald-700' },
      ODALAR:        { deger: `${doluSayi}/${tesisYatak.length}`, etiket: 'yatak dolu' },
      YATAK_LISTESI: { deger: doluSayi, etiket: 'kayıtlı misafir' },
      TALEPLER:      { deger: bekleyen, etiket: '21 gün içinde yerleştirme bekleyen', renk: bekleyen ? 'text-amber-600' : 'text-slate-400' },
      TAHSILAT:      { deger: tahsilat, etiket: 'tahsilat bekleyen kayıt', renk: tahsilat ? 'text-rose-600' : 'text-slate-400' },
      ONAY:          { deger: onayBekleyen, etiket: 'dekont müdür onayında', renk: onayBekleyen ? 'text-sky-600' : 'text-slate-400' },
      STATU:         { deger: konaklayan, etiket: 'hâlen konaklayan' },
      KAHVALTI:      { deger: Object.values(s.kahvalti[s.tesis + '|' + s.bugun] || {}).filter(Boolean).length,
                       etiket: 'bugün kahvaltı yapmadı', renk: 'text-rose-600' },
      AY_SONU:       { deger: (s.raporlar || []).filter(r => r.tesis === s.tesis && r.durum === 'TALEP').length,
                       etiket: 'bekleyen belge talebi', renk: 'text-amber-600' },
      KULLANICILAR:  { deger: s.kullanicilar.length, etiket: 'tanımlı kullanıcı' },
      REHBER:        { deger: REHBER_KONULARI.length, etiket: 'anlatım başlığı', renk: 'text-slate-500' },
    };
  }, [s.rezervasyonlar, s.yataklar, s.tesis, s.bugun, dolu, s.kullanicilar.length]);

  if (!k) return <GirisEkrani kullanicilar={s.kullanicilar} gonder={gonder} />;

  const seciliRez = s.seciliRezId ? s.rezervasyonlar.find(r => r.id === s.seciliRezId) : null;
  const ortak = { s, gonder, dolu, temizlik, acYeniKayit: setYeniForm, izin, git, seciliRez };

  return (
    <div className="min-h-screen flex flex-col">
      {/* Üst bant — sade */}
      <header className="bg-ttk-800 text-white">
        <div className="sayfa-govde px-3 py-2 flex items-center gap-3 flex-wrap">
          <button onClick={() => git('ANA_MENU')} className="flex items-center gap-2 hover:opacity-90 min-w-0"
            data-ipucu="Ana menüye dön — bütün sayfaların kart görünümü">
            <TtkLogo boyut="h-11 w-auto" />
            <div className="leading-tight text-left min-w-0">
              <div className="font-bold text-sm tracking-wide">TTKNET</div>
              <div className="text-2xs text-ttk-200 truncate">{tesisAdi} Bilgi Sistemi</div>
            </div>
          </button>

          <div className="ml-auto flex items-center gap-1.5 flex-wrap justify-end text-xs">
            <span className="px-2 py-1 rounded bg-amber-400 text-amber-950 font-bold text-2xs"
              data-ipucu="Bu bir demo prototiptir; gerçek misafir verisi kullanılmaz">DEMO</span>
            <button onClick={() => git('REHBER')} data-ipucu="Kullanım rehberi — hangi işlem hangi sayfada, adım adım"
              className={`flex items-center gap-1 px-2 py-1 rounded text-2xs font-semibold transition-colors
                ${s.ekran === 'REHBER' ? 'bg-ttk-600 text-white' : 'text-ttk-100 hover:bg-ttk-700'}`}>
              <Ikon ad="rehber" sinif="w-4 h-4" /> Rehber
            </button>
            <button onClick={() => gonder({ tip: 'CIKIS' })} aria-label="Oturumu kapat"
              data-ipucu="Oturumu kapat — giriş ekranına döner"
              className="p-1.5 rounded-full text-ttk-100 hover:bg-rose-500/80 hover:text-white transition-colors">
              <Ikon ad="guc" sinif="w-5 h-5" />
            </button>
          </div>
        </div>

        {/* Sayfa şeridi ve işlem araması (arama, üstteki çıkış düğmesiyle sağdan hizalı) */}
        <nav className="bg-ttk-900/40 border-t border-ttk-700">
          <div className="sayfa-govde px-3 flex items-center gap-2 sm:gap-3 flex-wrap sm:flex-nowrap">
          <div className="flex items-center gap-1 overflow-x-auto kaydir min-w-0 flex-1 order-1">
            <button onClick={() => git('ANA_MENU')} data-ipucu="Bütün sayfaların kart görünümü"
              className={`flex items-center gap-1.5 px-2.5 py-2 text-xs font-semibold whitespace-nowrap border-b-2 transition-colors
                ${s.ekran === 'ANA_MENU' ? 'border-white text-white' : 'border-transparent text-ttk-200 hover:text-white'}`}>
              <Ikon ad="menu" sinif="w-3.5 h-3.5" /> Ana Menü
            </button>
            <span className="w-px h-5 bg-ttk-700 mx-1" />
            {menuSayfalari.map(x => (
              <button key={x.kod} onClick={() => git(x.kod)} data-ipucu={x.aciklama}
                className={`flex items-center gap-1.5 px-2.5 py-2 text-xs font-semibold whitespace-nowrap border-b-2 transition-colors
                  ${s.ekran === x.kod ? 'border-white text-white' : 'border-transparent text-ttk-200 hover:text-white'}`}>
                <Ikon ad={x.ikon} sinif="w-3.5 h-3.5" /> {x.kisa}
              </button>
            ))}
          </div>

          {/* İşlem araması — her yerden Ctrl + K */}
          <button onClick={() => setKomutAcik(true)}
            data-ipucu="Sayfa, işlem, misafir ya da rezervasyon no arayın (Ctrl + K)"
            className="order-2 shrink-0 w-full sm:w-64 min-w-[9rem] my-1 flex items-center gap-2 px-2.5 py-1 rounded-lg
                       bg-ttk-800/70 hover:bg-ttk-700 border border-ttk-600 text-ttk-100 transition-colors">
            <Ikon ad="ara" sinif="w-4 h-4 shrink-0" />
            <span className="text-xs truncate">Hangi işlemi yapmak istiyorsunuz?</span>
          </button>
          </div>
        </nav>
      </header>

      <main className="flex-1 p-3">
        <div className="sayfa-govde">
          {s.ekran === 'ANA_MENU'
            ? <AnaMenu s={s} sayfalar={menuSayfalari} sayilar={sayilar} git={git} gonder={gonder}
                tesisler={tesisler} acYeniKayit={setYeniForm} izin={izin} />
            : !aktif || !izin(aktif.izin)
              ? <YetkiUyarisi metin={`Bu sayfa ${rolAd(k.rol)} rolüne kapalıdır. Yetki için Bilgi İşlem Şube Müdürlüğü ile görüşünüz.`} />
              : <>
                  {['OZET', 'TAKVIM', 'YATAK_LISTESI'].includes(s.ekran) && <DolulukPanosu {...ortak} bolum={s.ekran} />}
                  {['TALEPLER', 'ODALAR'].includes(s.ekran) && <RezervasyonEkrani {...ortak} bolum={s.ekran} />}
                  {s.ekran === 'ONAY' && <OnayEkrani {...ortak} />}
                  {['TAHSILAT', 'STATU'].includes(s.ekran) && <PesinatEkrani {...ortak} bolum={s.ekran} />}
                  {s.ekran === 'KAHVALTI' && <KahvaltiEkrani s={s} gonder={gonder} izin={izin} />}
                  {s.ekran === 'AY_SONU' && <AySonuEkrani s={s} gonder={gonder} izin={izin} />}
                  {s.ekran === 'KULLANICILAR' && <KullaniciEkrani s={s} gonder={gonder} />}
                  {s.ekran === 'REHBER' && <RehberEkrani s={s} git={git} izin={izin} baslangicKonu={rehberKonu} />}
                </>}
        </div>
      </main>

      {/* Alt bant */}
      <footer className="bg-slate-200 border-t border-slate-300">
        <div className="sayfa-govde px-3 py-1 flex items-center gap-3 text-2xs text-slate-600 flex-wrap">
          <span className="num font-semibold" title={`${k.ad} · ${rolAd(k.rol)}`}>{k.kod}</span>
          <span className="num">{tr(s.bugun)}</span>
          <button onClick={() => setGunlukAcik(true)} className="flex-1 min-w-[12rem] text-left truncate hover:text-ttk-700"
            data-ipucu="İşlem günlüğü — bütün kayıt, tahsilat ve statü hareketleri">
            <b className="mr-1">Son işlem:</b>{s.gunluk[0] ? s.gunluk[0].metin : '—'}
          </button>
          <button onClick={() => setSmsAcik(true)} className="flex items-center gap-1 hover:text-ttk-700"
            data-ipucu="Misafirlere gönderilen bilgilendirme SMS'leri">
            ✉ SMS <b className="num">{s.smsler.length}</b>
          </button>
          <span className="num">Kayıt: {s.rezervasyonlar.length}</span>
          <span className="num text-slate-500">v{SURUM}</span>
        </div>
      </footer>

      <OlcekKontrol olcek={s.olcek} gonder={gonder} />

      {/* Yardımcı bot — madenci bareti takan maskot */}
      <YardimBotu s={s} izin={izin} git={git} dolu={dolu} temizlik={temizlik} acik={botAcik} setAcik={setBotAcik} />
      {!botAcik && (
        <div className="fixed right-3 bottom-[9.5rem] z-40 flex items-end gap-2 print:hidden">
          {botBalonu && (
            <button onClick={() => { setBotAcik(true); setBotBalonu(false); }}
              className="relative bg-white border-2 border-ttk-600 rounded-xl shadow-xl px-3 py-2 max-w-[15rem]
                         text-left text-xs text-slate-700 hover:bg-ttk-50 bel">
              <b className="block text-ttk-800">Yardım ister misiniz?</b>
              <span className="text-2xs text-slate-500">Doluluk sorun ya da bir işlemin nasıl yapıldığını öğrenin.</span>
              <span onClick={e => { e.stopPropagation(); setBotBalonu(false); }} role="button" aria-label="Baloncuğu kapat"
                className="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-slate-200 hover:bg-slate-300
                           text-slate-600 text-xs flex items-center justify-center">×</span>
              <span className="absolute -right-1.5 bottom-4 w-3 h-3 bg-white border-r-2 border-b-2 border-ttk-600 rotate-[-45deg]" />
            </button>
          )}
          <button onClick={() => { setBotAcik(true); setBotBalonu(false); }} aria-label="Yardımcıyı aç"
            data-ipucu="Madenci — doluluk sorun, bir işlemin nasıl yapıldığını öğrenin"
            className={`w-[4.5rem] h-[4.5rem] rounded-full bg-white border-[3px] border-ttk-600 shadow-2xl
                        flex items-center justify-center hover:scale-105 active:scale-95 transition-transform
                        ${botBalonu ? 'maskot-halka' : ''}`}>
            <Maskot sinif="w-14 h-14 maskot-salla" />
          </button>
        </div>
      )}

      {smsAcik && <SmsGunlugu smsler={s.smsler} kapat={() => setSmsAcik(false)} />}

      {komutAcik && (
        <KomutArama s={s} izin={izin} git={git} gonder={gonder} acYeniKayit={setYeniForm}
          tesisler={tesisler} kapat={() => setKomutAcik(false)} />
      )}

      <IpucuKatmani />

      {yeniForm && (
        <YeniRezervasyonFormu s={s} gonder={gonder} dolu={dolu} temizlik={temizlik}
          onDolgu={yeniForm} kapat={() => setYeniForm(null)} />
      )}

      {gunlukAcik && (
        <Modal baslik="İşlem Günlüğü" genislik="max-w-3xl" kapat={() => setGunlukAcik(false)}>
          <ul className="text-xs space-y-1">
            {s.gunluk.map((g, i) => (
              <li key={i} className={`flex gap-2 px-2 py-1.5 rounded border
                ${g.tip === 'uyari' ? 'bg-amber-50 border-amber-200' : g.tip === 'basari' ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
                <span className="num text-slate-500 w-20 shrink-0">{tr(g.tarih)}</span>
                <span className="flex-1">{g.metin}</span>
              </li>
            ))}
          </ul>
        </Modal>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('kok')).render(<Uygulama />);
</script>
</body>
</html>
